.sk-av { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; font-size: 14px; font-weight: 700; flex: none; overflow: hidden; line-height: 1; }
.sk-av .ap-ic, .sk-av svg { width: 62%; height: 62%; }
.sk-av.xs { width: 24px; height: 24px; border-radius: 6px; font-size: 12px; }
.sk-mbody { min-width: 0; }
.sk-mhead { display: flex; align-items: baseline; gap: 6px; line-height: 1.35; }
.sk-mhead .sk-appb { align-self: center; }
.sk-name { font-weight: 700; font-size: 15px; color: var(--slack-ink); white-space: nowrap; }
.sk-time { font-size: 12px; color: var(--slack-muted); white-space: nowrap; }
.sk-text { color: var(--slack-ink); overflow-wrap: anywhere; }
.sk-text p { margin: 0; } .sk-text p + p { margin-top: 6px; }
.sk-text b, .sk-text strong, .sk-att b { font-weight: 700; }
.sk-text a, .sk-att a { color: var(--slack-link); text-decoration: none; }
.sk-text code, .sk-att code { font-family: var(--mono); font-size: 12px; color: var(--slack-code-ink); background: var(--slack-code-bg); border: 1px solid var(--slack-border); border-radius: 3px; padding: 1px 3px; }
.sk-text pre { font-family: var(--mono); font-size: 12px; line-height: 1.5; background: var(--slack-code-bg); border: 1px solid var(--slack-border); border-radius: 4px; padding: 8px 10px; margin: 4px 0 0; white-space: pre-wrap; }
.sk-text ul, .sk-text ol { margin: 2px 0; padding-left: 24px; }
.sk-mention { color: var(--slack-mention-ink); background: var(--slack-mention-bg); border-radius: 3px; padding: 0 2px; }
.sk-mention.bc { color: var(--slack-bc-ink); background: var(--slack-bc-bg); }
.sk-att { position: relative; margin-top: 6px; padding: 2px 0 2px 16px; max-width: 620px; }
.sk-att::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 8px; background: var(--sk-bar, var(--slack-att-gray)); }
.sk-c-green { --sk-bar: var(--slack-att-green); } .sk-c-amber { --sk-bar: var(--slack-att-amber); } .sk-c-red { --sk-bar: var(--slack-att-red); } .sk-c-blue { --sk-bar: var(--slack-att-blue); }
.sk-att-pre { margin-bottom: 4px; }
.sk-att-title { font-weight: 700; }
.sk-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; margin-top: 8px; }
.sk-f { min-width: 0; } .sk-f.wide { grid-column: 1 / -1; }
.sk-fk { font-weight: 700; }
.sk-att-foot { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--slack-muted); }
.sk-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.sk-btn { height: 28px; padding: 0 12px; display: inline-flex; align-items: center; border-radius: 4px; border: 1px solid var(--slack-border-strong); font-size: 13px; font-weight: 700; color: var(--slack-ink); background: var(--slack-bg); box-sizing: border-box; white-space: nowrap; }
.sk-btn.primary { background: var(--slack-btn); border-color: var(--slack-btn); color: var(--slack-btn-ink); }
.sk-btn.danger { color: var(--slack-danger); }
.sk-reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.sk-react { height: 24px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 5px; padding: 0 8px 0 6px; border-radius: 12px; background: var(--slack-chip); border: 1px solid transparent; font-size: 12px; font-weight: 700; color: var(--slack-ink); line-height: 1; }
.sk-react .sk-emo { font-size: 15px; line-height: 1; }
.sk-react.me { background: var(--slack-me-bg); border-color: var(--slack-me-border); color: var(--slack-link); }
.sk-react.add { color: var(--slack-muted); padding: 0 7px; } .sk-react.add .ap-ic { width: 16px; height: 16px; }
.sk-replies { display: flex; align-items: center; gap: 5px; margin: 4px 0 0 -4px; padding: 4px; font-size: 13px; border-radius: 6px; white-space: nowrap; }
.sk-rn { color: var(--slack-link); font-weight: 700; margin-left: 3px; }
.sk-rlast { color: var(--slack-muted); overflow: hidden; text-overflow: ellipsis; }

/* Slack: composer, typing, thread */
.sk-comp { flex: none; margin: 0 20px; border: 1px solid var(--slack-border-strong); border-radius: 8px; background: var(--slack-bg); overflow: hidden; }
.sk-fmt { display: flex; align-items: center; gap: 1px; height: 36px; padding: 0 6px; background: var(--slack-surface); color: var(--slack-muted); white-space: nowrap; overflow: hidden; }
.sk-tb { width: 28px; height: 28px; flex: none; border-radius: 4px; display: grid; place-items: center; color: var(--slack-muted); }
.sk-tb .ap-ic { width: 17px; height: 17px; }
.sk-fb { font-size: 15px; font-family: var(--font); color: var(--slack-muted); }
.sk-fb.b { font-weight: 800; } .sk-fb.i { font-style: italic; font-family: var(--serif); font-size: 16px; } .sk-fb.s { text-decoration: line-through; }
.sk-sep { width: 1px; height: 20px; background: var(--slack-border); margin: 0 4px; flex: none; }
.sk-input { min-height: 22px; max-height: 132px; overflow-y: auto; padding: 9px 12px 3px; outline: none; color: var(--slack-ink); white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; }
.sk-input:empty::before { content: attr(data-ph); color: var(--slack-muted); pointer-events: none; }
.sk-also { display: flex; align-items: center; gap: 8px; padding: 2px 12px 0; font-size: 13px; color: var(--slack-muted); }
.sk-also b { font-weight: 400; color: var(--slack-ink); }
.sk-cb { width: 14px; height: 14px; border: 1px solid var(--slack-border-strong); border-radius: 3px; box-sizing: border-box; }
.sk-cbar { display: flex; align-items: center; gap: 1px; height: 42px; padding: 0 6px; color: var(--slack-muted); }
.sk-cplus { width: 26px; height: 26px; border-radius: 50%; background: var(--slack-chip); display: grid; place-items: center; margin-right: 4px; flex: none; } .sk-cplus .ap-ic { width: 16px; height: 16px; }
.sk-aa { font-size: 14px; font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
.sk-send { display: flex; align-items: center; height: 28px; border-radius: 4px; padding: 0 2px 0 6px; color: var(--slack-muted); opacity: 0.6; flex: none; }
.sk-send .ap-ic { width: 16px; height: 16px; } .sk-send .ap-ic:last-child { width: 14px; height: 14px; }
.sk-send .sk-sep { height: 18px; margin: 0 4px; background: currentColor; opacity: 0.3; }
.sk-comp.has .sk-send { background: var(--slack-btn); color: var(--slack-btn-ink); opacity: 1; }
.sk-typing { flex: none; height: 24px; padding: 3px 20px 0; font-size: 12px; color: var(--slack-muted); white-space: nowrap; overflow: hidden; box-sizing: border-box; }
.sk-typing b { font-weight: 700; color: var(--slack-ink); }
.sk-thread { display: none; width: var(--sk-tw, 400px); flex: none; flex-direction: column; background: var(--slack-bg); border-left: 1px solid var(--slack-border); }
.slackui.thread-open .sk-thread { display: flex; }
.sk-thead { flex: none; height: 50px; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0 10px 0 16px; border-bottom: 1px solid var(--slack-border); }
.sk-thead b { font-size: 18px; font-weight: 700; }
.sk-tch { font-size: 13px; color: var(--slack-muted); margin-left: 8px; }
.sk-thead .sk-sbtn { color: var(--slack-muted); }
.sk-rdiv { display: flex; align-items: center; gap: 12px; padding: 6px 20px; font-size: 13px; color: var(--slack-muted); flex: none; }
.sk-rdiv::after { content: ""; flex: 1; border-top: 1px solid var(--slack-border); }

/* Google Sheets */
.sh-app { display: flex; flex-direction: column; background: var(--sheet-chrome); color: var(--sheet-ink); font-size: 14px; line-height: 1.3; overflow: hidden; }
.sh-title { flex: none; display: flex; align-items: center; gap: 10px; height: 64px; padding: 0 16px 0 14px; }
.sh-logo { width: 26px; height: 36px; flex: none; margin-right: 4px; }
.sh-logo svg { stroke: none; }
.sh-logo .sh-lbg { fill: var(--sheet-icon); } .sh-logo .sh-lfold { fill: var(--sheet-icon-ink); opacity: 0.35; }
.sh-logo .sh-lgrid { fill: none; stroke: var(--sheet-icon-ink); stroke-width: 1.6; stroke-linejoin: miter; stroke-linecap: butt; }

.sh-c.sh-t-blue { color: var(--blue); } .sh-c.sh-t-purple { color: var(--purple); } .sh-c.sh-t-green { color: var(--green); } .sh-c.sh-t-amber { color: var(--amber); }

/* ---- consoleUI (trigger & webhook dev console) + statusDock ---- */
.consoleui { position: absolute; z-index: 2; overflow: hidden; font-family: var(--font); border-radius: 12px; box-shadow: 0 0 0 1px var(--con-border), 0 18px 50px rgba(0, 0, 0, 0.14); }
.consoleui.bleed { border-radius: 0; box-shadow: none; }
.consoleui svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.cn-app { display: flex; flex-direction: column; gap: 14px; padding: 18px 20px 20px; box-sizing: border-box; background: var(--con-bg); color: var(--con-ink); font-size: 15px; line-height: 1.4; overflow: hidden; }
.cn-app code, .cn-rt.mono, .cn-ids, .cn-td, .cn-rn, .cn-url, .cn-hdrs, .cn-json, .cn-time { font-family: var(--mono); }
.cn-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; flex: none; }
.cn-ttl { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; }
.cn-sub { font-size: 13.5px; color: var(--con-muted); font-family: var(--mono); margin-top: 2px; }
.cn-chips { margin-left: auto; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.cn-chips.full { margin-left: 0; justify-content: flex-start; width: 100%; }
.cn-chip { display: inline-flex; align-items: center; gap: 6px; height: 27px; padding: 0 8px 0 9px; border-radius: 14px; border: 1px solid var(--con-border); background: var(--con-bg); color: var(--con-ink); font-size: 12.5px; font-weight: 600; white-space: nowrap; box-sizing: border-box; }
.cn-chip .cn-st { font: 700 9.5px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.05em; padding: 2.5px 5.5px; border-radius: 5px; background: color-mix(in srgb, var(--con-ink) 8%, transparent); color: var(--con-muted); font-style: normal; }
.cn-chip .cn-st.cn-b-skill { background: var(--blue-bg); color: var(--blue); }
.cn-chip .cn-st.cn-b-mcp { background: var(--purple-bg); color: var(--purple); }
.cn-chip .cn-st.cn-b-hook { background: var(--amber-bg); color: var(--amber); }
.cn-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--con-missing); }
.cn-chip.live .cn-dot { background: var(--con-live); box-shadow: 0 0 0 3px color-mix(in srgb, var(--con-live) 22%, transparent); }
.cn-chip.simulated .cn-dot { background: var(--con-sim); }
.cn-chip.missing { color: var(--con-muted); } .cn-chip.missing .cn-dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--con-missing); }
.cn-chip.error .cn-dot { background: var(--con-error); } .cn-chip.error { color: var(--con-error); border-color: color-mix(in srgb, var(--con-error) 45%, transparent); }
.cn-chip.checking .cn-dot { animation: cn-pulse 1.1s ease-in-out infinite; }
@keyframes cn-pulse { 50% { opacity: 0.25; } }
.cn-chip.replay .cn-dot { background: transparent; box-shadow: inset 0 0 0 2px var(--con-sim); }

/* Wi-Fi fallback toggle on the live demo slides (live.js replayToggle). Lives on <body>, outside the scaled stage. */
.buck-replay-toggle { position: fixed; left: 12px; bottom: 10px; z-index: 60; display: inline-flex; align-items: center; gap: 7px; font: 500 11px/1 "Google Sans", system-ui, sans-serif; color: #e3e3e3; background: rgba(20, 21, 25, 0.72); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 999px; padding: 6px 11px 6px 9px; cursor: pointer; opacity: 0.45; transition: opacity 0.18s ease, background 0.18s ease; }
.buck-replay-toggle:hover, .buck-replay-toggle.on { opacity: 1; background: rgba(20, 21, 25, 0.9); }
.buck-replay-toggle i { width: 8px; height: 8px; border-radius: 50%; background: #34a853; flex: none; }
.buck-replay-toggle.on i { background: transparent; box-shadow: inset 0 0 0 2px #f9ab00; }
.buck-replay-toggle.on { color: #fde293; border-color: rgba(249, 171, 0, 0.5); }
.buck-replay-toggle:disabled { cursor: default; opacity: 0.3; }

.cn-acts { display: flex; flex-wrap: wrap; gap: 8px; flex: none; }

.cn-tt { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---- flat / borderless slide & primitive mode ---- */

.stage.slide.flat .box,
.stage.slide.flat .panel:not(.dashed),
.stage.slide.flat .scard,
.stage.slide.flat .quote,
.stage.slide.flat .card,
.stage.slide.flat .tree,
.stage.slide.flat .table,
.stage.slide.flat .pills .pill,
.stage.slide.flat .chip,
.stage.slide.flat .prose code,
.stage.slide.flat .bullets code,
.stage.slide.flat .quote code { border-color: transparent; box-shadow: none; }
.stage.slide.flat .box:not(.blue):not(.green):not(.purple):not(.amber):not(.red):not(.teal):not(.pink):not(.ink):not(.strong):not(.ghost),
.box.flat:not(.blue):not(.green):not(.purple):not(.amber):not(.red):not(.teal):not(.pink):not(.ink):not(.strong):not(.ghost) { background: var(--surface-2); }
.stage.slide.flat .quote, .quote.flat { background: var(--surface-2); }

.stage.slide.flat .table:not(.plain), .table.flat:not(.plain) { background: var(--surface-2); }
.stage.slide.flat .card .bar, .card.flat .bar { border-bottom-color: rgba(255, 255, 255, 0.06); }
.stage.slide.flat .card.light .bar, .card.light.flat .bar { border-bottom-color: rgba(0, 0, 0, 0.05); }

/* ---- terminalUI (interactive live CLI terminal) ---- */
.terminalui { position: absolute; z-index: 2; overflow: hidden; border-radius: 16px; background: #13151A; }
.terminalui.bleed { border-radius: 0; }
.tui-app { display: flex; flex-direction: column; background: #13151A; color: #E6EDF3; font-family: var(--mono); box-sizing: border-box; overflow: hidden; }
.tui-bar { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 18px; background: #1A1D24; flex: none; }
.tui-dots { display: flex; gap: 7px; flex: none; }

.tui-title { font-family: var(--mono); font-size: 13px; color: #9DA7B3; font-weight: 500; letter-spacing: 0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tui-status { margin-left: auto; display: flex; align-items: center; }
.tui-badge { display: inline-flex; align-items: center; gap: 6px; font: 600 11.5px/1 var(--font); padding: 5px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); color: #C9D1D9; }

.tui-badge.running i { background: #8AB4F8; animation: cn-pulse 1s ease-in-out infinite; }

/* ---- workspaceUI (live workspace explorer + diff + run comparison) ---- */

.wui-tab.on { background: var(--ink); color: var(--bg); font-weight: 600; }

.wui-tab i.mod { background: var(--green-bg); color: var(--green); }

.wui-rstat.blue { background: var(--blue-bg); color: var(--blue); }

/* Deck Presenter Shell */
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #F7F7F5;
  font-family: "Google Sans", system-ui, sans-serif;
  user-select: none;
}
html[data-theme="dark"], html[data-theme="dark"] body {
  background: #131314;
}
#deck-viewport {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  transition: bottom 0.22s ease;
  overflow: hidden;
}
body[data-notes="1"] #deck-viewport {
  bottom: 185px;
}
#stage-scale-wrap {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1920px;
  height: 1080px;
  transform-origin: center center;
  transform: translate(-50%, -50%);
  user-select: text;
}
#stage-scale-wrap .slidenum { display: none; }
#notes-drawer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 185px;
  background: rgba(18, 19, 23, 0.96);
  color: #f1f3f4;
  border-top: 1px solid rgba(255, 255, 255, 0.15);
  padding: 16px 36px 20px;
  z-index: 40;
  display: none;
  overflow-y: auto;
  box-sizing: border-box;
  user-select: text;
}
body[data-notes="1"] #notes-drawer {
  display: block;
}
#notes-drawer .ntitle {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #8ab4f8;
  margin-bottom: 6px;
  font-weight: 600;
}
#notes-drawer .nbody {
  font-size: 16.5px;
  line-height: 1.55;
  max-width: 1440px;
  color: #e8eaed;
  white-space: pre-wrap;
}
/* HUD: a small counter pill in the corner; full controls slide out on hover */
#deck-hud-zone {
  position: fixed;
  right: 0;
  bottom: 0;
  padding: 24px 12px 10px 48px;
  z-index: 50;
}
#deck-hud {
  font: 500 11px/1 "Google Sans", system-ui, sans-serif;
  color: #e3e3e3;
  background: rgba(20, 21, 25, 0.72);
  backdrop-filter: blur(10px);
  padding: 4px;
  border-radius: 999px;
  display: flex;
  gap: 4px;
  align-items: center;
  border: 1px solid rgba(255, 255, 255, 0.12);
  opacity: 0.45;
  transition: opacity 0.18s ease, background 0.18s ease;
}
#deck-hud-zone:hover #deck-hud, #deck-hud:focus-within {
  opacity: 1;
  background: rgba(20, 21, 25, 0.9);
}
#deck-hud .count {
  padding: 3px 8px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
#deck-hud .more {
  display: flex;
  gap: 4px;
  align-items: center;
  max-width: 0;
  opacity: 0;
  overflow: hidden;
  transition: max-width 0.22s ease, opacity 0.18s ease;
}
#deck-hud-zone:hover .more, #deck-hud:focus-within .more {
  max-width: 560px;
  opacity: 1;
}
#deck-hud select {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 999px;
  padding: 3px 8px;
  font: inherit;
  cursor: pointer;
  outline: none;
  max-width: 230px;
}
#deck-hud select option {
  background: #18191d;
  color: #fff;
}
#deck-hud button {
  border: 0;
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
  font: inherit;
  padding: 3px 8px;
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s;
}
#deck-hud button:hover, #deck-hud button.on {
  background: #1a73e8;
}
#btn-comment-quick {
  background: rgba(26, 115, 232, 0.28);
  border: 1px solid rgba(138, 180, 248, 0.35);
}
body[data-comment-mode="1"] #btn-comment-quick {
  background: #1a73e8;
  color: #fff;
}

/* Click-to-Comment UI */
#comment-banner {

}
.cmt-hover-target {

  border-radius: 6px;
}
.cmt-pin {
  position: absolute;
  width: 32px;
  height: 32px;
  margin-left: -16px;
  margin-top: -16px;
  border-radius: 50% 50% 50% 4px;
  background: #1a73e8;

  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.32);

.cmt-pin span {

.cmt-pin:hover, .cmt-pin.active {

#cmt-popover {

}
#cmt-popover.open {

}
#cmt-popover .cmt-ctx {

  color: #8ab4f8;
  background: rgba(138, 180, 248, 0.12);

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#cmt-popover textarea {
  width: 100%;
  min-height: 78px;
  box-sizing: border-box;
  background: #131418;
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 8px;
  padding: 8px 10px;
  font: 400 13.5px/1.45 "Google Sans", system-ui, sans-serif;
  resize: vertical;
  outline: none;
}
#cmt-popover textarea:focus {
  border-color: #8ab4f8;
}
#cmt-popover .cmt-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 8px;
  gap: 6px;
}
#cmt-popover .cmt-actions .right {
  display: flex;
  gap: 6px;
}
#cmt-popover button {
  border: 0;
  border-radius: 6px;
  padding: 6px 11px;
  font: 500 12px/1 "Google Sans", system-ui, sans-serif;
  cursor: pointer;
  background: rgba(255, 255, 255, 0.12);
  color: #e8eaed;
}
#cmt-popover button.primary {
  background: #1a73e8;
  color: #fff;
}
#cmt-popover button.danger {
  background: rgba(217, 48, 37, 0.22);
  color: #f28b82;
}
#comments-drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: 360px;
  background: rgba(22, 23, 28, 0.97);
  color: #e8eaed;
  border-left: 1px solid rgba(255, 255, 255, 0.14);

#comments-drawer.open {

}
#comments-drawer .cd-head {

<script>
// === kit.js ===
// DevSite-style diagram kit: core.
// Everything is placed in absolute stage coordinates (CSS px). Helpers attach
// data-* attributes so scripts/check.ts can verify layout (overlaps, arrows).
// Families:
//   circles  node(), port(), arrow(), elbow(), chips(), legend(), group()

      if (opts.sub) g.appendChild(svgEl("text", { x: mx + off, y: my + 34, "text-anchor": "start", class: "sub " + (opts.subCls || "") }, opts.sub));
      if (opts.badge) { badge(g, mx, my, opts.badge); gapStart = my - 18; gapEnd = my + 18; }
    } else if (opts.label) {
      const side = opts.labelSide;
      const lx = side === "right" ? mx + 18 : side === "left" ? mx - 18 : mx;
      const ly = side === "above" ? my - 16 : side === "below" ? my + 34 : my + 8;
      const anchor = side === "right" ? "start" : side === "left" ? "end" : "middle";
      const nl = String(opts.label).split("\n").length - 1, lift = side === "above" ? nl * 12 : side === "below" ? nl * 12 : 0;
      g.appendChild(svgText({ x: lx, y: ly + (side === "below" ? lift : -lift), "text-anchor": anchor, class: opts.labelCls || "" }, opts.label));
      if (opts.sub) g.appendChild(svgEl("text", { x: lx, y: ly + 24 + nl * 24, "text-anchor": anchor, class: "sub " + (opts.subCls || "") }, opts.sub));
      if (opts.badge) { badge(g, mx, my, opts.badge); if (horiz) { gapStart = mx - 18; gapEnd = mx + 18; } else { gapStart = my - 18; gapEnd = my + 18; } }
    } else if (opts.badge) {
      badge(g, mx, my, opts.badge);
      if (horiz) { gapStart = mx - 18; gapEnd = mx + 18; } else { gapStart = my - 18; gapEnd = my + 18; }
    }

    const line = (d) => g.insertBefore(svgEl("path", { d, class: (cls + " line").trim() }), g.firstChild);
    if (gapStart == null) {
      line(`M${x1} ${y1} L${x2} ${y2}`);
    } else if (horiz) {
      const a = x2 > x1 ? [gapStart, gapEnd] : [gapEnd, gapStart];
      line(`M${x1} ${y1} L${a[0]} ${y1}`);
      line(`M${a[1]} ${y1} L${x2} ${y2}`);
    } else {
      const a = y2 > y1 ? [gapStart, gapEnd] : [gapEnd, gapStart];
      line(`M${x1} ${y1} L${x1} ${a[0]}`);
      line(`M${x1} ${a[1]} L${x2} ${y2}`);
    }
    if (opts.arrow !== false) arrowhead(g, x1, y1, x2, y2, cls);
    if (opts.both) arrowhead(g, x2, y2, x1, y1, cls);
    return g;
  }

  // elbow(st, points, opts): orthogonal polyline through points [[x,y],...].
  // opts: label, lx, ly, sub, sy, anchor, cls, labelCls, subCls, badge, bx, by, arrow, both
  function elbow(st, points, opts = {}) {
    const d = points.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join(" ");
    const [x1, y1] = points[0], [x2, y2] = points[points.length - 1], [px_, py_] = points[points.length - 2];
    const g = svgEl("g", { "data-kind": "arrow", "data-x1": x1, "data-y1": y1, "data-x2": x2, "data-y2": y2, "data-label": opts.label || "" });
    st.svg.appendChild(g);
    g.appendChild(svgEl("path", { d, class: ((opts.cls || "") + " line").trim() }));
    if (opts.label) {
      g.appendChild(svgText({ x: opts.lx, y: opts.ly, "text-anchor": opts.anchor || "middle", class: opts.labelCls || "" }, opts.label));
      if (opts.sub) g.appendChild(svgEl("text", { x: opts.lx, y: opts.sy ?? opts.ly + 24, "text-anchor": opts.anchor || "middle", class: "sub " + (opts.subCls || "") }, opts.sub));
    }
    if (opts.badge) badge(g, opts.bx, opts.by, opts.badge);
    if (opts.arrow !== false) arrowhead(g, px_, py_, x2, y2, opts.cls || "");
    if (opts.both) arrowhead(g, points[1][0], points[1][1], x1, y1, opts.cls || "");
    return g;
  }

  // connect(st, a, b, opts): route an orthogonal arrow between two shapes.
  // Picks sides from relative position unless given. opts:
  //   from, to      left|right|top|bottom
  //   fromAt, toAt  0..1 position along the edge (boxes)
  //   gap           px between shape edge and line end (default 8)
  //   via           x (for horizontal routes) or y (vertical) of the middle segment
  //   detour        for same-side loops (right->right): distance past the widest shape
  //   label, sub, cls, labelCls, subCls, badge, arrow, both, labelOn ("first"|"mid"|"last")
  function connect(st, a, b, o = {}) {
    const A = geom(a), B = geom(b);
    const dx = B.cx - A.cx, dy = B.cy - A.cy;
    const shareX = Math.min(A.x1, B.x1) - Math.max(A.x0, B.x0) > 0;
    const shareY = Math.min(A.y1, B.y1) - Math.max(A.y0, B.y0) > 0;
    let from = o.from, to = o.to;
    if (!from || !to) {
      const horizontal = shareY && !shareX ? true : shareX && !shareY ? false : Math.abs(dx) > Math.abs(dy);
      if (horizontal) { from ??= dx > 0 ? "right" : "left"; to ??= dx > 0 ? "left" : "right"; }
      else { from ??= dy > 0 ? "bottom" : "top"; to ??= dy > 0 ? "top" : "bottom"; }
    }
    let rawSpan = Infinity;
    if (from === "bottom" && to === "top") rawSpan = B.y0 - A.y1;
    else if (from === "top" && to === "bottom") rawSpan = A.y0 - B.y1;
    else if (from === "right" && to === "left") rawSpan = B.x0 - A.x1;
    else if (from === "left" && to === "right") rawSpan = A.x0 - B.x1;
    const gap = o.gap ?? (rawSpan < 24 ? Math.max(1, Math.min(8, Math.floor((rawSpan - 8) / 2))) : 8);
    const H = (s) => s === "left" || s === "right";
    const p1 = port(a, from, gap, o.fromAt ?? 0.5), p2 = port(b, to, gap, o.toAt ?? 0.5);
    let pts;
    if (from !== to && (Math.abs(p1[0] - p2[0]) < 0.5 || Math.abs(p1[1] - p2[1]) < 0.5)) pts = [p1, p2];
    else if (!H(from) && !H(to)) {
      let my = o.via;
      if (my == null) my = from === to ? (from === "bottom" ? Math.max(A.y1, B.y1) + (o.detour ?? 48) : Math.min(A.y0, B.y0) - (o.detour ?? 48)) : (p1[1] + p2[1]) / 2;
      pts = [p1, [p1[0], my], [p2[0], my], p2];
    } else if (H(from) && H(to)) {
      let mx = o.via;
      if (mx == null) mx = from === to ? (from === "right" ? Math.max(A.x1, B.x1) + (o.detour ?? 48) : Math.min(A.x0, B.x0) - (o.detour ?? 48)) : (p1[0] + p2[0]) / 2;
      pts = [p1, [mx, p1[1]], [mx, p2[1]], p2];
    } else if (!H(from) && H(to)) pts = [p1, [p1[0], p2[1]], p2];
    else pts = [p1, [p2[0], p1[1]], p2];
    // drop zero-length segments
    pts = pts.filter((p, i) => i === 0 || Math.abs(p[0] - pts[i - 1][0]) > 0.5 || Math.abs(p[1] - pts[i - 1][1]) > 0.5);
    if (pts.length < 2) pts = [p1, p2];

    const base = { cls: o.cls, labelCls: o.labelCls, subCls: o.subCls, badge: o.badge, arrow: o.arrow, both: o.both, sub: o.sub };
    if (pts.length === 2) return arrow(st, [...pts[0], ...pts[1]], { ...base, label: o.label, labelSide: o.labelSide });

    // label on the chosen segment (default: the longest)
    let seg = 0, best = -1;
    const segs = pts.slice(1).map((p, i) => ({ i, len: Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]) }));
    if (o.labelOn === "first") seg = 0; else if (o.labelOn === "last") seg = segs.length - 1; else segs.forEach((s) => { if (s.len > best) { best = s.len; seg = s.i; } });
    const [sa, sb] = [pts[seg], pts[seg + 1]];
    const mx = (sa[0] + sb[0]) / 2, my = (sa[1] + sb[1]) / 2;
    const horiz = Math.abs(sa[1] - sb[1]) < 0.5;
    const opts = { ...base, label: o.label };
    if (o.label) {
      const nl = String(o.label).split("\n").length - 1;
      if (horiz) { opts.lx = mx; opts.ly = my - 14 - nl * 10; opts.anchor = "middle"; opts.sy = my + 30; if (o.labelSide === "below") { opts.ly = my + 32 + nl * 10; opts.sy = my + 56 + nl * 20; } }
      else { opts.lx = mx + 16; opts.ly = my + 8; opts.anchor = "start"; opts.sy = my + 32; if (o.labelSide === "left") { opts.lx = mx - 16; opts.anchor = "end"; } }
      if (o.labelCls == null) opts.labelCls = horiz && o.labelSide == null ? "small halo" : "small";
    }
    if (o.badge) { opts.bx = o.bx ?? (horiz ? sa[0] + (sb[0] - sa[0]) * 0.5 : mx); opts.by = o.by ?? (horiz ? my : sa[1] + (sb[1] - sa[1]) * 0.5); if (o.label && horiz) opts.bx = mx - 24 - (o.badgeOffset ?? 0); }
    return elbow(st, pts, opts);
  }

  // ---------- chips / legend / group ----------
  // chips(st, {x, y, items, label, tone, width}) centered on x
  function chips(st, o) {
    const c = div("chips");
    c.dataset.kind = "chips";
    c.style.left = px(o.x); c.style.top = px(o.y); c.style.width = px(o.width || 460);
    c.innerHTML = (o.label ? `<span class="chip label">${o.label}</span>` : "") + o.items.map((i) => `<span class="chip ${o.tone || ""}">${i}</span>`).join("");
    st.el.appendChild(c);
    return c;
  }

  // legend(st, {x, y, title, items, width}) left-aligned at x; items may contain <code>
  function legend(st, o) {
    const l = div("legend");
    l.dataset.kind = "legend";
    l.style.left = px(o.x); l.style.top = px(o.y); l.style.width = px(o.width || 420);
    l.innerHTML = `<h4>${o.title}</h4><ul>${o.items.map((i) => `<li>${i}</li>`).join("")}</ul>`;
    st.el.appendChild(l);
    return l;
  }

  // bounds(st, items): visible extent {left, top, right, bottom} of nodes,
  // boxes, chips, legends, svg groups or raw elements, in stage coordinates.
  function bounds(st, items) {
    const base = st.el.getBoundingClientRect();
    const b = { left: Infinity, top: Infinity, right: -Infinity, bottom: -Infinity };
    for (const it of items) {
      const el = it.el || it;
      const cl = el.classList || { contains: () => false };
      const leaves = cl.contains("node") ? [...el.children] : cl.contains("chips") ? [...el.querySelectorAll(".chip")] : [el];
      for (const l of leaves) {
        const r = l.getBoundingClientRect();
        if (!r.width && !r.height) continue;
        b.left = Math.min(b.left, r.left - base.left); b.top = Math.min(b.top, r.top - base.top);
        b.right = Math.max(b.right, r.right - base.left); b.bottom = Math.max(b.bottom, r.bottom - base.top);
      }
    }
    return b;
  }

  function frame(st, o) {
    let { left, top, right, bottom } = o;
    if (o.around) {
      const b = bounds(st, o.around), p = o.pad ?? 40;
      const pt = o.padTop ?? p;
      left ??= b.left - p; top ??= b.top - pt; right ??= b.right + p; bottom ??= b.bottom + p;
    }
    return { left, top, right, bottom };
  }

  // group(st, {around: [items], pad, left, top, right, bottom, tag, label, fill})
  // Dashed container drawn behind nodes. Pass `around` to size it from content
  // (+pad, default 40); explicit edges override the measured ones.
  // `tag` is a pill centred on the top border; `label` is a heading above the
  // top-left corner (use one or the other).
  function group(st, o) {
    const { left, top, right, bottom } = frame(st, o);
    const g = div("group" + (o.fill ? " fill" : "") + (o.tone ? " " + o.tone : ""));
    g.dataset.kind = "group";
    g.style.left = px(left); g.style.top = px(top); g.style.width = px(right - left); g.style.height = px(bottom - top);
    if (o.tag) g.innerHTML = `<div class="tag">${o.tag}</div>`;
    else if (o.label) g.innerHTML = `<div class="tag above">${o.label}</div>`;
    st.el.insertBefore(g, st.el.firstChild);
    g.dataset.x = left; g.dataset.y = top; g.dataset.w = right - left; g.dataset.h = bottom - top;
    return Object.assign(g, { kind: "box", x: left, y: top, w: right - left, h: bottom - top, cx: (left + right) / 2, cy: (top + bottom) / 2, el: g });
  }

  // ---------- boxes ----------
  // box(st, {x, y, w, h?, title, sub, body, kicker, icon, tone, shape, size, mono, caps, strong, align, id})
  //   tone:  surface (default) | blue green purple amber red teal pink gray | ink | dashed | ghost
  //   shape: rect (default) | pill | diamond | hex
  //   size:  sm | (default) | lg ; mono: monospaced title ; caps: uppercase mono title
  //   strong: saturated fill + white text (with a color tone)
  // (x, y) is the top-left corner. Height is measured unless given.
  function box(st, o) {
    const el = div(["box", o.tone || "surface", o.shape || "", o.size || "", o.mono ? "mono" : "", o.caps ? "caps" : "", o.strong ? "strong" : "", o.align === "left" ? "left" : "", o.cls || ""].filter(Boolean).join(" "));
    el.style.left = px(o.x); el.style.top = px(o.y); el.style.width = px(o.w);
    if (o.h) el.style.height = px(o.h);
    el.dataset.kind = "box";
    if (o.id) el.id = o.id;
    let html = "";
    if (o.kicker) html += `<div class="kicker">${o.kicker}</div>`;
    if (o.icon && !o.title) html += `<div class="icon-only">${ICONS[o.icon] || ""}</div>`;
    else if (o.title) html += `<div class="head">${o.icon ? ICONS[o.icon] || "" : ""}<div class="title">${o.title}</div></div>`;
    if (o.sub) html += `<div class="sub">${o.sub}</div>`;
    if (o.body) html += `<div class="body">${o.body}</div>`;
    el.innerHTML = html;
    st.el.appendChild(el);
    const h = o.h || el.getBoundingClientRect().height;
    if (o.shape === "diamond" || o.shape === "hex") {
      const w = o.w, s = 22;
      const points = o.shape === "diamond" ? `${w / 2},0 ${w},${h / 2} ${w / 2},${h} 0,${h / 2}` : `${s},0 ${w - s},0 ${w},${h / 2} ${w - s},${h} ${s},${h} 0,${h / 2}`;
      const svg = svgEl("svg", { class: "shape", viewBox: `0 0 ${w} ${h}` });
      svg.appendChild(svgEl("polygon", { points }));
      el.insertBefore(svg, el.firstChild);
    }
    el.dataset.x = o.x; el.dataset.y = o.y; el.dataset.w = o.w; el.dataset.h = h;
    return { el, kind: "box", x: o.x, y: o.y, w: o.w, h, cx: o.x + o.w / 2, cy: o.y + h / 2 };
  }

  // column(st, {x, y, w, gap, items:[boxOpts | null], connect: true|opts, tone, size})
  // Boxes stacked top-down, centered on x. Returns the shapes; null items leave a gap.
  function column(st, o) {
    const out = []; let y = o.y;
    for (const it of o.items) {
      if (!it) { y += (o.gap ?? 40); continue; }
      const w = it.w ?? o.w;
      const b = box(st, { tone: o.tone, size: o.size, ...it, x: o.x - w / 2, y, w });
      out.push(b); y = b.y + b.h + (it.gapAfter ?? o.gap ?? 40);
    }
    if (o.connect) for (let i = 1; i < out.length; i++) connect(st, out[i - 1], out[i], { ...(typeof o.connect === "object" ? o.connect : {}), ...(o.items.filter(Boolean)[i].edge || {}) });
    return out;
  }

  // row(st, {x, y, gap, items:[boxOpts], connect, w, tone, size}) left-to-right, top-aligned at y
  function row(st, o) {
    const out = []; let x = o.x;
    for (const it of o.items) {
      if (!it) { x += (o.gap ?? 60); continue; }
      const w = it.w ?? o.w;
      const b = box(st, { tone: o.tone, size: o.size, ...it, x, y: it.y ?? o.y, w });
      out.push(b); x = b.x + b.w + (it.gapAfter ?? o.gap ?? 60);
    }
    if (o.connect) for (let i = 1; i < out.length; i++) connect(st, out[i - 1], out[i], { ...(typeof o.connect === "object" ? o.connect : {}), ...(o.items.filter(Boolean)[i].edge || {}) });
    return out;
  }

  // panel(st, {x, y, w, h | around, pad, title, sub, tone, big, cls})
  //   tone: (default surface-2) | surface | plain | dashed | hatch | blue green red amber purple
  // A titled container behind boxes; title sits inside the top-left.
  function panel(st, o) {
    const { left, top, right, bottom } = o.around ? frame(st, { ...o, padTop: o.padTop ?? (o.pad ?? 40) + (o.title ? 30 : 0) + (o.sub ? 20 : 0) }) : { left: o.x, top: o.y, right: o.x + o.w, bottom: o.y + o.h };
    const p = div("panel " + (o.tone || "") + (o.cls ? " " + o.cls : ""));
    p.dataset.kind = "panel";
    p.style.left = px(left); p.style.top = px(top); p.style.width = px(right - left); p.style.height = px(bottom - top);
    p.innerHTML = (o.title ? `<div class="ptitle${o.big ? " big" : ""}">${o.title}</div>` : "") + (o.sub ? `<div class="psub">${o.sub}</div>` : "");
    st.el.insertBefore(p, st.el.firstChild);
    const head = stageRect(st, p);
    const inner = { x: left + 22, y: top + 18 + (o.title ? (o.big ? 34 : 24) : 0) + (o.sub ? 22 : 0) + (o.title || o.sub ? 14 : 0), right: right - 22, bottom: bottom - 18 };
    p.dataset.x = left; p.dataset.y = top; p.dataset.w = right - left; p.dataset.h = bottom - top;
    return { el: p, kind: "box", x: left, y: top, w: right - left, h: bottom - top, cx: (left + right) / 2, cy: (top + bottom) / 2, inner };
  }

  // tile(st, {x, y, w, h, title, sub, icon, tone, body})
  // A card with a header strip (title + optional sub) and a large icon (or free
  // HTML) in the body. It is a box for every other purpose: arrows stop at its
  // edge, port()/connect() work, the checker treats it as hard.
  function tile(st, o) {
    const el = div(["box", "tile", o.tone || "surface", o.cls || ""].filter(Boolean).join(" "));
    el.style.left = px(o.x); el.style.top = px(o.y); el.style.width = px(o.w ?? 220);
    if (o.h) el.style.height = px(o.h);
    el.dataset.kind = "box";
    if (o.id) el.id = o.id;
    el.innerHTML = `<div class="thead"><div class="title">${o.title}</div>${o.sub ? `<div class="sub">${o.sub}</div>` : ""}</div>` +
      `<div class="tbody"${o.bodyH ? ` style="height:${o.bodyH}px"` : ""}>${o.body ?? (o.icon ? ICONS[o.icon] || "" : "")}</div>`;
    st.el.appendChild(el);
    const w = o.w ?? 220, h = o.h || el.getBoundingClientRect().height;
    el.dataset.x = o.x; el.dataset.y = o.y; el.dataset.w = w; el.dataset.h = h;
    return { el, kind: "box", x: o.x, y: o.y, w, h, cx: o.x + w / 2, cy: o.y + h / 2 };
  }

  // hub(st, {cx, cy, center, spokes: {top, right, bottom, left}, gap, w, h, pair})
  // A centre tile with up to four satellite tiles and a pair of arrows to each:
  // solid centre→spoke and dashed spoke→centre by default. `center` and each
  // spoke are tile() options; a spoke may add `out` / `in` (arrow options, or
  // false to omit that direction). `gap` is the distance between the edges.
  // Returns { center, spokes: { top, right, bottom, left } }.
  function hub(st, o) {
    const w = o.w ?? 200, h = o.h ?? 190, gap = o.gap ?? 120;
    const center = tile(st, { w, h, ...o.center, x: o.cx - w / 2, y: o.cy - h / 2 });
    const pos = {
      top: [o.cx - w / 2, o.cy - h / 2 - gap - h], bottom: [o.cx - w / 2, o.cy + h / 2 + gap],
      left: [o.cx - w / 2 - gap - w, o.cy - h / 2], right: [o.cx + w / 2 + gap, o.cy - h / 2],
    };
    const opp = { top: "bottom", bottom: "top", left: "right", right: "left" };
    const spokes = {};
    for (const side of ["top", "right", "bottom", "left"]) {
      const s = o.spokes?.[side]; if (!s) continue;
      const { out, in: back, ...tileOpts } = s;
      const t = spokes[side] = tile(st, { w, h, ...tileOpts, x: pos[side][0], y: pos[side][1] });
      // vertical spokes split the width; horizontal spokes sit in the body, below the header strip
      const horiz = side === "left" || side === "right";
      const a = o.pair === false ? 0.5 : horiz ? 0.56 : 0.42, b = o.pair === false ? 0.5 : horiz ? 0.74 : 0.58;
      if (out !== false) connect(st, center, t, { from: side, to: opp[side], fromAt: a, toAt: a, ...(o.out || {}), ...(out || {}) });
      if (back !== false && o.pair !== false) connect(st, t, center, { from: opp[side], to: side, fromAt: b, toAt: b, cls: "dash", ...(o.in || {}), ...(back || {}) });
    }
    return { center, spokes };
  }

  // ---------- text ----------
  // title(st, {x, y, w, text, muted, sub, small, center})
  function title(st, o) {
    const t = div("dtitle" + (o.small ? " small" : "") + (o.center ? " center" : ""));
    t.dataset.kind = "text";
    t.style.left = px(o.x); t.style.top = px(o.y);
    if (o.w) t.style.width = px(o.w);
    t.innerHTML = (o.text ?? o.title ?? "") + (o.muted ? ` <span class="muted">${o.muted}</span>` : "") + (o.sub ? `<span class="sub">${o.sub}</span>` : "");
    st.el.appendChild(t);
    return Object.assign({ el: t, kind: "box" }, stageRect(st, t));
  }

  // caption(st, {x, y, w, html}) centered muted text (use for the one-line takeaway under a diagram)
  function caption(st, o) {
    const c = div("caption");
    c.dataset.kind = "text";
    c.style.left = px(o.x); c.style.top = px(o.y); c.style.width = px(o.w);
    c.innerHTML = o.html || o.text;
    st.el.appendChild(c);
    return Object.assign({ el: c, kind: "box" }, stageRect(st, c));
  }

  // anno(st, {x, y, w, html, mono, align, cls}) annotation text; target of leader()
  function anno(st, o) {
    const a = div("anno" + (o.mono ? " mono" : "") + (o.cls ? " " + o.cls : ""));
    a.dataset.kind = "anno";
    a.style.left = px(o.x); a.style.top = px(o.y); if (o.w) a.style.width = px(o.w);
    if (o.align) a.style.textAlign = o.align;
    a.innerHTML = o.html || o.text;
    st.el.appendChild(a);
    const r = stageRect(st, a);
    a.dataset.x = r.x; a.dataset.y = r.y; a.dataset.w = r.w; a.dataset.h = r.h;
    return { el: a, kind: "box", ...r, cx: r.x + r.w / 2, cy: r.y + r.h / 2 };
  }

  // leader(st, from:[x,y], to:[x,y], {cls, elbow, jogX, pin}) thin dotted line without a head, optionally with one bend (elbow: "h" | "v") and hollow anchor circle (pin: true | "start" | "end" | "both")
  function leader(st, from, to, o = {}) {
    const cls = o.cls ?? "dot thin";
    let g;
    if (o.elbow === "h") g = elbow(st, [from, [to[0], from[1]], to], { cls, arrow: false });
    else if (o.elbow === "v") g = elbow(st, [from, [from[0], to[1]], to], { cls, arrow: false });
    else if (Math.abs(from[0] - to[0]) > 0.5 && Math.abs(from[1] - to[1]) > 0.5) {
      const jx = o.jogX ?? (from[0] + to[0]) / 2;
      g = elbow(st, [from, [jx, from[1]], [jx, to[1]], to], { cls, arrow: false });
    }
    else g = arrow(st, [...from, ...to], { cls, arrow: false });
    if (o.pin === true || o.pin === "start" || o.pin === "both") {
      g.appendChild(svgEl("circle", { cx: from[0], cy: from[1], r: o.pinR ?? 4, class: "pin" }));
    }
    if (o.pin === "end" || o.pin === "both") {
      g.appendChild(svgEl("circle", { cx: to[0], cy: to[1], r: o.pinR ?? 4, class: "pin" }));
    }
    return g;
  }

  // brace(st, {x, y1, y2, side: "left"|"right" | y, x1, x2, side: "top"|"bottom", label, sub, w, tick})
  // Square bracket with optional midpoint tick (defaults to false in dmi theme, true otherwise).
  function brace(st, o) {
    const w = o.w ?? 10;
    const isDmi = document.documentElement.dataset.theme === "dmi";
    const tick = o.tick ?? !isDmi;
    const g = svgEl("g", { "data-kind": "brace", class: "brace" });
    st.svg.appendChild(g);
    if (o.side === "top" || o.side === "bottom") {
      const s = o.side === "bottom" ? 1 : -1, xm = (o.x1 + o.x2) / 2;
      const tickPath = tick ? ` M${xm} ${o.y} V${o.y + s * w}` : "";
      g.appendChild(svgEl("path", { class: "brace", d: `M${o.x1} ${o.y - s * w} V${o.y} H${o.x2} V${o.y - s * w}${tickPath}` }));
      if (o.label) {
        const ty = o.y + s * ((tick ? w : 2) + 20);
        g.appendChild(svgText({ x: xm, y: ty, "text-anchor": "middle", class: "small" }, o.label));
        if (o.sub) g.appendChild(svgEl("text", { x: xm, y: ty + 20, "text-anchor": "middle", class: "sub" }, o.sub));
      }
      return g;
    }
    const s = o.side === "right" ? 1 : -1, ym = (o.y1 + o.y2) / 2;
    const tickPath = tick ? ` M${o.x} ${ym} H${o.x + s * w}` : "";
    g.appendChild(svgEl("path", { class: "brace", d: `M${o.x - s * w} ${o.y1} H${o.x} V${o.y2} H${o.x - s * w}${tickPath}` }));
    if (o.label) {
      const tx = o.x + s * ((tick ? w : 0) + 14);
      g.appendChild(svgText({ x: tx, y: ym + (o.sub ? -2 : 5), "text-anchor": s > 0 ? "start" : "end", class: "small" }, o.label));
      if (o.sub) g.appendChild(svgEl("text", { x: tx, y: ym + 22, "text-anchor": s > 0 ? "start" : "end", class: "sub" }, o.sub));
    }
    return g;
  }

  // curve(st, a, b, opts) or curve(st, [x1,y1,x2,y2], opts)
  // Smooth cubic Bezier S-curve arrow between two shapes (or points), e.g. for
  // autoregressive token loops from output[i] back to input[i+1].
  function curve(st, a, b, o = {}) {
    let x1, y1, x2, y2, from = o.from || "right", to = o.to || "left";
    if (Array.isArray(a)) {
      [x1, y1, x2, y2] = a;
      o = b || {};
      from = o.from || "right"; to = o.to || "left";
    } else {
      const gap = o.gap ?? 5;
      [x1, y1] = port(a, from, o.fromGap ?? gap, o.fromAt ?? 0.5);
      [x2, y2] = port(b, to, o.toGap ?? gap, o.toAt ?? 0.5);
    }
    const cls = o.cls || "thin";
    const dx = x2 - x1, dy = y2 - y1;
    let cx1, cy1, cx2, cy2;
    if (o.c1 && o.c2) {
      [cx1, cy1] = o.c1; [cx2, cy2] = o.c2;
    } else if ((from === "right" || from === "left") && (to === "left" || to === "right")) {
      const s1 = from === "right" ? 1 : -1, s2 = to === "left" ? -1 : 1;
      const bow = o.bow ?? Math.max(Math.abs(dx) * 0.68, 28);
      cx1 = x1 + s1 * bow; cy1 = y1;
      cx2 = x2 + s2 * bow; cy2 = y2;
    } else {
      const s1 = from === "bottom" ? 1 : -1, s2 = to === "top" ? -1 : 1;
      const bow = o.bow ?? Math.max(Math.abs(dy) * 0.5, 36);
      cx1 = x1; cy1 = y1 + s1 * bow;
      cx2 = x2; cy2 = y2 + s2 * bow;
    }
    const g = svgEl("g", { "data-kind": "arrow", "data-x1": x1, "data-y1": y1, "data-x2": x2, "data-y2": y2, "data-label": o.label || "" });
    st.svg.appendChild(g);
    g.appendChild(svgEl("path", { d: `M${x1} ${y1} C${cx1} ${cy1} ${cx2} ${cy2} ${x2} ${y2}`, class: (cls + " line").trim() }));
    if (o.label) {
      const lx = o.lx ?? (x1 + x2) / 2, ly = o.ly ?? (y1 + y2) / 2;
      g.appendChild(svgText({ x: lx, y: ly, "text-anchor": o.anchor || "middle", class: o.labelCls || "small halo" }, o.label));
    }
    if (o.arrow !== false) arrowhead(g, cx2, cy2, x2, y2, cls);
    return g;
  }

  // arrowLegend(st, {x, y, gap, lineW, items:[{cls, label}]})
  // Inline horizontal legend of sample SVG arrows + labels (e.g. solid = chain of thought, dotted = opaque computation).
  function arrowLegend(st, o) {
    const lineW = o.lineW ?? 34, itemGap = o.gap ?? 36;
    const g = svgEl("g", { "data-kind": "legend", class: "alegend" });
    st.svg.appendChild(g);
    const entries = o.items.map((it) => {
      const t = svgEl("text", { x: 0, y: o.y + 5, class: "small" }, it.label);
      g.appendChild(t);
      const tw = t.getBBox().width;
      return { it, t, w: lineW + 10 + tw };
    });
    const totalW = entries.reduce((acc, e) => acc + e.w, 0) + itemGap * Math.max(0, entries.length - 1);
    let cx = o.align === "left" ? o.x : o.x - totalW / 2;
    for (const e of entries) {
      const cls = e.it.cls || "thin";
      const x1 = cx, x2 = cx + lineW;
      g.appendChild(svgEl("path", { d: `M${x1} ${o.y} L${x2} ${o.y}`, class: (cls + " line").trim() }));
      arrowhead(g, x1, o.y, x2, o.y, cls);
      e.t.setAttribute("x", x2 + 10);
      cx += e.w + itemGap;
    }
    return g;
  }

  // layerMesh(st, {colCenters, topY, botY, mode: "bipartite"|"serial", steps, band:{x,y,w,h,tone}, units, unitGap, r, passArrow, passPad, dir, cls})
  // Draws the internal layer structure inside a horizontal computation band and returns
  // anchor shapes `cols[i].top` and `cols[i].bottom` for connecting input/output tokens.
  function layerMesh(st, o) {
    const cols = o.colCenters || [];
    const topY = o.topY, botY = o.botY, midY = (topY + botY) / 2;
    const r = o.r ?? 5.5, units = o.units ?? 3, unitGap = o.unitGap ?? 17;
    const mode = o.mode || "bipartite";
    const steps = o.steps ?? 1;
    const cls = o.cls || "dot thin";
    const g = svgEl("g", { "data-kind": "mesh", class: "mesh" });
    st.svg.appendChild(g);

    if (o.band) {
      g.appendChild(svgEl("rect", {
        x: o.band.x ?? 1,
        y: o.band.y,
        width: o.band.w,
        height: o.band.h,
        class: "band " + (o.band.tone || "pink"),
      }));
    }

    const passYs = [];
    if (mode === "serial" && steps > 1) {
      for (let s = 1; s <= steps; s++) {
        passYs.push(topY + ((botY - topY) * s) / (steps + 1));
      }
    } else {
      passYs.push(midY);
    }

    const outCols = cols.map((cx, idx) => {
      if (mode === "bipartite") {
        const xs = Array.from({ length: units }, (_, k) => cx + (k - (units - 1) / 2) * unitGap);
        for (const xTop of xs) {
          for (const xBot of xs) {
            g.appendChild(svgEl("line", { x1: xTop, y1: topY, x2: xBot, y2: botY, class: "hair" }));
          }
        }
        for (const x of xs) {
          g.appendChild(svgEl("circle", { cx: x, cy: topY, r, class: "unit" }));
          g.appendChild(svgEl("circle", { cx: x, cy: botY, r, class: "unit" }));
        }
      } else if (mode === "serial") {
        const up = o.dir === "up";
        const gapMid = 7;
        const stops = [topY, ...passYs, botY];
        for (let k = 0; k < stops.length - 1; k++) {
          const yA = stops[k] + (k === 0 ? 0 : gapMid);
          const yB = stops[k + 1] - (k === stops.length - 2 ? 0 : gapMid);
          const [y1, y2] = up ? [yB, yA] : [yA, yB];
          g.appendChild(svgEl("path", { d: `M${cx} ${y1} L${cx} ${y2}`, class: (cls + " line").trim() }));
          arrowhead(g, cx, y1, cx, y2, cls);
        }
      }
      if (mode === "bipartite" && o.inBoxes && o.inBoxes[idx]) {
        const [, yStart] = port(o.inBoxes[idx], "bottom", o.gap ?? 3);
        const yEnd = topY - r - (o.gap ?? 3);
        g.appendChild(svgEl("path", { d: `M${cx} ${yStart} L${cx} ${yEnd}`, class: (cls + " line").trim() }));
        arrowhead(g, cx, yStart, cx, yEnd, cls);
      }
      if (mode === "bipartite" && o.outBoxes && o.outBoxes[idx]) {
        const yStart = botY + r + (o.gap ?? 3);
        const [, yEnd] = port(o.outBoxes[idx], "top", o.gap ?? 3);
        g.appendChild(svgEl("path", { d: `M${cx} ${yStart} L${cx} ${yEnd}`, class: (cls + " line").trim() }));
        arrowhead(g, cx, yStart, cx, yEnd, cls);
      }
      return {
        cx,
        top: { kind: "box", x: cx - 6, y: topY - r, w: 12, h: r * 2, cx, cy: topY },
        bottom: { kind: "box", x: cx - 6, y: botY - r, w: 12, h: r * 2, cx, cy: botY },
      };
    });

    if (o.passArrow !== false && cols.length >= 2) {
      const pad = o.passPad ?? (mode === "bipartite" ? (units - 1) * unitGap * 0.5 + 14 : 0);
      const x1 = mode === "bipartite" ? cols[0] - pad : cols[0] + 5;
      const x2 = mode === "bipartite" ? cols[cols.length - 1] + pad : cols[cols.length - 1] - 5;
      for (const py of passYs) {
        g.appendChild(svgEl("path", { d: `M${x1} ${py} L${x2} ${py}`, class: (cls + " line").trim() }));
        arrowhead(g, x1, py, x2, py, cls);
      }
    }
    return { g, cols: outCols, topY, botY, midY };
  }

  // specCard(st, {x, y, w, h?, title?, badge?, badgeTone?, sections:[{kicker?, body?, bodyCls?, note?, noteCls?, tone?, grow?, items?:[{title, muted?, text}]}]})
  // Structured multi-section card for Prompt / Reasoning Excerpt / Response & Outcome comparisons.
  function specCard(st, o) {
    const el = div("box scard-dmi left" + (o.cls ? " " + o.cls : ""));
    el.style.left = px(o.x); el.style.top = px(o.y); el.style.width = px(o.w);
    if (o.h) el.style.height = px(o.h);
    el.dataset.kind = "box";
    let html = "";
    if (o.title || o.badge) {
      html += `<div class="shead"><div class="stitle">${o.title || ""}</div>` +
        (o.badge ? `<span class="sbadge ${o.badgeTone || ""}">${o.badge}</span>` : "") +
        `</div>`;
    }
    const sections = o.sections || (o.sub || o.items ? [{
      kicker: o.sub,
      items: (o.items || []).map((it) => typeof it === "string" ? { text: it } : Array.isArray(it) ? { title: it[0], text: it[1] } : it),
    }] : []);
    sections.forEach((s, idx) => {
      const cls = ["ssec", idx === 0 && !o.title && !o.badge ? "first" : "", s.tone || "", s.grow ? "grow" : ""].filter(Boolean).join(" ");
      html += `<div class="${cls}">`;
      if (s.kicker) html += `<div class="skicker">${s.kicker}</div>`;
      if (s.body) html += `<div class="sbody ${s.bodyCls || ""}">${s.body}</div>`;
      if (s.note) html += `<div class="snote ${s.noteCls || ""}">${s.note}</div>`;
      if (s.items) {
        for (const it of s.items) {
          html += `<div class="sitem">` +
            (it.title ? `<div class="sitem-title">${it.title}${it.muted ? ` <span class="muted">${it.muted}</span>` : ""}</div>` : "") +
            (it.text ? `<div class="sitem-txt">${it.text}</div>` : "") +
            `</div>`;
        }
      }
      html += `</div>`;
    });
    el.innerHTML = html;
    st.el.appendChild(el);
    const h = o.h || el.getBoundingClientRect().height;
    el.dataset.x = o.x; el.dataset.y = o.y; el.dataset.w = o.w; el.dataset.h = h;
    return { el, kind: "box", x: o.x, y: o.y, w: o.w, h, cx: o.x + o.w / 2, cy: o.y + h / 2 };
  }

  // swatches(st, {x, y, items:[{tone | line, label}]}) legend row for cell tones or line styles
  //   tone: amber blue purple green red dashed gray ; line: "" | "dash" | "dot" (+ " g" | " b" | " r")
  function swatches(st, o) {
    const s = div("swatches");
    s.dataset.kind = "legend";
    s.style.left = px(o.x); s.style.top = px(o.y);
    s.innerHTML = o.items.map((i) => `<span class="sw"><i class="${i.line != null ? "line " + i.line : (i.tone || "") + (i.dot ? " dot" : "")}"></i>${i.label}</span>`).join("");
    st.el.appendChild(s);
    return s;
  }

  // steps(st, {x, y, gap, items:[{n, title, code}]}) numbered list with optional monospaced block per item
  function steps(st, o) {
    const out = []; let y = o.y;
    o.items.forEach((it, i) => {
      const s = div("step"); s.dataset.kind = "text";
      s.style.left = px(o.x); s.style.top = px(y);
      s.innerHTML = `<span class="n">${it.n ?? i + 1}</span><span><div>${it.title}</div>${it.code ? `<div class="pre">${it.code}</div>` : ""}</span>`;
      st.el.appendChild(s);
      const r = stageRect(st, s); out.push({ el: s, kind: "box", ...r, cx: r.x + r.w / 2, cy: r.y + r.h / 2 });
      y = r.y + r.h + (o.gap ?? 28);
    });
    return out;
  }

  // ---------- neural architecture primitives ----------
  const escTag = (s) => String(s).replace(/^<([\w-]+)>$/, "&lt;$1&gt;");

  // tokenRow(st, {x|cx, y, tokens:[str|{text,tone}], tags?:[{text,tone}], pos?:"top"|"bottom"|"pill", gap?, id?})
  // Horizontal strip of token capsules centered on x at y, with optional modality tags above.
  function tokenRow(st, o) {
    const cx = o.x ?? o.cx, y = o.y ?? o.cy;
    const pos = o.pos || "top";
    const el = div("tokens " + pos + (o.cls ? " " + o.cls : ""));
    el.dataset.kind = "tokens";
    if (o.id) el.id = o.id;
    let html = "";
    if (o.tags && o.tags.length) {
      html += `<div class="ttags"${o.gap != null ? ` style="gap:${o.gap}px"` : ""}>` +
        o.tags.map((t) => {
          const it = typeof t === "string" ? { text: t } : t;
          return `<span class="ttag ${it.tone || "green"}">${escTag(it.text)}</span>`;
        }).join("") + `</div>`;
    }
    html += `<div class="tcaps"${o.gap != null ? ` style="gap:${o.gap}px"` : ""}>` +
      (o.tokens || []).map((t) => {
        if (t === "..." || t === "⋯") return `<span class="tdots">⋯</span>`;
        const it = typeof t === "string" ? { text: t } : t;
        return `<span class="tcap ${it.tone || "ink"}">${escTag(it.text)}</span>`;
      }).join("") + `</div>`;
    el.innerHTML = html;
    el.style.left = "0px"; el.style.top = px(y);
    st.el.appendChild(el);
    const r0 = stageRect(st, el);
    const left = Math.round(cx - r0.w / 2);
    el.style.left = px(left);
    el.dataset.x = left; el.dataset.y = y; el.dataset.w = r0.w; el.dataset.h = r0.h;
    return { el, kind: "box", x: left, y, w: r0.w, h: r0.h, cx, cy: y + r0.h / 2 };
  }

  const VEC_PALETTES = {
    gray:   ["#D4D4D8", "#71717A", "#F4F4F5", "#27272A"],
    gray1:  ["#D4D4D8", "#71717A", "#F4F4F5", "#27272A"],
    gray2:  ["#3F3F46", "#E4E4E7", "#A1A1AA", "#52525B"],
    gray3:  ["#A1A1AA", "#27272A", "#D4D4D8", "#71717A"],
    pair1:  ["#71717A", "#F4F4F5"],
    pair2:  ["#3F3F46", "#E4E4E7"],
    pair3:  ["#D4D4D8", "#27272A"],
    red:    ["#EF5350", "#E57373", "#FFCDD2", "#B71C1C"],
    blue:   ["#3949AB", "#7986CB", "#C5CAE9", "#1A237E"],
    amber:  ["#C0CA33", "#DCE775", "#F0F4C3", "#827717"],
    teal:   ["#00ACC1", "#4DD0E1", "#B2EBF2", "#006064"],
    green:  ["#2E7D32", "#66BB6A", "#C8E6C9", "#1B5E20"],
    pink:   ["#D81B60", "#F06292", "#F8BBD0", "#880E4F"],
    purple: ["#5E35B1", "#9575CD", "#D1C4E9", "#311B92"],
    red4:   ["#EF5350", "#E57373", "#FFCDD2", "#B71C1C"],
    blue4:  ["#3949AB", "#7986CB", "#C5CAE9", "#1A237E"],
    green4: ["#43A047", "#81C784", "#C8E6C9", "#1B5E20"],
  };

  // vecStrip(st, {x|cx, y, vectors?:[paletteName | colorArray | "..."], groups?:[int], tones?:[str], dotsAfter?:[int], cellW?, cellH?, gap?, id?})
  // Horizontal row of segmented embedding vectors centered on x at y.
  function vecStrip(st, o) {
    const cx = o.x ?? o.cx, y = o.y ?? o.cy;
    const cw = o.cellW ?? 13, ch = o.cellH ?? 14;
    const el = div("vecstrip" + (o.cls ? " " + o.cls : ""));
    el.dataset.kind = "vecstrip";
    if (o.id) el.id = o.id;
    if (o.gap != null) el.style.gap = px(o.gap);
    let items = o.vectors;
    if (!items && o.groups) {
      items = [];
      const grays = ["gray1", "gray2", "gray3"];
      o.groups.forEach((n, idx) => {
        const tone = (o.tones && o.tones[idx]) || grays[idx % grays.length];
        const pal = VEC_PALETTES[tone] || VEC_PALETTES.gray1;
        const arr = [];
        for (let i = 0; i < n; i++) arr.push(pal[i % pal.length]);
        items.push(arr);
        if (o.dotsAfter && o.dotsAfter.includes(idx)) items.push("...");
      });
    }
    el.innerHTML = (items || ["gray1", "gray2", "gray3"]).map((v) => {
      if (v === "..." || v === "⋯") return `<span class="vdots">⋯</span>`;
      const cells = Array.isArray(v) ? v : (VEC_PALETTES[v] || VEC_PALETTES.gray1).slice(0, 4);
      return `<span class="vvec">` + cells.map((c) => `<i class="vcell" style="width:${cw}px;height:${ch}px;background:${c}"></i>`).join("") + `</span>`;
    }).join("");
    el.style.left = "0px"; el.style.top = px(y);
    st.el.appendChild(el);
    const r0 = stageRect(st, el);
    const left = Math.round(cx - r0.w / 2);
    el.style.left = px(left);
    el.dataset.x = left; el.dataset.y = y; el.dataset.w = r0.w; el.dataset.h = r0.h;
    return { el, kind: "box", x: left, y, w: r0.w, h: r0.h, cx, cy: y + r0.h / 2 };
  }

  // sumNode(st, {x|cx, y|cy, r?}) circular '+' residual addition operator centered at (x, y).
  function sumNode(st, o) {
    const cx = o.x ?? o.cx, cy = o.y ?? o.cy;
    const r = o.r ?? 13, d = r * 2;
    const left = Math.round(cx - r), top = Math.round(cy - r);
    const el = div("box sumnode" + (o.cls ? " " + o.cls : ""));
    if (o.id) el.id = o.id;
    el.style.left = px(left); el.style.top = px(top);
    el.style.width = px(d); el.style.height = px(d);
    el.dataset.kind = "box";
    el.dataset.x = left; el.dataset.y = top; el.dataset.w = d; el.dataset.h = d;
    el.innerHTML = `<div class="title">+</div>`;
    st.el.appendChild(el);
    return { el, kind: "box", x: left, y: top, w: d, h: d, cx: left + r, cy: top + r };
  }

  // residual(st, {spineX, fromY, toSum, leftX, cls?}) orthogonal residual bypass arrow from spine into sumNode.
  function residual(st, o) {
    const end = port(o.toSum, "left", o.gap ?? 3);
