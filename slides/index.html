      if (line.startsWith("+")) return `<span class="tr-dl add">${esc(line.slice(1)) || " "}</span>`;
      if (line.startsWith("-")) return `<span class="tr-dl del">${esc(line.slice(1)) || " "}</span>`;
      return `<span class="tr-dl">${esc(line.startsWith(" ") ? line.slice(1) : line) || " "}</span>`;
    }).join("");
  }

  function renderTraceRow(it) {
    if (it.note != null) return `<div class="tr-row"><div class="tr-note lbl">${esc(it.note)}</div></div>`;
    const st = it.status || "";
    const hasDetail = Boolean(it.text || it.html || it.code || it.output || it.error || it.diff || (it.badges && it.badges.length) || (it.items && it.items.length));
    const isCollapsible = Boolean(it.collapsible || it.open != null || hasDetail);
    const isOpen = it.open ?? hasDetail;
    const leadSvg = inferTraceIcon(it);
    const desc = it.desc ?? it.description;
    const isMonoDesc = it.mono || (desc && /^[+−-]\d+/.test(String(desc).trim()));
    let trailHtml = "";
    if (it.trailing !== false) {
      if (it.trailing === "ext" || it.link) trailHtml = `<span class="tr-ico trail">${ICONS.ext}</span>`;
      else if (it.trailing === "right") trailHtml = `<span class="tr-ico trail">${UI.chevronRight}</span>`;
      else if (isCollapsible) trailHtml = `<span class="tr-ico trail${isOpen ? " open" : ""}">${UI.chevronRight}</span>`;
    }
    const lineHtml = `<div class="tr-line${st ? " " + st : ""}${it.link ? " link" : ""}">
      ${leadSvg ? `<span class="tr-ico lead">${leadSvg}</span>` : ""}
      <span class="tr-title lbl${it.titleMono ? " mono" : ""}">${esc(it.title || "")}</span>
      ${desc != null ? `<span class="tr-desc lbl${isMonoDesc ? " mono" : ""}">${esc(desc)}</span>` : ""}
      ${trailHtml}
    </div>`;

    let bodyHtml = "";
    if (isOpen && hasDetail) {
      let inner = "";
      if (it.text != null || it.html != null) inner += `<div class="tr-text">${it.html != null ? it.html : esc(it.text)}</div>`;
      if (it.code != null || it.output != null) inner += `<div class="tr-code">${esc(it.code ?? it.output)}</div>`;
      if (it.error != null) inner += `<div class="tr-code destructive">${esc(it.error)}</div>`;
      if (it.diff != null) inner += `<div class="tr-code diff">${renderDiffLines(it.diff)}</div>`;
      if (it.badges && it.badges.length) inner += `<div class="tr-badges">${it.badges.map((b) => `<span class="tr-badge lbl">${esc(b)}</span>`).join("")}</div>`;
      if (it.items && it.items.length) inner += `<div class="tr-list">${it.items.map(renderTraceRow).join("")}</div>`;
      bodyHtml = `<div class="tr-body">${inner}</div>`;
    }
    return `<div class="tr-row">${lineHtml}${bodyHtml}</div>`;
  }

  // trace(st, { x, y, w = 440, frame = "card" | "bare", title, items: [...] })
  function trace(st, o = {}) {
    const frame = o.frame || (o.plain ? "bare" : "card");
    const w = o.w ?? 440;
    const root = div(`trace ${frame}${o.cls ? " " + o.cls : ""}`);
    root.dataset.kind = "trace";
    root.style.left = px(o.x); root.style.top = px(o.y); root.style.width = px(w);
    if (o.title) root.insertAdjacentHTML("beforeend", `<div class="tr-head lbl">${esc(o.title)}</div>`);
    const list = div("tr-list");
    root.appendChild(list);
    const items = o.items || [];
    const rowEls = items.map((it) => {
      const wrap = document.createElement("div");
      wrap.innerHTML = renderTraceRow(it);
      const el = wrap.firstElementChild;
      list.appendChild(el);
      return el;
    });
    st.el.appendChild(root);
    const r = stageRect(st, root);
    root.dataset.x = r.x; root.dataset.y = r.y; root.dataset.w = r.w; root.dataset.h = r.h;
    const rows = rowEls.map((el, i) => ({ el, ...stageRect(st, el), item: items[i] }));
    return { el: root, kind: "box", ...r, cx: r.x + r.w / 2, cy: r.y + r.h / 2, rows };
  }

  function chatUI(st, o = {}) {
    const frame = o.frame || "phone", style = o.style || "plain", accent = o.accent || "blue";
    const w = o.w ?? (frame === "card" ? 760 : 420);
    const root = div(`chatui ${frame} ${style} ${accent}${o.h ? " fixed" : ""}`);
    root.dataset.kind = "chatui";
    root.style.left = px(o.x); root.style.top = px(o.y); root.style.width = px(w);
    if (o.h) root.style.height = px(o.h);

    // header
    const hd = o.header === false ? null : Object.assign({ name: o.name ?? "Assistant" }, typeof o.header === "object" ? o.header : {});
    if (hd) {
      root.insertAdjacentHTML("beforeend", `<div class="chd">
        <span class="cic">${ico("menu")}</span>
        <span class="cname lbl">${esc(hd.name)}</span>
        ${hd.model ? `<span class="cmodel lbl">${esc(hd.model)}${ico("chevron")}</span>` : ""}
        <span class="cgrow"></span>
        <span class="cic">${ico("compose")}</span>
        ${hd.avatar ? `<span class="cavatar">${esc(hd.avatar)}</span>` : ""}
      </div>`);
    }

    // messages
    const body = div("cbody"); root.appendChild(body);
    const mark = `<span class="cmark">${ICONS[o.icon || "gemini"] || ""}</span>`;
    const items = o.items || [];
    const rowEls = items.map((m) => {
      let el;
      if (m.divider != null) { el = div("cdiv"); el.innerHTML = `<span class="lbl">${esc(m.divider)}</span>`; }
      else if (m.chips && !m.role) { el = div("cchips"); el.innerHTML = m.chips.map((c) => `<span class="cchip lbl">${esc(c)}</span>`).join(""); }
      else if (m.trace && !m.role) {
        el = div("c-trace tr-list");
        el.innerHTML = m.trace.map(renderTraceRow).join("");
      }
      else if (m.tools) {
        el = div("ctools");
        el.innerHTML = m.tools.map((t, j) => {
          const status = t.status || "done";
          const glyph = status === "done" ? ico("check") : status === "running" ? ico("spin") : status === "error" ? ico("x") : ico("dot");
          return `<div class="ctool ${status}">
            <span class="cnum">${t.n ?? j + 1}</span>
            <span class="cticon">${toolIcon(t)}</span>
            <span class="ctxt"><span class="ctname lbl">${esc(t.name)}</span>${t.args ? `<span class="ctargs">${esc(t.args)}</span>` : ""}${t.result ? `<span class="ctres">${esc(t.result)}</span>` : ""}</span>
            <span class="cstat lbl">${glyph}${t.label ? `<b>${esc(t.label)}</b>` : ""}</span>
          </div>`;
        }).join("");
      }
      else if (m.role === "user") {
        el = div("cmsg user");
        el.innerHTML = `<div class="cbub lbl">${(m.files || []).map((f) => `<span class="cfile">${ico("file")}${esc(f)}</span>`).join("")}${paras(m)}</div>`;
      }
      else {
        el = div("cmsg model");
        let inner = "";
        if (m.thinking != null) inner += `<div class="cthink${m.running ? " running" : ""}"><span class="lbl">${m.running ? ico("spin") : ico("chevron")}${esc(m.thinking === true ? "Thinking" : m.thinking)}</span></div>`;
        if (m.trace && m.trace.length) inner += `<div class="c-trace tr-list">${m.trace.map(renderTraceRow).join("")}</div>`;
        if (m.skeleton) {
          const sk = typeof m.skeleton === "object" ? m.skeleton : { lines: m.skeleton };
          const widths = [92, 76, 58, 84, 40];
          inner += `<div class="cskel">${sk.image ? '<i class="img"></i>' : ""}${Array.from({ length: sk.lines ?? 3 }, (_, k) => `<i style="width:${widths[k % widths.length]}%"></i>`).join("")}</div>`;
        }
        if (m.text != null || m.html != null) inner += `<div class="ctext lbl">${paras(m)}</div>`;
        if (m.chips) inner += `<div class="cchips">${m.chips.map((c) => `<span class="cchip lbl">${esc(c)}</span>`).join("")}</div>`;
        el.innerHTML = `${mark}<div class="ccol">${inner}</div>`;
      }
      body.appendChild(el);
      return el;
    });

    // composer + note
    let comp = null;
    if (o.composer !== false) {
      const c = Object.assign({ placeholder: "Ask anything", tools: true, mic: true }, typeof o.composer === "object" ? o.composer : {});
      comp = div("ccomp");
      comp.innerHTML = `<div class="cinput lbl${c.text ? "" : " ph"}">${esc(c.text || c.placeholder)}</div>
        <div class="crow">
          <span class="cic">${ico("plus")}</span>${c.tools ? `<span class="cic">${ico("tune")}</span>` : ""}
          <span class="cgrow"></span>
          ${c.model ? `<span class="cmodel lbl">${esc(c.model)}${ico("chevron")}</span>` : ""}
          ${c.mic ? `<span class="cic">${ico("mic")}</span>` : ""}
          ${c.text ? `<span class="csend">${ico("send")}</span>` : ""}
        </div>`;
      root.appendChild(comp);
    }
    if (o.note) root.insertAdjacentHTML("beforeend", `<div class="cnote lbl">${esc(o.note)}</div>`);
    if (o.h) body.insertAdjacentHTML("afterbegin", '<div class="cfade"></div>');

    st.el.appendChild(root);

    // With a fixed height the oldest rows may be clipped on purpose: drop their
    // label class so the checker does not report them as sticking out.
    if (o.h) {
      const top = body.getBoundingClientRect().top;
      body.querySelectorAll(".lbl").forEach((l) => { if (l.getBoundingClientRect().top < top - 0.5) l.classList.remove("lbl"); });
    }

    const r = stageRect(st, root);
    root.dataset.x = r.x; root.dataset.y = r.y; root.dataset.w = r.w; root.dataset.h = r.h;
    const rows = rowEls.map((el, i) => ({ el, ...stageRect(st, el), item: items[i] }));
    return {
      el: root, kind: "box", ...r, cx: r.x + r.w / 2, cy: r.y + r.h / 2, rows,
      header: hd ? stageRect(st, root.querySelector(".chd")) : null,
      composer: comp ? stageRect(st, comp) : null,
    };
  }

  Object.assign(window, { chatUI, trace });
})();


// === kit-slides.js ===
// Slide kit: a 16:9 shell plus the editorial components a deck needs (large
// headings, prose, bullets, stats, agendas, quotes, cards, callouts, social
// posts, polaroids, pills, buttons, modals, attachments, visualizers,
// skeletons, small illustrations, a line chart). Requires kit.js (div, px,
// stage, stageRect, ICONS). Everything is placed in stage pixels like the rest
// of the kit, so panels, boxes, connects, code cards and chat mocks combine
// freely with these.
//
// Sizes are tuned for a 1920×1080 stage (the deck's 16 px root: title 56,
// hero 99, body 32, card text 18). Use size classes (xs sm md lg xl) rather
// than inline font sizes so slides stay consistent.
(function () {
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const finish = (st, el, kind) => { el.dataset.kind = kind; const r = stageRect(st, el); el.dataset.x = r.x; el.dataset.y = r.y; el.dataset.w = r.w; el.dataset.h = r.h; return { el, kind: "box", ...r, cx: r.x + r.w / 2, cy: r.y + r.h / 2 }; };
  const place = (el, o) => { el.style.left = px(o.x); el.style.top = px(o.y); if (o.w) el.style.width = px(o.w); if (o.h) el.style.height = px(o.h); return el; };
  const cls = (...parts) => parts.filter(Boolean).join(" ");

  // ---------- shell ----------
  // slide({ w = 1920, h = 1080, n, total, pad = [128, 160], bg, dotgrid }) → st
  // Stage with the deck's padding; st.frame is the content box {x, y, w, h,
  // right, bottom, cx, cy}. `bg`: grad-hero | grad-bleed | grad-sandbox draws a
  // dark gradient (light text on both themes); `dotgrid` adds the dotted scrim.
  // `n` / `total` print the slide number bottom right.
  function slide(o = {}) {
    const W = o.w ?? 1920, H = o.h ?? 1080;
    const st = stage(W, H);
    st.el.classList.add("slide");
    if (o.bg) st.el.classList.add(o.bg, "ondark");
    if (o.dotgrid) st.el.classList.add("dotgrid");
    const [py, pxx] = Array.isArray(o.pad) ? o.pad : [o.pad ?? 128, o.pad ?? 160];
    if (o.n != null) { const n = div("slidenum"); n.dataset.kind = "text"; n.textContent = o.total ? `${o.n} / ${o.total}` : String(o.n); st.el.appendChild(n); }
    st.W = W; st.H = H;
    st.frame = { x: pxx, y: py, w: W - 2 * pxx, h: H - 2 * py, right: W - pxx, bottom: H - py, cx: W / 2, cy: H / 2 };
    return st;
  }

  // cols(frame, n | [fr, fr, …], gap = 96) → [{ x, w, cx, right }] column boxes inside a frame
  function cols(f, n, gap = 96) {
    const frs = Array.isArray(n) ? n : Array(n).fill(1);
    const sum = frs.reduce((a, b) => a + b, 0), free = f.w - gap * (frs.length - 1);
    let x = f.x; return frs.map((fr) => { const w = (free * fr) / sum; const c = { x, w, cx: x + w / 2, right: x + w }; x += w + gap; return c; });
  }

  // ---------- inline helpers (return html) ----------
  const hl = (text, tone = "blue") => `<mark class="hl ${tone}">${text}</mark>`;
  const dot = (tone = "green", glow) => `<i class="sdot ${tone}${glow ? " glow" : ""}"></i>`;
  const grad = (text) => `<span class="grad">${text}</span>`;
  const mono = (text) => `<span class="mono">${text}</span>`;

  // ---------- text ----------
  // heading(st, { x, y, w, text, size = "md", weight, sub, align, cls })
  //   size: sm 44 | md 56 (slide title) | lg 72 | xl 99 (hero). "\n" breaks lines.
  //   text may contain <span class="grad"> (gradient) or <span class="accent"> (blue).
  function heading(st, o) {
    const el = place(div(cls("heading", o.size || "md", o.weight === 400 ? "light" : o.weight === 300 ? "thin" : "", o.align === "center" ? "center" : "", o.cls)), o);
    el.innerHTML = o.text + (o.sub ? `<span class="sub">${o.sub}</span>` : "");
    st.el.appendChild(el);
    return finish(st, el, "heading");
  }

  // prose(st, { x, y, w, html | text | paras: [...], size = "md", muted, align, mono, cls })
  //   size: xs 17 | sm 20 | ms 26 (code annotations) | md 32 (slide body) | lg 40 | xl 48. Paragraphs: pass
  //   `paras` (array) or html with <p>. Inline: hl(), dot(), <code>, <b>.
  function prose(st, o) {
    const el = place(div(cls("prose", o.size || "md", o.muted ? "muted" : "", o.align === "center" ? "center" : o.align === "right" ? "right" : "", o.mono ? "mono" : "", o.cls)), o);
    el.innerHTML = o.paras ? o.paras.map((p) => `<p>${p}</p>`).join("") : (o.html ?? esc(o.text ?? ""));
    st.el.appendChild(el);
    return finish(st, el, "prose");
  }

  // bullets(st, { x, y, w, items, size = "md", marker = "arrow" | "dot" | "num", tone })
  function bullets(st, o) {
    const el = place(document.createElement("ul"), o);
    el.className = cls("bullets", o.size || "md", o.marker || "arrow", o.tone);
    el.innerHTML = o.items.map((i) => `<li>${i}</li>`).join("");
    st.el.appendChild(el);
    return finish(st, el, "bullets");
  }

  // stat(st, { x, y, w, value, label, grad = true, tone, size = "lg" })  big number + label
  function stat(st, o) {
    const el = place(div(cls("stat", o.size || "lg", o.grad !== false ? "gradval" : "", o.tone)), o);
    el.innerHTML = `<div class="value">${o.value}</div>${o.label ? `<div class="label">${o.label}</div>` : ""}`;
    st.el.appendChild(el);
    return finish(st, el, "stat");
  }

  // agenda(st, { x, y, w, items: [{ n, text, tone }], gap = 29 })  numbered contents list
  function agenda(st, o) {
    const el = place(div("agenda"), o);
    if (o.gap != null) el.style.gap = px(o.gap);
    const tones = ["blue", "purple", "green"];
    el.innerHTML = o.items.map((it, i) => `<div class="item"><span class="n ${it.tone || tones[i % 3]}">${it.n ?? i + 1}</span><span class="t">${it.text}</span></div>`).join("");
    st.el.appendChild(el);
    return finish(st, el, "agenda");
  }

  // quote(st, { x, y, w, html, cite, size })  large quotation card
  function quote(st, o) {
    const el = place(div(cls("quote", o.size)), o);
    el.innerHTML = `<p>${o.html}</p>${o.cite ? `<span class="cite">${o.cite}</span>` : ""}`;
    st.el.appendChild(el);
    return finish(st, el, "quote");
  }

  // ---------- cards ----------
  // card(st, { x, y, w, h, kicker, pill, icon, iconTone, title, text, html, foot, link,
  //            tone, layout = "col" | "row", accent, raised, outline, size, cls })
  //   tone: (default surface-2) | surface | high | blue green purple amber (tinted)
  //   accent: blue green purple → 4 px bar on top ; raised → shadow ; outline: blue → tinted border
  //   pill: text badge above the title ; icon: ICONS key in a rounded square (iconTone)
  //   layout "row": icon badge left, title + text right (compact feature card)
  function card(st, o) {
    const el = place(div(cls("scard", o.tone, o.layout === "row" ? "row" : "", o.accent ? "accent accent-" + o.accent : "", o.raised ? "raised" : "", o.outline ? "outline-" + o.outline : "", o.size, o.cls)), o);
    const it = o.iconTone || o.accent || "blue";
    const badge = o.icon ? `<div class="ibadge ${it}">${ICONS[o.icon] || o.icon}</div>` : "";
    const kick = o.kicker ? `<span class="kicker ${o.kickerTone || it}">${o.kicker}</span>` : "";
    const head = badge || kick ? `<div class="khead">${badge}${kick}</div>` : "";
    const main = `${o.pill ? `<span class="cpill ${it}">${o.pill}</span>` : ""}${o.title ? `<div class="ttl">${o.title}</div>` : ""}${o.text ? `<div class="txt">${o.text}</div>` : ""}${o.html || ""}`;
    const tail = `${o.foot ? `<div class="foot ${it}">${o.foot}</div>` : ""}${o.link ? `<div class="link">${o.link} <span>→</span></div>` : ""}`;
    el.innerHTML = o.layout === "row" ? `${badge}<div class="cmain">${main}</div>` : `${head}<div class="cmain">${main}</div>${tail}`;
    st.el.appendChild(el);
    return finish(st, el, "card");
  }

  // callout(st, { x, y, w, icon, title, html, tone = blue })  icon + one sentence on a tinted band
  function callout(st, o) {
    const el = place(div(cls("callout", o.tone || "blue")), o);
    el.innerHTML = `<span class="cicon">${ICONS[o.icon || "check"] || o.icon}</span><div class="cbody">${o.title ? `<div class="ctitle">${o.title}</div>` : ""}<p>${o.html}</p></div>`;
    st.el.appendChild(el);
    return finish(st, el, "callout");
  }

  // post(st, { x, y, w, avatar, name, handle, html, quote: { code, text } | html, tone })  social post mock
  function post(st, o) {
    const el = place(div("post"), o);
    const q = o.quote ? `<div class="pquote">${typeof o.quote === "string" ? o.quote : `${o.quote.code ? `<code>${esc(o.quote.code)}</code>` : ""}${o.quote.text ? `<p>${o.quote.text}</p>` : ""}`}</div>` : "";
    el.innerHTML = `<div class="phead"><div class="avatar ${o.tone || "blue"}">${esc(o.avatar || (o.name || "?")[0])}</div><div><span class="pname">${esc(o.name)}</span>${o.handle ? `<span class="phandle">${esc(o.handle)}</span>` : ""}</div></div><div class="ptext">${o.html}</div>${q}`;
    st.el.appendChild(el);
    return finish(st, el, "post");
  }

  // polaroid(st, { x, y, w, html | illus, caption, tilt = 2.5 })  tilted card with a picture and a caption
  function polaroid(st, o) {
    const el = place(div("polaroid"), o);
    el.style.setProperty("--tilt", (o.tilt ?? 2.5) + "deg");
    el.innerHTML = `${o.illus ? illusHtml(o.illus, o) : o.html || ""}${o.caption ? `<div class="pcap">${o.caption}</div>` : ""}`;
    st.el.appendChild(el);
    return finish(st, el, "polaroid");
  }

  // photo(st, { x, y, w, h, src, video, alt, caption, sub, tag, fit = "cover", position = "center", controls })
  //   Raster picture (screenshot, demo still) with rounded corners and an optional caption below.
  //   `h` is the picture height; the caption adds to it. `tag` is a small dark label on the picture.
  //   `video` plays a muted, looping clip with `src` as its poster (static renders show the poster).
  //   In talk sources pass src: "__ASSET(file.webp)__" so gen.ts inlines it from talks/<talk>/assets/.
  function photo(st, o) {
    const el = place(div(cls("photo", o.cls)), { x: o.x, y: o.y, w: o.w });
    const style = `object-fit:${o.fit || "cover"};object-position:${o.position || "center"}`;
    const useVideo = o.video && location.protocol !== "file:";
    const media = useVideo
      ? `<video src="${o.video}" poster="${o.src}" autoplay muted loop playsinline${o.controls ? " controls" : ""} style="${style}"></video>`
      : `<img src="${o.src}" alt="${esc(o.alt || o.caption || "")}" style="${style}">`;
    const pic = `<div class="ph-pic" style="height:${o.h}px">${media}${o.tag ? `<span class="ph-tag">${esc(o.tag)}</span>` : ""}</div>`;
    const cap = o.caption ? `<div class="ph-cap"><b>${o.caption}</b>${o.sub ? `<span>${o.sub}</span>` : ""}</div>` : "";
    el.innerHTML = pic + cap;
    st.el.appendChild(el);
    return finish(st, el, "photo");
  }

  // ---------- small UI ----------
  // pills(st, { x, y, label, items: [text | { text, tone, style, caps }], gap = 13, size })
  //   tone: blue green purple amber red (tinted) ; style: outline | ghost ; size: lg
  //   Returns geometry plus items[i] rects.
  function pills(st, o) {
    const el = place(div(cls("pills", o.size)), o);
    if (o.gap != null) el.style.gap = px(o.gap);
    el.innerHTML = (o.label ? `<span class="plabel">${o.label}</span>` : "") + o.items.map((p) => { const it = typeof p === "string" ? { text: p } : p; return `<span class="pill ${cls(it.tone, it.style, it.caps ? "caps" : "")}">${it.text}</span>`; }).join("");
    st.el.appendChild(el);
    const r = finish(st, el, "pills");
    return { ...r, items: [...el.querySelectorAll(".pill")].map((p) => stageRect(st, p)) };
  }
  // pill(st, { x, y, text, tone, style, caps, size })  a single badge
  function pill(st, o) { return pills(st, { ...o, items: [{ text: o.text, tone: o.tone, style: o.style, caps: o.caps }] }); }

  // buttons(st, { x, y, items: [{ text, icon, tone = "tonal" | "primary" | "ghost" | "ink", round, pill }], gap = 13, size })
  function buttons(st, o) {
    const el = place(div(cls("sbtns", o.size)), o);
    if (o.gap != null) el.style.gap = px(o.gap);
    el.innerHTML = o.items.map((b) => `<span class="sbtn ${b.tone || "tonal"}${b.round ? " round" : ""}${b.pill ? " pill" : ""}">${b.icon ? ICONS[b.icon] || b.icon : ""}${b.text ? `<span>${b.text}</span>` : ""}</span>`).join("");
    st.el.appendChild(el);
    const r = finish(st, el, "buttons");
    return { ...r, items: [...el.querySelectorAll(".sbtn")].map((p) => stageRect(st, p)) };
  }
  function button(st, o) { return buttons(st, { ...o, items: [o] }); }

  // modal(st, { x, y, w, title, link, rows: [{ label, text, on, check, dim }] })  settings dialog with radio rows
  function modal(st, o) {
    const el = place(div("modal"), o);
    el.innerHTML = `<div class="mhead"><div class="mtitle">${o.title}</div>${o.link ? `<span class="mlink">${o.link}</span>` : ""}</div>` +

    st.el.appendChild(el);
    return finish(st, el, "modal");
  }

  // attachment(st, { x, y, w, name, meta, status, icon = "image" })  file chip with a status on the right
  function attachment(st, o) {
    const el = place(div("attach"), o);
    el.innerHTML = `${ICONS[o.icon || "image"]}<div><div class="aname">${esc(o.name)}</div>${o.meta ? `<div class="ameta">${esc(o.meta)}</div>` : ""}</div>${o.status ? `<span class="astat">${o.status}</span>` : ""}`;
    st.el.appendChild(el);
    return finish(st, el, "attachment");
  }

  // visualizer(st, { x, y, w, h = 140, bars: [0..1 | { h, tone, d }] })  audio bars (pulse with ?anim=)
  function visualizer(st, o) {
    const el = place(div("vis"), { ...o, h: o.h ?? 140 });
    const tones = ["blue", "purple", "green"];
    el.innerHTML = (o.bars || [0.4, 0.8, 0.6, 0.9, 0.5, 0.75, 0.45, 0.85]).map((b, i) => { const it = typeof b === "number" ? { h: b } : b; return `<i class="${it.tone || tones[i % 3]}" style="height:${Math.round(it.h * 100)}%;--d:${it.d ?? (0.8 + (i % 4) * 0.2).toFixed(1)}s;--dl:${((i % 5) * 0.12).toFixed(2)}s"></i>`; }).join("");
    st.el.appendChild(el);
    return finish(st, el, "visualizer");
  }

  function skeleton(st, o) {
    const el = place(div(cls("skel", o.tone)), o);

      <line x1="150" y1="150" x2="60" y2="180" stroke="${pu}" stroke-width="1.5" opacity=".5"/><circle cx="60" cy="180" r="7" fill="${pu}"/>`),

      <circle cx="60" cy="110" r="28" fill="${s2}" stroke="${bd}" stroke-width="2"/><circle cx="60" cy="102" r="8" fill="none" stroke="${ink}" stroke-width="2"/><path d="M44 122C44 114 76 114 76 122" fill="none" stroke="${ink}" stroke-width="2"/>
      <circle cx="260" cy="110" r="28" fill="${s2}" stroke="${bl}" stroke-width="2"/><path d="M248 106L254 112L248 118" fill="none" stroke="${bl}" stroke-width="2" stroke-linecap="round"/><line x1="258" y1="118" x2="268" y2="118" stroke="${ink}" stroke-width="2" stroke-linecap="round"/>
      <circle cx="160" cy="40" r="6" fill="${gr}"/><circle cx="160" cy="180" r="4" fill="${pu}" opacity=".6"/>`),

    // a lit circle of known map inside an unknown territory
    map: () => S("0 0 400 300", `

        <line x1="150" y1="30" x2="150" y2="270" stroke="var(--bg)" stroke-width="1" opacity=".18"/><line x1="200" y1="30" x2="200" y2="270" stroke="var(--bg)" stroke-width="1" opacity=".18"/><line x1="250" y1="30" x2="250" y2="270" stroke="var(--bg)" stroke-width="1" opacity=".18"/>
        <polygon points="235,125 218,158 252,158" fill="none" stroke="var(--bg)" stroke-width="2"/><path d="M265 180Q270 175 275 180Q280 175 285 180" fill="none" stroke="var(--bg)" stroke-width="1.5"/>
        <path d="M90 190C135 190 155 220 175 180C190 150 205 120 225 120L310 90" fill="none" stroke="var(--bg)" stroke-width="3"/>

    // fully connected layers; { layers: [3, 3, 1], tones: ["blue", "purple", "green"] }
    net: (o = {}) => {
      const layers = o.layers || [3, 3, 1], tones = o.tones || ["blue", "purple", "green"], W = 500, H = 300, pad = 80;
      const xs = layers.map((_, i) => pad + (i * (W - 2 * pad)) / (layers.length - 1));
      const ys = layers.map((n) => Array.from({ length: n }, (_, j) => (H * (j + 1)) / (n + 1)));
      let lines = "", nodes = "";
      for (let i = 0; i < layers.length - 1; i++) for (const y1 of ys[i]) for (const y2 of ys[i + 1]) lines += `<line x1="${xs[i]}" y1="${y1}" x2="${xs[i + 1]}" y2="${y2}" stroke="${bd}" stroke-width="2" opacity="${(0.25 + 0.5 * (1 - Math.abs(y1 - y2) / H)).toFixed(2)}"/>`;
      layers.forEach((n, i) => ys[i].forEach((y) => (nodes += `<circle cx="${xs[i]}" cy="${y}" r="${i === layers.length - 1 ? 16 : 12}" fill="var(--${tones[i % tones.length]})"/>`)));
      return S(`0 0 ${W} ${H}`, lines + nodes);
    },
    // waffle dot comparison where 1 dot = `unit` tokens (default 100); { columns: [{ title, sub, promptTokens, schemaTokens, tone, note }], unit, perRow, vbW, vbH, legend }
    tokenDots: (o = {}) => {
      const cols = o.columns || [];
      const unit = o.unit || 100, perRow = o.perRow || 14;
      const W = o.vbW || 1600, H = o.vbH || 560, gap = o.colGap ?? 24;
      const topOff = o.legend === false ? 0 : 42;
      const cardH = H - topOff;
      const cw = (W - gap * (cols.length - 1)) / Math.max(1, cols.length);
      let out = "";
      if (o.legend !== false) {
        out += `<circle cx="14" cy="16" r="6.5" fill="${bl}"/>`;
        out += `<text x="28" y="21" fill="${ink}" font-family="var(--font)" font-size="16" font-weight="600">System instructions</text>`;
        out += `<circle cx="218" cy="16" r="6.5" fill="color-mix(in srgb, var(--blue) 30%, var(--blue-bg))"/>`;
        out += `<text x="232" y="21" fill="${ink}" font-family="var(--font)" font-size="16" font-weight="600">Tool schemas &amp; prose</text>`;
        out += `<text x="${W - 8}" y="21" text-anchor="end" fill="var(--muted)" font-family="var(--mono)" font-size="15.5">1 dot = ${unit} tokens (Turn-0 overhead before user message)</text>`;
      }
      cols.forEach((c, idx) => {
        const x0 = idx * (cw + gap), y0 = topOff, tone = c.tone || "blue";
        const pDots = Math.max(1, Math.round((c.promptTokens || 0) / unit));
        const sDots = Math.round((c.schemaTokens || 0) / unit);
        const totalTok = (c.promptTokens || 0) + (c.schemaTokens || 0);
        const totalDots = pDots + sDots;
        out += `<rect x="${x0}" y="${y0}" width="${cw}" height="${cardH}" rx="20" fill="${s2}"/>`;
        out += `<text x="${x0 + 24}" y="${y0 + 44}" fill="${ink}" font-family="var(--display)" font-size="24" font-weight="600">${esc(c.title)}</text>`;
        if (c.sub) out += `<text x="${x0 + 24}" y="${y0 + 72}" fill="var(--muted)" font-family="var(--font)" font-size="16.5">${esc(c.sub)}</text>`;
        const badgeTxt = totalTok >= 1000 ? `${(totalTok / 1000).toFixed(1)}k` : `${totalTok}`;
        const bw = badgeTxt.length * 10.2 + 22;
        out += `<rect x="${x0 + cw - bw - 20}" y="${y0 + 20}" width="${bw}" height="32" rx="16" fill="var(--${tone}-bg)"/>`;
        out += `<text x="${x0 + cw - bw / 2 - 20}" y="${y0 + 41}" text-anchor="middle" fill="var(--${tone})" font-family="var(--mono)" font-size="15.5" font-weight="700">${esc(badgeTxt)}</text>`;
        const padX = 24, topY = y0 + 100, availW = cw - 2 * padX;
        const step = availW / perRow, r = Math.min(6.8, step * 0.36);
        for (let d = 0; d < totalDots; d++) {
          const col = d % perRow, row = Math.floor(d / perRow);
          const cx = x0 + padX + col * step + step / 2, cy = topY + row * (step * 0.95) + r;
          if (cy > y0 + cardH - 58) break;
          if (d < pDots) out += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="var(--${tone})"/>`;
          else out += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="color-mix(in srgb, var(--${tone}) 30%, var(--${tone}-bg))"/>`;
        }
        if (c.note) out += `<text x="${x0 + 24}" y="${y0 + cardH - 22}" fill="var(--muted)" font-family="var(--mono)" font-size="14.5">${esc(c.note)}</text>`;
      });
      return S(`0 0 ${W} ${H}`, out);
    },
    // GDM Release Chart Studio style month-spine timeline; { year, months: [{ name, top: [{ title, sub, tone, level, featured, dir }], bottom: [...] }], categories }
    gdmTimeline: (o = {}) => {
      const W = o.vbW || 1600, H = o.vbH || 650, spineY = o.spineY || 338;
      const months = o.months || [];
      const x0 = o.x0 ?? 132, span = o.span ?? (W - x0 - 268);
      const mx = (i) => x0 + (months.length > 1 ? (i * span) / (months.length - 1) : span / 2);
      const halo = `paint-order="stroke" stroke="var(--bg)" stroke-width="6" stroke-linejoin="round"`;
      let out = "";
      // category legend pills top-left and bottom-left
      const cats = o.categories || [
        { label: "Frontier & coding models", tone: "blue", pos: "top", x: 16 },
        { label: "Agent runtime & APIs", tone: "purple", pos: "top", x: 316 },
        { label: "Multimodal, audio & open", tone: "teal", pos: "bottom", x: 16 },
      ];
      cats.forEach((c) => {
        const cy = c.pos === "bottom" ? H - 24 : 24, w = c.label.length * 9.4 + 34;
        out += `<rect x="${c.x}" y="${cy - 18}" width="${w}" height="36" rx="18" fill="var(--${c.tone}-bg)"/>`;
        out += `<circle cx="${c.x + 18}" cy="${cy}" r="5" fill="var(--${c.tone})"/>`;
        out += `<text x="${c.x + 32}" y="${cy + 5.5}" fill="var(--${c.tone})" font-family="var(--font)" font-size="16" font-weight="600">${esc(c.label)}</text>`;
      });

  const colName = (i) => { let s = ""; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };

      el.textContent = v == null ? "" : fmt(v);
      const a = align[colName(c)];
      el.className = "sh-c" + (r === 0 && o.header !== false ? " hd" : "") + ((a ? a === "right" : v != null && v !== "" && isNum(v) && !(r === 0 && o.header !== false)) ? " r" : a === "center" ? " c" : "") +
        (tones[r + ":" + c] ? ` sh-t-${tones[r + ":" + c]}` : "") + (flashed.has(r + ":" + c) ? " flashed" : "");
    }
    const paintAll = () => { for (let r = 0; r < nRows; r++) for (let c = 0; c < widths.length; c++) paint(r, c); };
    paintAll();

    let sel = null;
    function select(ref, formula) {
      const p = parseRef(ref); if (!p) return;
      sel = p;
      cells.querySelectorAll(".sh-h.sel").forEach((e) => e.classList.remove("sel"));
      cells.querySelector(`.sh-col[data-c="${p.c}"]`)?.classList.add("sel");
      cells.querySelector(`.sh-row[data-r="${p.r}"]`)?.classList.add("sel");
      Object.assign(selEl.style, { display: "block", left: px(lefts[p.c] - 1), top: px(top(p.r) - 1), width: px(widths[p.c] + 1), height: px(rowH + 1) });
      refEl.textContent = String(ref).toUpperCase();
      const v = rows[p.r] ? rows[p.r][p.c] : "";
      ftext.textContent = formula != null ? formula : v == null ? "" : fmt(v);
    }
    if (o.selected) select(o.selected, o.formula); else selEl.style.display = "none";

    const r = finish(st, root);

    function setCell(ref, value, opt = {}) {
      const p = parseRef(ref); if (!p) return null;
      while (rows.length <= p.r) rows.push([]);
      rows[p.r][p.c] = value;
      if (opt.tone !== undefined) { if (opt.tone) tones[p.r + ":" + p.c] = opt.tone; else delete tones[p.r + ":" + p.c]; }
      flashed.delete(p.r + ":" + p.c);
      paint(p.r, p.c);
      const el = cellEl(p.r, p.c);
      if (el && opt.flash) { el.classList.remove("sh-flash"); void el.offsetWidth; el.classList.add("sh-flash"); }
      if (sel && sel.r === p.r && sel.c === p.c && opt.formula == null) ftext.textContent = fmt(value);
      if (sel && sel.r === p.r && sel.c === p.c && opt.formula != null) ftext.textContent = opt.formula;
      return el;
    }
    function setRows(nr) { rows = nr.map((x) => [...x]); flashed.clear(); paintAll(); if (sel) select(colName(sel.c) + (sel.r + 1)); }
    const cell = (ref) => { const p = parseRef(ref); const el = p && cellEl(p.r, p.c); return el ? stageRect(st, el) : null; };

    return {
      el: root, kind: "box", ...r, cx: r.x + r.w / 2, cy: r.y + r.h / 2, scale: sh.s,
      grid: stageRect(st, wrap), formulaBar: stageRect(st, app.querySelector(".sh-fbar")),
      setCell, select, cell, setRows,
    };
  }

  // ======================================================================
  // Trigger & webhook console (dev tool look) + floating status dock
  // ======================================================================
  const STATES = ["live", "simulated", "missing", "error", "checking", "replay"];
  const chipHTML = (c) => {
    const st = STATES.includes(c.state) ? c.state : "live";
    const b = c.badge || "";
    return `<span class="cn-chip ${st}" data-id="${esc(c.id)}"${c.detail ? ` title="${esc(c.detail)}"` : ""}><i class="cn-dot"></i><span>${esc(c.label ?? c.id)}</span>${b ? `<em class="cn-st cn-b-${esc(String(b).toLowerCase())}">${esc(b)}</em>` : ""}</span>`;
  };
  // array → replace; map { id: { state, detail, label } } → merge into the current list
  function mergeStatus(list, next) {
    if (Array.isArray(next)) return next.map((c) => ({ ...c }));
    const out = list.map((c) => ({ ...c }));
    for (const [id, patch] of Object.entries(next || {})) {
      const p = typeof patch === "string" ? { state: patch } : patch;
      const cur = out.find((c) => c.id === id);
      if (cur) Object.assign(cur, p); else out.push({ id, label: id, ...p });
    }
    return out;
  }
  const KIND = {
    thought: ["thought", "purple"], code_execution_call: ["code", "blue"], code_execution_result: ["result", "green"],
    bash: ["bash", "blue"], result: ["result", "green"], edit: ["edit", "amber"], write: ["write", "green"],
    read: ["read", "teal"], grep: ["grep", "teal"], codemode: ["code mode", "purple"],
    tool_call: ["tool call", "teal"], tool_result: ["tool result", "teal"],
    mcp_server_tool_call: ["mcp call", "teal"], mcp_server_tool_result: ["mcp result", "teal"],
    model_output: ["output", "ink"], hook: ["hook", "amber"], sheet: ["sheet", "green"], slack: ["slack", "slack"],
  };
  const MONO_KINDS = new Set(["code_execution_call", "code_execution_result", "bash", "result", "edit", "write", "read", "grep", "codemode", "tool_call", "tool_result", "mcp_server_tool_call", "mcp_server_tool_result"]);
  const TRIG = { cron: ["CRON", "blue"], sec_13f: ["SEC 13F", "amber"], slack: ["SLACK", "slack"], task: ["TASK", "blue"], bench: ["EVAL", "purple"] };
  const inlineCode = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
  const short = (id, n = 12) => { const s = String(id ?? ""); return s.length > n + 2 ? s.slice(0, n) + "…" : s; };
  function jsonHTML(src) {
    let txt = src;
    if (typeof src !== "string") txt = JSON.stringify(src, null, 2);
    else { try { txt = JSON.stringify(JSON.parse(src), null, 2); } catch (e) { txt = src; } }
    return txt.split("\n").map((line) => esc(line).replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)?|(-?\b\d+(?:\.\d+)?\b)|\b(true|false|null)\b/g,
      (m, s, colon, n, b) => s ? (colon ? `<span class="cn-jk">${s}</span>${colon}` : `<span class="cn-js">${s}</span>`) : n ? `<span class="cn-jn">${n}</span>` : `<span class="cn-jb">${b}</span>`)).join("\n");
  }

  //   consoleUI(st, { x, y, w, h, scale, bleed, title, sub, status: [{ id, label, state, detail }],
  //     actions: [{ id, text, icon, primary }], actionsSection, triggerSection, runTitle,
  //     metrics: [{ label, value, tone }], trigger: { kind, title, detail, time } | null,
  //     interaction: { id, environment_id, status } | null, steps: [{ kind, name, text, live, is_error }],
  //     webhook: { direction, url, headers: { k: v }, body, verified } | null })
  //   scale defaults to 1.25 when h >= 1000 (a tall projector column) and 1 otherwise.
  //   Returns box geometry plus setStatus(arrayOrMap), setBusy(bool), onAction(id, fn), actions: { id: button },
  //   setTrigger(t), setInteraction(i), setMetrics(list), addStep(step) → el, clearSteps(), setWebhook(w), reset().
  function consoleUI(st, o = {}) {
    const H = o.h ?? 900;
    const sh = shell(st, { ...o, scale: o.scale ?? (H >= 1000 ? 1.25 : 1) }, "consoleui", 820, 900);
    const { root, app } = sh;
    const showTitle = o.title !== false && o.title !== "";
    const showActs = o.actionsSection !== false;
    const showTrig = o.triggerSection !== false && o.trigger !== false;
    const showMetrics = o.metrics !== undefined;
    const showHook = o.webhook !== false;
    app.innerHTML = `
      <div class="cn-head">${showTitle ? `<div class="cn-htxt"><div class="cn-ttl">${esc(o.title ?? "Trigger & webhook console")}</div>${o.sub ? `<div class="cn-sub">${esc(o.sub)}</div>` : ""}</div>` : ""}<div class="cn-chips${showTitle ? "" : " full"}"></div></div>
      ${showActs ? `<div class="cn-acts"></div>` : ""}
      ${showTrig ? `<div class="cn-sec cn-trig"><div class="cn-sh">Trigger &amp; input prompt</div><div class="cn-tbody"></div></div>` : ""}
      <div class="cn-sec cn-run"><div class="cn-sh">${esc(o.runTitle ?? "Managed Agent run")}</div><div class="cn-iline"></div>${showMetrics ? `<div class="cn-metrics"></div>` : ""}<div class="cn-log"><div class="cn-login"></div></div></div>
      ${showHook ? `<div class="cn-sec cn-hook"><div class="cn-sh">Outbound webhook</div><div class="cn-hbody"></div></div>` : ""}`;
    const $ = (s) => app.querySelector(s);
    const chipsEl = $(".cn-chips"), actsEl = $(".cn-acts"), tbody = $(".cn-tbody"), iline = $(".cn-iline"), metricsEl = $(".cn-metrics");
    const log = $(".cn-log"), logIn = $(".cn-login"), hbody = $(".cn-hbody");

    let status = mergeStatus([], o.status || []);
    const setStatus = (next) => { status = mergeStatus(status, next); chipsEl.innerHTML = status.map(chipHTML).join(""); return status; };

    const actions = {}, handlers = {};
    for (const a of o.actions || []) {
      if (!actsEl) break;
      const b = document.createElement("button");
      b.className = "cn-btn" + (a.primary ? " primary" : "") + (a.sub ? " has-sub" : ""); b.type = "button"; b.dataset.id = a.id;
      b.innerHTML = (a.icon ? ic(a.icon, "cn-bic") : "") + (a.sub ? `<span class="cn-btxt"><b>${esc(a.text)}</b><small>${esc(a.sub)}</small></span>` : `<span>${esc(a.text)}</span>`);
      b.addEventListener("click", () => { if (!b.disabled) (handlers[a.id] || []).forEach((fn) => fn(a.id, b)); });
      actsEl.appendChild(b); actions[a.id] = b;
    }
    const onAction = (id, fn) => { (handlers[id] = handlers[id] || []).push(fn); return actions[id]; };
    const setBusy = (busy) => { root.classList.toggle("busy", !!busy); Object.values(actions).forEach((b) => { b.disabled = !!busy; }); };

    const setTrigger = (t) => {
      if (!tbody) return;
      if (!t) { tbody.innerHTML = `<div class="cn-empty">${esc(o.emptyTrigger ?? "Click a trigger button above to run Buck…")}</div>`; return; }
      const [lab, tone] = TRIG[t.kind] || [String(t.kind || "event").toUpperCase(), "gray"];
      const promptHtml = t.prompt ? `<div class="cn-tprompt"><span class="cn-tplbl">PROMPT</span><span class="cn-tptxt">${inlineCode(t.prompt)}</span></div>` : "";
      tbody.innerHTML = `<div class="cn-trow"><span class="cn-kb cn-c-${tone}">${esc(lab)}</span><div class="cn-tmain"><div class="cn-tt">${esc(t.title)}</div>${t.detail ? `<div class="cn-td">${esc(t.detail)}</div>` : ""}</div>${t.time ? `<span class="cn-time">${esc(t.time)}</span>` : ""}</div>${promptHtml}`;
    };
    const setInteraction = (i) => {
      if (!i) { iline.innerHTML = `<div class="cn-empty">No run yet</div>`; return; }
      const s = i.status || "running";
      const tone = s === "completed" ? "green" : s === "failed" ? "red" : s === "running" ? "blue" : "gray";
      const idLbl = i.label ?? "interaction";
      iline.innerHTML = `<span class="cn-ids"><span class="cn-m">${esc(idLbl)}</span> <b title="${esc(i.id)}">${esc(short(i.id, i.shortLen ?? 12))}</b>${i.environment_id ? ` <span class="cn-m">· ${esc(i.envLabel ?? "env")}</span> <b title="${esc(i.environment_id)}">${esc(short(i.environment_id, i.envShortLen ?? 8))}</b>` : ""}</span><span class="cn-pill cn-c-${tone}${s === "running" ? " running" : ""}"><i></i>${esc(s)}</span>`;
    };
    const setMetrics = (list) => {
      if (!metricsEl) return;
      if (!list || !list.length) { metricsEl.innerHTML = ""; return; }
      metricsEl.innerHTML = list.map((m) => `<div class="cn-met${m.tone ? ` cn-c-${esc(m.tone)}` : ""}"><span class="cn-mlbl">${esc(m.label)}</span><b class="cn-mval">${esc(m.value)}</b></div>`).join("");
    };

    const emptyLog = () => { if (!logIn.querySelector(".cn-row")) logIn.innerHTML = `<div class="cn-empty">Steps stream in here once a run starts…</div>`; };
    function addStep(s = {}) {
      logIn.querySelector(".cn-empty")?.remove();
      const [lab, tone] = KIND[s.kind] || [String(s.kind || "step").replace(/_/g, " "), "gray"];
      const el = div(`cn-row${s.is_error ? " err" : ""}`);
      el.dataset.kind = s.kind || "";
      el.innerHTML = `<span class="cn-k cn-c-${s.is_error ? "red" : tone}">${esc(lab)}</span><div class="cn-rmain">${s.name ? `<div class="cn-rhead"><span class="cn-rn">${esc(s.name)}</span></div>` : ""}${s.text != null ? `<div class="cn-rt${MONO_KINDS.has(s.kind) ? " mono" : ""}">${inlineCode(s.text)}</div>` : ""}</div>`;
      logIn.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }
    const clearSteps = () => { logIn.innerHTML = ""; emptyLog(); };

    const setWebhook = (wh) => {
      if (!hbody) return;
      if (!wh) { hbody.innerHTML = `<div class="cn-empty">No webhook delivered yet</div>`; return; }
      const v = wh.verified === true ? '<span class="cn-ver cn-c-green">✓ signature verified</span>' : wh.verified === false ? '<span class="cn-ver cn-c-red">✗ invalid</span>' : '<span class="cn-ver cn-c-gray">pending</span>';
      const hdrs = Object.entries(wh.headers || {}).map(([k, val]) => `<div class="cn-hr"><span class="cn-hk">${esc(k)}:</span><span class="cn-hv">${esc(val)}</span></div>`).join("");
      hbody.innerHTML = `<div class="cn-wurl"><span class="cn-dir">${wh.direction === "in" ? "IN" : "POST"}</span><span class="cn-url">${esc(wh.url)}</span>${v}</div>${hdrs ? `<div class="cn-hdrs">${hdrs}</div>` : ""}${wh.body != null ? `<pre class="cn-json">${jsonHTML(wh.body)}</pre>` : ""}`;
    };

    function reset() { setBusy(false); setTrigger(null); setInteraction(null); if (o.metrics) setMetrics(o.metrics); clearSteps(); setWebhook(null); }

    setStatus([]); setStatus(o.status || []);
    setTrigger(o.trigger || null); setInteraction(o.interaction || null);
    if (showMetrics) setMetrics(o.metrics || []);
    (o.steps || []).forEach(addStep); emptyLog();
    setWebhook(o.webhook || null);

    st.el.appendChild(root);
    log.scrollTop = log.scrollHeight;
    const r = finish(st, root);
    return {
      el: root, kind: "box", ...r, cx: r.x + r.w / 2, cy: r.y + r.h / 2, scale: sh.s,
      log: stageRect(st, log), webhookRect: hbody ? stageRect(st, $(".cn-hook")) : null,
      actions, setStatus, setBusy, onAction, setTrigger, setInteraction, setMetrics, addStep, clearSteps, setWebhook, reset,
    };
  }

  //   statusDock(st, { x, y, items: [{ id, label, state, detail }], align: "right" | "left", scale })
  //   align "right": x is the dock's right edge (it grows leftward); "left": x is its left edge.
  //   Returns geometry plus set(arrayOrMap) (same merge rules as consoleUI.setStatus).
  function statusDock(st, o = {}) {
    const root = div("statusdock" + (o.align === "left" ? "" : " right"));
    root.dataset.kind = "statusdock";
    const inner = div("cn-dockin");
    if (o.scale && o.scale !== 1) inner.style.zoom = o.scale;
    root.appendChild(inner);
    st.el.appendChild(root);
    let items = [];
    const place = () => {
      root.style.top = px(o.y ?? 0);
      root.style.left = px(o.align === "left" ? o.x ?? 0 : (o.x ?? st.el.offsetWidth) - root.offsetWidth);
      const r = stageRect(st, root); root.dataset.x = r.x; root.dataset.y = r.y; root.dataset.w = r.w; root.dataset.h = r.h;
      return r;
    };
    const set = (next) => { items = mergeStatus(items, next); inner.innerHTML = items.map(chipHTML).join(""); return Object.assign(api, place()); };
    const api = { el: root, kind: "box", set };
    set(o.items || []);
    api.cx = api.x + api.w / 2; api.cy = api.y + api.h / 2;
    return api;
  }

  // ======================================================================
  // Terminal UI (live interactive CLI runner + full transcript)
  // ======================================================================
  function terminalUI(st, o = {}) {
    const sh = shell(st, { ...o, scale: o.scale ?? 1.12 }, "terminalui", 960, 720);
    const { root, app } = sh;
    const $ = (sel) => app.querySelector(sel);

    const presets = (o.presets || []).map((p) => ({ ...p }));
    let activePresetId = presets.find((p) => p.active)?.id || presets[0]?.id || "";
    let busy = false;
    const runHandlers = [];
    const resetHandlers = [];

    const presetsHTML = presets.length
      ? `<div class="tui-presets">${presets.map((p) => `<button type="button" class="tui-preset${p.id === activePresetId ? " on" : ""}" data-preset="${esc(p.id)}"><span class="tui-plbl">${esc(p.label)}</span>${p.sub ? `<small>${esc(p.sub)}</small>` : ""}</button>`).join("")}<div class="tui-spacer"></div><button type="button" class="tui-act tui-reset" title="Reset workspace">Reset</button></div>`
      : "";

    app.innerHTML =
      `<div class="tui-bar"><div class="tui-dots"><i></i><i></i><i></i></div><div class="tui-title">${esc(o.title || "terminal")}</div><div class="tui-status"></div></div>` +
      presetsHTML +
      `<div class="tui-cmdbar"><span class="tui-ps1">$</span><input type="text" class="tui-input" spellcheck="false" value="${esc(o.command || "")}" aria-label="Terminal command" /><button type="button" class="tui-run">▶ Run</button></div>` +
      `<div class="tui-log"><div class="tui-login"></div></div>`;

    const statusEl = $(".tui-status");
    const cmdInput = $(".tui-input");
    const runBtn = $(".tui-run");
    const resetBtn = $(".tui-reset");
    const log = $(".tui-log");
    const logIn = $(".tui-login");

    function setStatus(s = {}) {
      if (!s || !s.label) { statusEl.innerHTML = ""; return; }
      const state = s.state || "live";
      statusEl.innerHTML = `<span class="tui-badge ${esc(state)}"><i></i>${esc(s.label)}</span>`;
    }

    function setActivePreset(id) {
      activePresetId = id;
      app.querySelectorAll(".tui-preset").forEach((b) => {
        b.classList.toggle("on", b.dataset.preset === id);
      });
      const hit = presets.find((p) => p.id === id);
      if (hit && hit.command) cmdInput.value = hit.command;
    }

    function setBusy(on) {
      busy = !!on;
      runBtn.disabled = busy;
      runBtn.textContent = busy ? "Running…" : "▶ Run";
      cmdInput.readOnly = busy;
      app.querySelectorAll(".tui-preset").forEach((b) => { b.disabled = busy; });
      if (resetBtn) resetBtn.disabled = false;
    }

    function formatOutLine(raw) {
      return String(raw ?? "").split("\n").map((ln) => {
        const e = esc(ln);
        if (/^\+\+\+|^---/.test(ln)) return `<span class="tui-dim">${e}</span>`;
        if (/^\+/.test(ln)) return `<span class="tui-add">${e}</span>`;
        if (/^-/.test(ln)) return `<span class="tui-del">${e}</span>`;
        if (/✓|PASS\b|\b0 fail\b/i.test(ln)) return `<span class="tui-ok">${e}</span>`;
        if (/✗|FAIL\b|AssertionError|Expected:|Received:/i.test(ln)) return `<span class="tui-bad">${e}</span>`;
        return e;
      }).join("\n");
    }

    function addLine(item = {}) {
      const kind = item.kind || "out";
      const row = div(`tui-line tui-${kind}`);
      const text = String(item.text ?? "");
      if (kind === "prompt") {
        row.innerHTML = `<span class="tui-ps">$</span><span class="tui-txt">${esc(text)}</span>`;
      } else if (kind === "thought") {
        row.innerHTML = `<span class="tui-tag">⟳</span><span class="tui-txt">${esc(text)}</span>`;
      } else if (kind === "cmd") {
        const lbl = item.label ? `<span class="tui-kbadge">${esc(item.label)}</span>` : `<span class="tui-ps">$</span>`;
        row.innerHTML = `${lbl}<pre class="tui-pre">${esc(text)}</pre>`;
      } else if (kind === "tool") {
        row.innerHTML = `<span class="tui-tbadge">${esc(item.label || "tool")}</span><span class="tui-txt">${esc(text)}</span>`;
      } else if (kind === "turn") {
        row.innerHTML = `<span class="tui-turn-line">${esc(text)}</span>`;
      } else if (kind === "answer") {
        row.innerHTML = `<span class="tui-ans-ic">✓</span><div class="tui-txt">${esc(text)}</div>`;
      } else if (kind === "err") {
        row.innerHTML = `<span class="tui-err-ic">✗</span><pre class="tui-pre">${esc(text)}</pre>`;
      } else {
        row.innerHTML = `<pre class="tui-pre">${formatOutLine(text)}</pre>`;
      }
      logIn.appendChild(row);
      log.scrollTop = log.scrollHeight;
      return row;
    }

    function clearLines() { logIn.innerHTML = ""; }
    function setCommand(c) { cmdInput.value = String(c ?? ""); }
    function getCommand() { return cmdInput.value; }

    function fireRun(presetOverride) {
      if (busy) return;
      const pid = presetOverride || activePresetId;
      const cmd = cmdInput.value.trim();
      runHandlers.forEach((fn) => fn({ presetId: pid, command: cmd }));
    }

    app.querySelectorAll(".tui-preset").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const pid = btn.dataset.preset || "";
        setActivePreset(pid);
        fireRun(pid);
      });
    });

    runBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      fireRun();
    });

    cmdInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        e.stopPropagation();
        fireRun();
      }
    });

    if (resetBtn) {
      resetBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        resetHandlers.forEach((fn) => fn());
      });
    }

    setStatus(o.status || null);
    (o.lines || []).forEach(addLine);

    st.el.appendChild(root);
    log.scrollTop = log.scrollHeight;
    const r = finish(st, root);
    return {
      el: root, kind: "box", ...r, cx: r.x + r.w / 2, cy: r.y + r.h / 2, scale: sh.s,
      addLine, clearLines, setCommand, getCommand, setActivePreset, setBusy, setStatus,
      onRun: (fn) => runHandlers.push(fn),
      onReset: (fn) => resetHandlers.push(fn),
    };
  }

  // ======================================================================
  // Workspace UI (live repo file explorer + diff viewer + run telemetry)
  // ======================================================================
  function workspaceUI(st, o = {}) {
    const sh = shell(st, { ...o, scale: o.scale ?? 1.12 }, "workspaceui", 840, 720);
    const { root, app } = sh;
    const $ = (sel) => app.querySelector(sel);

    let files = (o.files || []).map((f) => ({ ...f }));
    let diffText = String(o.diff || "");
    let activeTab = o.activeFile || files[0]?.path || (diffText ? "__diff__" : "");
    let runs = (o.runs || []).map((r) => ({ ...r }));

    app.innerHTML =
      `<div class="wui-head"><div class="wui-path"><span class="wui-folder">${P.folder}</span><span class="wui-root">${esc(o.root || "workspace/")}</span></div><div class="wui-badge"></div></div>` +
      `<div class="wui-tabs"></div>` +
      `<div class="wui-viewer"><pre class="wui-code"></pre></div>` +
      `<div class="wui-foot"><div class="wui-foot-hd">Run comparison</div><div class="wui-runs"></div></div>`;

    const badgeEl = $(".wui-badge");
    const tabsEl = $(".wui-tabs");
    const codeEl = $(".wui-code");
    const viewerEl = $(".wui-viewer");
    const runsEl = $(".wui-runs");
    const footEl = $(".wui-foot");

    function setBadge(b) {
      if (!b || !b.label) { badgeEl.innerHTML = ""; return; }
      badgeEl.innerHTML = `<span class="wui-pill ${esc(b.tone || "gray")}">${esc(b.label)}</span>`;
    }

    function renderCodeContent(txt, isDiff) {
      const lines = String(txt ?? "").replace(/\n$/, "").split("\n");
      return lines.map((ln, idx) => {
        const e = esc(ln);
        if (isDiff) {
          if (/^diff --git|^index |^--- |^\+\+\+ /.test(ln)) return `<div class="wui-ln wui-meta">${e}</div>`;
          if (/^@@ /.test(ln)) return `<div class="wui-ln wui-hunk">${e}</div>`;
          if (/^\+/.test(ln)) return `<div class="wui-ln wui-add">${e}</div>`;
          if (/^-/.test(ln)) return `<div class="wui-ln wui-del">${e}</div>`;
          return `<div class="wui-ln">${e}</div>`;
        }
        return `<div class="wui-ln"><span class="wui-lnum">${idx + 1}</span><span>${e}</span></div>`;
      }).join("");
    }

    function renderTabsAndView() {
      const tabItems = files.map((f) => {
        const stCls = f.state === "modified" ? " mod" : f.state === "read" ? " rd" : "";
        const dot = f.state === "modified" ? `<i class="mod">M</i>` : f.state === "read" ? `<i class="rd">R</i>` : "";
        return `<button type="button" class="wui-tab${activeTab === f.path ? " on" : ""}${stCls}" data-path="${esc(f.path)}">${esc(f.path)}${dot}</button>`;
      });
      if (diffText.trim()) {
        tabItems.unshift(`<button type="button" class="wui-tab diff${activeTab === "__diff__" ? " on" : ""}" data-path="__diff__">git diff<i>Δ</i></button>`);
      }
      tabsEl.innerHTML = tabItems.join("");
      tabsEl.querySelectorAll(".wui-tab").forEach((b) => {
        b.addEventListener("click", (e) => {
          e.stopPropagation();
          activeTab = b.dataset.path || "";
          renderTabsAndView();
        });
      });

      if (activeTab === "__diff__" && diffText.trim()) {
        codeEl.innerHTML = renderCodeContent(diffText, true);
      } else {
        const hit = files.find((f) => f.path === activeTab) || files[0];
        if (hit) {
          activeTab = hit.path;
          codeEl.innerHTML = renderCodeContent(hit.content || "", false);
        } else {
          codeEl.innerHTML = `<div class="wui-ln wui-meta">No file selected</div>`;
        }
      }
    }

    function setFiles(nextFiles, opts = {}) {
      files = (nextFiles || []).map((f) => ({ ...f }));
      if (opts.diff !== undefined) diffText = String(opts.diff || "");
      if (opts.activeFile) activeTab = opts.activeFile;
      else if (opts.preferDiff && diffText.trim()) activeTab = "__diff__";
      else if (!files.some((f) => f.path === activeTab) && activeTab !== "__diff__") activeTab = files[0]?.path || "";
      renderTabsAndView();
      if (opts.flash) {
        viewerEl.classList.remove("flash");
        void viewerEl.offsetWidth;
        viewerEl.classList.add("flash");
      }
    }

    function markFile(filePath, state = "read", newContent) {
      const clean = String(filePath || "").replace(/^\.\//, "");
      const hit = files.find((f) => f.path === clean || clean.endsWith("/" + f.path));
      if (hit) {
        if (state === "modified" || hit.state !== "modified") hit.state = state;
        if (typeof newContent === "string") hit.content = newContent;
        activeTab = hit.path;
        renderTabsAndView();
      }
    }

    function setDiff(nextDiff, selectDiff = true) {
      diffText = String(nextDiff || "");
      if (selectDiff && diffText.trim()) activeTab = "__diff__";
      renderTabsAndView();
    }

    function setRuns(nextRuns) {
      runs = (nextRuns || []).map((r) => ({ ...r }));
      footEl.style.display = runs.length ? "flex" : "none";
      runsEl.innerHTML = runs.map((r) => {
        const tone = r.tone || "gray";
        return `<div class="wui-run${r.active ? " active" : ""}"><div class="wui-rlbl"><span class="wui-rdot ${esc(tone)}"></span><b>${esc(r.label)}</b></div><div class="wui-rmets"><span><em>calls</em> ${esc(r.calls ?? "—")}</span><span><em>chain</em> ${esc(r.subcmds ?? "—")}</span><span><em>tokens</em> ${esc(r.tokens ?? "—")}</span><span class="wui-rstat ${esc(tone)}">${esc(r.status ?? "idle")}</span></div></div>`;
      }).join("");
    }

    setBadge(o.badge || null);
    renderTabsAndView();
    setRuns(runs);

    st.el.appendChild(root);
    const r = finish(st, root);
    return {
      el: root, kind: "box", ...r, cx: r.x + r.w / 2, cy: r.y + r.h / 2, scale: sh.s,
      setBadge, setFiles, markFile, setDiff, setRuns,
    };
  }

  Object.assign(window, { slackUI, sheetUI, consoleUI, statusDock, terminalUI, workspaceUI });
})();


// === kit-anim.js ===
// Motion for diagrams: dots flowing along arrows, elements appearing one after
// another, arrows drawing themselves, a pulse ring around a shape.
// Requires kit.js (svgEl, stageRect).
//
// Everything here is a NO-OP unless the page is opened with `?anim=1` (play
// once) or `?anim=loop` (replay forever). Without the flag a diagram renders its
// final, static state, so `render` and `check` are unaffected and a PNG and a
// video come from the same file. `bun run animate <name>` steps through the
// timeline frame by frame and writes out/<name>_<v>[_dark].mp4 (+ .gif).
//
//   flow(st, arrows, { dur, n, tone, r, at, reverse })        dots along arrows
//   reveal(st, items, { at, step, dur })  → end time (s)     fade/draw in, staggered
//   scene(st, groups, { step, stagger, dur, at }) → end      groups one after another
//   pulse(st, shape, { at, dur, tone, n })                   ring pulse around a box
//   animated() → bool   duration() → s   seek(ms)  pause()  play()  replay()
//
// Items for reveal/scene: anything with `.el` (shapes), an SVG <g> from
// arrow/elbow/connect, a DOM element, a sequence row (`{ els }`), or arrays of
// those (flattened). Times are seconds from the start of the timeline.
// Keyboard while playing: space pause/play, r replay, ←/→ scrub 250 ms.
(function () {
  const MODE = new URLSearchParams(location.search).get("anim") ?? "1";
  const ON = MODE != null && MODE !== "0";
  const HOLD = 1.2;            // seconds kept after the last reveal when exporting
  let clock = 0;               // where the next reveal starts by default
  let total = 0;               // last scheduled moment
  let ids = 0;

  const animated = () => ON;
  const duration = () => total + HOLD;
  const svgRoot = () => document.querySelector("svg.wires");
  const mark = (t) => { total = Math.max(total, t); };

  // ---- normalise items -------------------------------------------------
  function elsOf(item) {
    if (!item) return [];
    if (Array.isArray(item)) return item.flatMap(elsOf);
    if (item instanceof Element) return [item];
    if (item.els) return item.els.flatMap(elsOf);
    if (item.el) return [item.el];
    return [];
  }
  const isArrow = (el) => el.tagName === "g" && el.dataset.kind === "arrow";

  // ---- flow: dots along an arrow ----------------------------------------
  // The motion path is the arrow's full route, even when the line is broken
  // around a label. Dots are inserted above the line and below the text.
  function routeOf(g) {
    const lines = g.querySelectorAll("path.line");
    if (lines.length === 1) return lines[0].getAttribute("d");
    const d = g.dataset;
    return `M${d.x1} ${d.y1} L${d.x2} ${d.y2}`;
  }
  function flow(st, arrows, o = {}) {
    if (!ON) return;
    const dur = o.dur ?? 1.6, n = o.n ?? 1, r = o.r ?? 5, at = o.at ?? 0;
    for (const g of elsOf(arrows).filter(isArrow)) {
      let fp = g.querySelector("path.flowpath");
      if (!fp) {
        fp = svgEl("path", { class: "flowpath", id: "fp" + ++ids, d: routeOf(g), style: "stroke:none;fill:none" });
        g.insertBefore(fp, g.firstChild);
      }
      const before = g.querySelector("text, .badge");
      for (let i = 0; i < n; i++) {
        const begin = at + (i * dur) / n;
        const c = svgEl("circle", { class: "flowdot " + (o.tone || ""), r, opacity: 0 });
        const m = svgEl("animateMotion", { dur: dur + "s", begin: begin + "s", repeatCount: "indefinite", calcMode: "linear" });
        if (o.reverse) { m.setAttribute("keyPoints", "1;0"); m.setAttribute("keyTimes", "0;1"); }
        m.appendChild(svgEl("mpath", { href: "#" + fp.id }));
        c.appendChild(m);
        c.appendChild(svgEl("set", { attributeName: "opacity", to: 1, begin: begin + "s", fill: "freeze" }));
        before ? g.insertBefore(c, before) : g.appendChild(c);
      }
      mark(at + dur);
    }
  }

  // ---- reveal: fade in, arrows draw themselves --------------------------
  function revealEl(el, t, dur) {
    el.style.setProperty("--d", t + "s");
    el.style.setProperty("--dur", dur + "s");
    if (isArrow(el) && !/\b(dash|dot)\b/.test(el.querySelector("path.line")?.getAttribute("class") || "")) {
      el.classList.add("rv-arrow");
      el.querySelectorAll("path.line").forEach((p) => p.style.setProperty("--len", p.getTotalLength() + "px"));
    } else {
      el.classList.add("rv");
    }
  }
  function reveal(st, items, o = {}) {
    if (!ON) return 0;
    const step = o.step ?? 0.35, dur = o.dur ?? 0.45;
    const t0 = o.at ?? clock;
    const els = elsOf(items);
    els.forEach((el, i) => revealEl(el, t0 + i * step, dur));
    const end = t0 + Math.max(0, els.length - 1) * step + dur;
    clock = end; mark(end);
    return end;
  }
  // groups appear one after another; members of a group together (small stagger)
  function scene(st, groups, o = {}) {
    if (!ON) return 0;
    const step = o.step ?? 0.7, stagger = o.stagger ?? 0.08, dur = o.dur ?? 0.45;
    let t = o.at ?? clock;
    for (const g of groups) {
      const els = elsOf(g);
      els.forEach((el, i) => revealEl(el, t + i * stagger, dur));
      mark(t + (els.length - 1) * stagger + dur);
      t += step;
    }
    clock = total;
    return total;
  }

  // ---- pulse: expanding ring around a shape -----------------------------
  function pulse(st, shape, o = {}) {
    if (!ON) return;
    const r = shape.kind === "circle" ? { x: shape.x - shape.r, y: shape.y - shape.r, w: 2 * shape.r, h: 2 * shape.r } : stageRect(st, shape.el);
    const rx = shape.kind === "circle" ? shape.r : Number(getComputedStyle(shape.el).borderRadius.replace("px", "")) || 12;
    const at = o.at ?? clock, dur = o.dur ?? 1.2, n = o.n ?? 1;
    for (let i = 0; i < n; i++) {
      const ring = svgEl("rect", { class: "pulse " + (o.tone || ""), x: r.x, y: r.y, width: r.w, height: r.h, rx });
      ring.style.setProperty("--d", at + i * (dur / 2) + "s");
      ring.style.setProperty("--dur", dur + "s");
      svgRoot().insertBefore(ring, svgRoot().firstChild);
    }
    mark(at + dur + ((n - 1) * dur) / 2);
  }

  // ---- transport -------------------------------------------------------
  function seek(ms) {
    const s = svgRoot();
    s.pauseAnimations(); s.setCurrentTime(ms / 1000);
    for (const a of document.getAnimations()) { a.pause(); a.currentTime = ms; }
  }
  function pause() { svgRoot().pauseAnimations(); document.getAnimations().forEach((a) => a.pause()); }
  function play() { svgRoot().unpauseAnimations(); document.getAnimations().forEach((a) => a.play()); }
  function replay() { seek(0); play(); }
  function now() { return svgRoot().getCurrentTime() * 1000; }

  if (ON) {
    document.documentElement.dataset.anim = MODE;
    // keydown handled by deck shell
    if (MODE === "loop") addEventListener("load", () => setInterval(() => { if (now() > duration() * 1000 + 800) replay(); }, 200));
  }

  (window.__kitResets = window.__kitResets || []).push(() => { clock = 0; total = 0; ids = 0; });
  Object.assign(window, { animated, duration, flow, reveal, scene, pulse, seek, pause, play, replay });
})();
