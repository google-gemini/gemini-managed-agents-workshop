w,\n  title: \"Live Demo · Running locally\",\n  lang: \"text\", light: true, size: 22, cls: \"copy-prompt\",\n  code: DEMO_URL,\n});\nwireCopyPrompt(linkCard, DEMO_URL, \"Copy URL\");"},{"id":"workshop-03-how-loop","title":"03 · How a Managed Agent works","notes":"Right after the demo, here is the mental model for Gemini Managed Agents. Your app sends one streaming request to the Gemini API. The API boots an isolated Ubuntu sandbox with 4 vCPUs and 16 GB of RAM, mounts your AGENTS.md, skills, and workspace files, and runs the reasoning and tool loop with gemini-4-carbon until the review is complete.","anim":true,"code":"const st = slide({ n: 3, total: 17, cls: \"flat\" });\nconst f = st.frame;\nconst h = heading(st, {\n  x: f.x, y: f.y, w: f.w,\n  text: `<span class=\"kicker\">Mental model · Managed runtime</span>How a Managed Agent works`,\n});\nconst chiprow = (items) => `<div class=\"chiprow\">${items.map((c) => `<span class=\"chip\">${c}</span>`).join(\"\")}</div>`;\nconst XA = 290, WA = 530, XS = 1090, WS = 530, HM = 192, G = 96;\nconst yTop = h.y + h.h + 36;\nconst app = box(st, {\n  x: XA, y: yTop, w: WA, size: \"lg\", icon: \"laptop\", tone: \"blue\",\n  title: \"Your App\", sub: \"CLI script or Bun web server\",\n});\nconst api = box(st, {\n  x: XA, y: app.y + app.h + G, w: WA, h: HM, size: \"lg\", icon: \"cloud\", tone: \"purple\",\n  title: \"Gemini API\", sub: \"boots, routes, loops\",\n  body: chiprow([\"mcp_server\", \"filesystem\", \"skills\"]),\n});\nconst model = box(st, {\n  x: XA, y: api.y + api.h + G, w: WA, size: \"lg\", icon: \"gemini\", tone: \"purple\", strong: true,\n  title: \"gemini-4-carbon\", sub: \"reasons and picks the next tool call\",\n});\nconst sbx = box(st, {\n  x: XS, y: api.y, w: WS, h: HM, size: \"lg\", icon: \"terminal\", tone: \"green\",\n  title: \"Sandbox\", sub: \"Ubuntu · 4 vCPU · 16 GB\",\n  body: chiprow([\"AGENTS.md\", \"skills/\", \"workspace/\"]),\n});\nconst SW = 156, SG = (WS - 3 * SW) / 2;\nconst srcs = [\"inline\", \"repository\", \"gcs\"].map((t, i) =>\n  box(st, { x: XS + i * (SW + SG), y: app.y + 18, w: SW, size: \"sm\", tone: \"dashed\", mono: true, title: t })\n);\nconst feeds = srcs.map((s) => connect(st, s, sbx, { from: \"bottom\", to: \"top\", toAt: (s.cx - sbx.x) / sbx.w, cls: \"thin\" }));\nconst req = connect(st, app, api, { fromAt: 0.36, toAt: 0.36, label: \"request\", labelSide: \"left\" });\nconst res = connect(st, api, app, { fromAt: 0.64, toAt: 0.64, label: \"streamed steps & output\", labelSide: \"right\", cls: \"dash\" });\nconst think = connect(st, api, model, { fromAt: 0.36, toAt: 0.36, label: \"context\", labelSide: \"left\" });\nconst call = connect(st, model, api, { fromAt: 0.64, toAt: 0.64, label: \"tool call\", labelSide: \"right\", cls: \"dash\" });\nconst exec = connect(st, api, sbx, { from: \"right\", to: \"left\", fromAt: 0.38, toAt: 0.38, label: \"execute\" });\nconst back = connect(st, sbx, api, { from: \"left\", to: \"right\", fromAt: 0.62, toAt: 0.62, label: \"results\", cls: \"dash\" });\nconst cap = prose(st, {\n  x: f.x, y: model.y + model.h + 32, w: f.w, size: \"sm\", muted: true, align: \"center\",\n  text: \"Gemini hosts the VM, tool router, and continuation loop. Your app streams events and reads the final verdict.\",\n});\nconst t = scene(st, [[app], [req, api], [...srcs, ...feeds, sbx], [think, model], [call], [exec], [back], [res, cap]], { step: 0.45 });\nflow(st, req, { at: t, tone: \"blue\" });\nflow(st, [think, call], { at: t + 0.4, tone: \"purple\" });\nflow(st, [exec, back], { at: t + 0.8, tone: \"green\" });\nflow(st, res, { at: t + 1.2, tone: \"blue\" });"},{"id":"workshop-04-how-harness","title":"04 · Inside the Antigravity harness","notes":"What does base_agent antigravity-preview-09-2026 give you out of the box with gemini-4-carbon? Without maintaining custom tool schemas or container images, your agent gets sandboxed Bash, Python, Node, and git execution, native file read/write/edit tools, grounded Google Search, automatic context compaction, and environments.files upload and download.","anim":false,"code":"const st = slide({ n: 4, total: 17, cls: \"flat\" });\nconst f = st.frame;\nconst h = heading(st, {\n  x: f.x, y: f.y, w: f.w,\n  text: `<span class=\"kicker\">Built-in runtime · Antigravity</span>Inside the Antigravity harness`,\n});\nconst [L, R] = cols(f, [48, 52], 64);\nconst y0 = h.y + h.h + 56;\n\ncodeCard(st, {\n  x: L.x, y: y0, w: L.w,\n  title: \"antigravity-preview-09-2026\", lang: \"ts\", size: 21,\n  code: `const stream = await ai.interactions.create({\n  agent: \"antigravity-preview-09-2026\",\n  agent_config: {\n    type: \"antigravity\",\n    model: \"gemini-4-carbon\",\n  },\n  environment: \"remote\",\n  stream: true,\n  input: \"Clone repo and summarize latest PR.\",\n});`,\n});\n\nconst items = [\n  [\"terminal\", \"green\", \"Sandboxed Bash, Python, Node & git\"],\n  [\"fileedit\", \"blue\", \"File read, write & edit\"],\n  [\"search\", \"purple\", \"Grounded Google Search\"],\n  [\"loop\", \"amber\", \"Automatic context compaction\"],\n  [\"folder\", \"teal\", \"environments.files upload & download\"],\n];\nlet fy = y0 + 8;\nitems.forEach(([icon, tone, title]) => {\n  const ft = feature(st, { x: R.x, y: fy, w: R.w, layout: \"row\", icon, tone, title });\n  fy = ft.y + ft.h + 34;\n});"},{"id":"workshop-05-how-state","title":"05 · Two handles, two kinds of state","notes":"Every Managed Agent run returns two independent server handles on the interaction object: interaction.id and interaction.environment_id. Passing previous_interaction_id keeps conversation memory across turns. Passing environment keeps the /workspace filesystem across turns. Because they are independent, you can start a fresh conversation on an existing warm workspace.","anim":false,"code":"const st = slide({ n: 5, total: 17, cls: \"flat\" });\nconst f = st.frame;\nconst h = heading(st, {\n  x: f.x, y: f.y, w: f.w,\n  text: `<span class=\"kicker\">Stateful sessions · Handles</span>Two handles, two kinds of state`,\n});\nconst y0 = h.y + h.h + 28;\nconst turn1 = box(st, {\n  x: f.cx - 320, y: y0, w: 640, size: \"lg\", icon: \"gemini\", tone: \"purple\", strong: true,\n  title: \"Turn 1 · interaction response\",\n  sub: \"Returns two independent server-side handles\",\n});\n\nconst [L, R] = cols(f, 2, 56);\nconst cy = turn1.y + turn1.h + 88;\n\nconst leftCard = card(st, {\n  x: L.x, y: cy, w: L.w, size: \"sm\", icon: \"chat\", iconTone: \"blue\",\n  kicker: \"Handle 1 · Conversation state\",\n  title: \"interaction.id\",\n  html: `<div class=\"txt\">Pass as <code>previous_interaction_id</code> on Turn 2 to keep messages, model reasoning, and tool call history in context.</div>`,\n  foot: \"previous_interaction_id: turn1.id\",\n});\n\nconst rightCard = card(st, {\n  x: R.x, y: cy, w: R.w, size: \"sm\", icon: \"terminal\", iconTone: \"green\",\n  kicker: \"Handle 2 · Machine state\",\n  title: \"interaction.environment_id\",\n  html: `<div class=\"txt\">Pass as <code>environment</code> on Turn 2 to keep <code>/workspace</code> files &amp; packages. Spins down after <b>15m idle</b>, retained <b>7 days</b>.</div>`,\n  foot: \"environment: turn1.environment_id\",\n});\n\nconnect(st, turn1, leftCard, { from: \"bottom\", to: \"top\", fromAt: 0.3, label: \"conversation\" });\nconnect(st, turn1, rightCard, { from: \"bottom\", to: \"top\", fromAt: 0.7, label: \"filesystem\" });\n\nconst turn2Y = Math.max(leftCard.y + leftCard.h, rightCard.y + rightCard.h) + 28;\ncodeCard(st, {\n  x: f.x, y: turn2Y, w: f.w,\n  title: \"Turn 2 · Resume conversation on the same warm sandbox\", lang: \"ts\", size: 19,\n  code: `const turn2 = await ai.interactions.create({\n  agent: \"pr-reviewer\",\n  previous_interaction_id: turn1.id,       // keeps conversation history\n  environment: turn1.environment_id,       // keeps /workspace files & installed deps\n  input: \"Now check whether unit tests cover that edge case.\",\n});`,\n});"},{"id":"workshop-06-req-oauth","title":"06 · Step 1 · Requirements: API key & GitHub OAuth App","notes":"Before we build Step 1, add two things to .env: your Gemini API key from Google AI Studio, and a GitHub OAuth App registered at github.com/settings/developers with callback URL http://localhost:3000/auth/github/callback. Steps 1 and 2 inspect public repositories with zero GitHub auth, and Steps 3 and 4 exchange your GitHub OAuth login into a Gemini Credential Vault entry that authenticates Remote GitHub MCP directly.","anim":false,"code":"const st = slide({ n: 6, total: 17, cls: \"flat\" });\nconst f = st.frame;\nconst h = heading(st, {\n  x: f.x, y: f.y, w: f.w,\n  text: `<span class=\"kicker\">Step 1 of 4 · Setup</span>Gemini API key &amp; GitHub OAuth App`,\n});\nconst [L, R] = cols(f, [54, 46], 48);\nconst y0 = h.y + h.h + 36;\n\nconst nav = pills(st, {\n  x: L.x, y: y0, size: \"md\", gap: 10,\n  items: [\n    { text: \"Settings\" },\n    { text: \"Developer settings\" },\n    { text: \"OAuth Apps\" },\n    { text: \"New OAuth App\", tone: \"purple\" },\n  ],\n});\n\nmodal(st, {\n  x: L.x, y: nav.y + nav.h + 20, w: L.w,\n  title: \"Register a new OAuth application\",\n  link: \"github.com/settings/developers\",\n  rows: [\n    { label: \"Application name\", text: \"PR Reviewer Workshop\", on: true, check: true },\n    { label: \"Homepage URL\", text: \"http://localhost:3000\", on: true, check: true },\n    { label: \"Authorization callback URL\", text: \"http://localhost:3000/auth/github/callback\", on: true, check: true },\n  ],\n});\n\nconst envCard = codeCard(st, {\n  x: R.x, y: nav.y + nav.h + 20, w: R.w,\n  title: \".env · Workshop credentials\", lang: \"sh\", size: 20,\n  code: `# 1. Gemini API key from Google AI Studio\nGEMINI_API_KEY=AIzaSy...\n\n# 2. GitHub OAuth App (used in Steps 3 & 4)\nGITHUB_CLIENT_ID=Ov23li...\nGITHUB_CLIENT_SECRET=9f8e7d6c...`,\n});\n\ncard(st, {\n  x: R.x, y: envCard.y + envCard.h + 28, w: R.w, size: \"sm\", layout: \"row\",\n  icon: \"bolt\", iconTone: \"blue\",\n  title: \"One OAuth setup for everything\",\n  html: `<div class=\"txt\">Steps 1 &amp; 2 run on public repos with zero GitHub auth. Steps 3 &amp; 4 exchange your OAuth login into Gemini Vault to power Remote GitHub MCP.</div>`,\n});"},{"id":"workshop-07-step1-build","title":"07 · Step 1 · Build & run your first agent","notes":"Time to build Step 1! Click Copy Prompt and paste it into your coding agent. Your coding agent will read the gemini-managed-agents skill, write the script, run it against google/budoux, and stream the steps live.","anim":false,"code":"// Shared interactive prompt & link copy helpers for the AIE Code Summit workshop deck,\n// inlined into live slides by scripts/gen.ts (__LIVE__).\n(function ensureWorkshopStyles() {\n  if (document.getElementById(\"workshop-live-css\")) return;\n  const style = document.createElement(\"style\");\n  style.id = \"workshop-live-css\";\n  style.textContent = `\n    .card.copy-prompt .bar {\n      height: 52px;\n      padding: 0 20px;\n    }\n    .card.copy-prompt .bar .ctitle {\n      text-align: left;\n      margin-right: 0 !important;\n      font-size: 15px;\n      font-weight: 500;\n      color: var(--muted);\n    }\n    .card.copy-prompt pre {\n      white-space: pre-wrap;\n      overflow-wrap: break-word;\n      line-height: 1.55;\n      padding: 20px 26px 22px;\n    }\n    .card.copy-prompt pre .ln {\n      padding: 2px 26px;\n      margin: 0 -26px 6px;\n    }\n    .card.copy-prompt pre .ln:last-child {\n      margin-bottom: 0;\n    }\n    .card.copy-prompt pre .ln:first-child {\n      font-weight: 600;\n      color: var(--ink);\n    }\n    .copy-prompt-btn {\n      display: inline-flex;\n      align-items: center;\n      gap: 8px;\n      padding: 7px 16px;\n      border-radius: 999px;\n      border: 0;\n      background: var(--blue-bg);\n      color: var(--blue);\n      font: 600 14.5px/1.2 var(--font);\n      cursor: pointer;\n      flex: none;\n      transition: background 0.15s ease, transform 0.1s ease;\n    }\n    .copy-prompt-btn:hover {\n      background: color-mix(in srgb, var(--blue) 18%, var(--blue-bg));\n    }\n    .copy-prompt-btn:active {\n      transform: scale(0.97);\n    }\n    .copy-prompt-btn.copied {\n      background: var(--green-bg);\n      color: var(--green);\n    }\n    .copy-prompt-btn svg {\n      width: 16px;\n      height: 16px;\n      fill: none;\n      stroke: currentColor;\n      stroke-width: 2.1;\n      stroke-linecap: round;\n      stroke-linejoin: round;\n    }\n    .photo.demo-shot .ph-pic {\n      border-radius: 20px;\n      background: #ffffff;\n      box-shadow: 0 18px 44px -24px rgba(15, 23, 42, 0.22);\n    }\n  `;\n  document.head.appendChild(style);\n})();\n\nconst COPY_ICON = '<svg viewBox=\"0 0 24 24\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/></svg>';\nconst CHECK_ICON = '<svg viewBox=\"0 0 24 24\"><polyline points=\"4 12.5 9.5 18 20 6\"/></svg>';\n\nasync function copyTextToClipboard(text) {\n  if (navigator.clipboard && navigator.clipboard.writeText) {\n    try {\n      await navigator.clipboard.writeText(text);\n      return true;\n    } catch {}\n  }\n  const ta = document.createElement(\"textarea\");\n  ta.value = text;\n  ta.style.cssText = \"position:fixed;left:-9999px;top:0;opacity:0\";\n  document.body.appendChild(ta);\n  ta.focus();\n  ta.select();\n  let ok = false;\n  try { ok = document.execCommand(\"copy\"); } catch {}\n  ta.remove();\n  return ok;\n}\n\nfunction wireCopyPrompt(cardRef, rawPrompt, label = \"Copy Prompt\") {\n  const el = cardRef?.el || document.querySelector(\".copy-prompt\");\n  if (!el) return;\n  el.classList.add(\"copy-prompt\", \"has-actions\");\n  const bar = el.querySelector(\".bar\");\n  if (!bar || bar.querySelector(\".copy-prompt-btn\")) return;\n  const textToCopy = rawPrompt || Array.from(el.querySelectorAll(\"pre .ln\")).map((n) => n.textContent).join(\"\\n\");\n  const btn = document.createElement(\"button\");\n  btn.type = \"button\";\n  btn.className = \"copy-prompt-btn\";\n  btn.innerHTML = `${COPY_ICON}<span>${label}</span>`;\n  let resetTimer = null;\n  btn.addEventListener(\"click\", async (e) => {\n    e.stopPropagation();\n    await copyTextToClipboard(textToCopy);\n    btn.classList.add(\"copied\");\n    btn.innerHTML = `${CHECK_ICON}<span>Copied!</span>`;\n    clearTimeout(resetTimer);\n    resetTimer = setTimeout(() => {\n      btn.classList.remove(\"copied\");\n      btn.innerHTML = `${COPY_ICON}<span>${label}</span>`;\n    }, 1800);\n  });\n  bar.appendChild(btn);\n}\nconst st = slide({ n: 7, total: 17, cls: \"flat\" });\nconst f = st.frame;\nconst h = heading(st, {\n  x: f.x, y: f.y, w: f.w,\n  text: `<span class=\"kicker\">Step 1 of 4 · Hands-on build</span>Build &amp; run your first agent`,\n});\n\nconst PROMPT = `Use the gemini-managed-agents skill to build and run a minimal PR reviewer:\n1. Create a minimal agent \"pr-reviewer-basic\" with gemini-4-carbon on antigravity-preview-09-2026.\n2. Send a streaming request to inspect the latest open PR on google/budoux.\n3. Log each step as it runs, print the final summary and environment_id, and execute it.`;\n\nconst pCard = codeCard(st, {\n  x: f.x, y: h.y + h.h + 48, w: f.w,\n  title: \"Prompt · Copy & paste into your coding agent\",\n  lang: \"text\", light: true, cls: \"copy-prompt\", size: 22.5,\n  code: PROMPT,\n});\nconst cy = Math.round((h.y + h.h + f.bottom - pCard.h) / 2);\npCard.el.style.top = px(cy); pCard.el.dataset.y = cy; pCard.y = cy;\nwireCopyPrompt(pCard, PROMPT);"},{"id":"workshop-08-agent-def","title":"08 · Step 2 · Saved agent definitions","notes":"In Step 2 we turn an ad-hoc prompt into a reusable saved agent definition with ai.agents.create. Give it a stable ID with no gemini- prefix, configure gemini-4-carbon, omit url_context so untrusted PR text cannot fetch arbitrary URLs, and mount your local agent/ files inline under /.agents/.","anim":false,"code":"const st = slide({ n: 8, total: 17, cls: \"flat\" });\nconst f = st.frame;\nconst h = heading(st, {\n  x: f.x, y: f.y, w: f.w,\n  text: `<span class=\"kicker\">Step 2 of 4 · Agent definition</span>Saved agent definitions`,\n});\nconst c = codeCard(st, {\n  x: f.x, y: h.y + h.h + 52, w: 1060,\n  title: \"server/agentDefinition.ts\", lang: \"ts\", size: 20.5,\n  code: `await ai.agents.create({\n  id: \"pr-reviewer\",\n  base_agent: \"antigravity-preview-09-2026\",\n  agent_config: { type: \"antigravity\", model: \"gemini-4-carbon\" },\n  system_instruction: \"You are an engineering PR reviewer.\",\n  tools: [{ type: \"code_execution\" }, { type: \"google_search\" }],\n  base_environment: {\n    type: \"remote\",\n    sources: [\n      inline(\"AGENTS.md\", \"/.agents/AGENTS.md\"),\n      inline(\"skills/pr-review/SKILL.md\",\n             \"/.agents/skills/pr-review/SKILL.md\"),\n    ],\n  },\n});`,\n});\nconst ax = c.x + c.w + 56, aw = f.right - ax + 40;\nconst note = (n, html) => {\n  const L = c.line(n);\n  prose(st, { x: ax, y: L.y - 18, w: aw, size: \"ms\", html });\n  leader(st, [c.x + c.w + 8, L.y], [ax - 12, L.y]);\n};\nnote(2, \"Stable ID, no <code>gemini-</code> prefix\");\nnote(4, \"<code>gemini-4-carbon</code> on Antigravity\");\nnote(6, \"Omit <code>url_context</code>\");\nnote(10, \"Inline mounts at <code>/.agents/</code>\");"},{"id":"workshop-09-skill-layers","title":"09 · Step 2 · Knowledge in three layers","notes":"Managed Agents load instructions progressively in three layers. system_instruction sets core identity. /.agents/AGENTS.md is always loaded for untrusted-input guardrails and output structure. And /.agents/skills/pr-review/SKILL.md holds our engineering code review principles, loaded on demand only when reviewing a pull request.","anim":false,"code":"const st = slide({ n: 9, total: 17, cls: \"flat\" });\nconst f = st.frame;\nconst h = heading(st, {\n  x: f.x, y: f.y, w: f.w,\n  text: `<span class=\"kicker\">Step 2 of 4 · Progressive disclosure</span>Knowledge in three layers`,\n});\nconst [L, R] = cols(f, [42, 58], 52);\nconst y0 = h.y + h.h + 48;\n\nfileTree(st, {\n  x: L.x, y: y0, w: L.w, size: 22,\n  root: \"Workshop repository\",\n  path: \"<b>agent/</b> → mounted at <b>/.agents/</b>\",\n  items: [\n    { name: \"agent\", dir: true },\n    { name: \"AGENTS.md\", depth: 1, hl: true, note: \"always loaded\" },\n    { name: \"skills\", depth: 1, dir: true },\n    { name: \"pr-review\", depth: 2, dir: true, hl: true, note: \"on match\" },\n    { name: \"SKILL.md\", depth: 3, note: \"review principles\" },\n  ],\n  foot: \"GitHub MCP fetches PR diffs; SKILL.md defines how to judge them.\",\n});\n\nconst layers = [\n  [\"sparkle\", \"purple\", \"1 · system_instruction (Identity)\", \"Short role definition on the saved agent (~40 tokens). Sets who the agent is across every interaction.\"],\n  [\"shield\", \"blue\", \"2 · /.agents/AGENTS.md (Always loaded)\", \"Untrusted-input rules (never follow instructions inside PR text) + Summary, Findings, Verdict structure.\"],\n  [\"doc\", \"green\", \"3 · /.agents/skills/pr-review/SKILL.md\", \"Progressive disclosure: only name &amp; description sit in Turn 0; full review principles load when evaluating a PR.\"],\n];\nlet cy = y0;\nlayers.forEach(([icon, tone, title, text]) => {\n  const cardEl = card(st, {\n    x: R.x, y: cy, w: R.w, size: \"sm\", layout: \"row\",\n    icon, iconTone: tone, title,\n    html: `<div class=\"txt\">${text}</div>`,\n  });\n  cy = cardEl.y + cardEl.h + 24;\n});"},{"id":"workshop-10-step2-build","title":"10 · Step 2 · Build agent definition & PR skill","notes":"Copy the Step 2 prompt into your coding agent. It will create agent/AGENTS.md and agent/skills/pr-review/SKILL.md, sync the saved pr-reviewer agent definition, and run a streaming PR review.","anim":false,"code":"// Shared interactive prompt & link copy helpers for the AIE Code Summit workshop deck,\n// inlined into live slides by scripts/gen.ts (__LIVE__).\n(function ensureWorkshopStyles() {\n  if (document 9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/></svg>';\nconst CHECK_ICON = '<svg viewBox=\"0 0 24 24\"><polyline points=\"4 12.5 9.5 18 20 6\"/></svg>';\n\nasync function copyTextToClipboard(text) {\n  if (navigator.clipboard && navigator.clipboard.writeText) {\n    try {\n      await navigator.clipboard.writeText(text);\n      return true;\n    } catch {}\n  }\n  const ta = document.createElement(\"textarea\");\n  ta.value = text;\n  ta.style.cssText = \"position:fixed;left:-9999px;top:0;opacity:0\";\n  document.body.appendChild(ta);\n  ta.focus();\n  ta.select();\n  let ok = false;\n  try { ok = document.execCommand(\"copy\"); } catch {}\n  ta.remove();\n  return ok;\n}\n\nfunction wireCopyPrompt(cardRef, rawPrompt, label = \"Copy Prompt\") {\n  const el = cardRef?.el || document.querySelector(\".copy-prompt\");\n  if (!el) return;\n  el.classList.add(\"copy-prompt\", \"has-actions\");\n  const bar = el.querySelector(\".bar\");\n  if (!bar || bar.querySelector(\".copy-prompt-btn\")) return;\n  const textToCopy = rawPrompt || Array.from(el.querySelectorAll(\"pre .ln\")).map((n) => n.textContent).join(\"\\n\");\n  const btn = document.createElement(\"button\");\n  btn.type = \"button\";\n  btn.className = \"copy-prompt-btn\";\n  btn.innerHTML = `${COPY_ICON}<span>${label}</span>`;\n  let resetTimer = null;\n  btn.addEventListener(\"click\", async (e) => {\n    e.stopPropagation();\n    await copyTextToClipboard(textToCopy);\n    btn.classList.add(\"copied\");\n    btn.innerHTML = `${CHECK_ICON}<span>Copied!</span>`;\n    clearTimeout(resetTimer);\n    resetTimer = setTimeout(() => {\n      btn.classList.remove(\"copied\");\n      btn.innerHTML = `${COPY_ICON}<span>${label}</span>`;\n    }, 1800);\n  });\n  bar.appendChild(btn);\n}\nconst st = slide({ n: 10, total: 17, cls: \"flat\" });\nconst f = st.frame;\nconst h = heading(st, {\n  x: f.x, y: f.y, w: f.w,\n  text: `<span class=\"kicker\">Step 2 of 4 · Hands-on build</span>Build agent definition &amp; review skill`,\n});\n\nconst PROMPT = `Use the gemini-managed-agents skill to add agent instructions and a PR review skill:\n1. Create agent/AGENTS.md with untrusted-input guardrails and a Summary, Findings, Verdict format.\n2. Create agent/skills/pr-review/SKILL.md defining our engineering code review principles and severity criteria.\n3. Sync the saved \"pr-reviewer\" agent definition and run a streaming PR review on google/budoux.`;\n\nconst pCard = codeCard(st, {\n  x: f.x, y: h.y + h.h + 48, w: f.w,\n  title: \"Prompt · Copy & paste into your coding agent\",\n  lang: \"text\", light: true, cls: \"copy-prompt\", size: 22.5,\n  code: PROMPT,\n});\nconst cy = Math.round((h.y + h.h + f.bottom - pCard.h) / 2);\npCard.el.style.top = px(cy); pCard.el.dataset.y = cy; pCard.y = cy;\nwireCopyPrompt(pCard, PROMPT);"},{"id":"workshop-11-cred-why","title":"11 · Step 3 · Why tokens never belong in the sandbox","notes":"A pull request reviewer reads untrusted PR descriptions and diffs. On the left, putting a normal .env file or raw GITHUB_TOKEN inside the sandbox exposes the secret in os.environ to prompt injection or untrusted scripts. On the right, with the Credentials API vault, your token is stored write-only outside the container and referenced by ID only.","anim":false,"code":"const st = slide({ n: 11, total: 17, cls: \"flat\" });\nconst f = st.frame;\nconst h = heading(st, {\n  x: f.x, y: f.y, w: f.w,\n  text: `<span class=\"kicker\">Step 3 of 4 · Security boundary</span>Why tokens never belong in the sandbox`,\n});\nconst [L, R] = cols(f, 2, 56);\nconst pad = 28;\nconst y0 = h.y + h.h + 72;\n\nconst badCode = codeCard(st, {\n  x: L.x + pad, y: y0, w: L.w - 2 * pad,\n  title: \".env inside sandbox · Raw secret exposed\", lang: \"sh\", size: 19,\n  code: `# Mounted or exported inside /workspace\nGITHUB_TOKEN=ghp_9f8e7d6c4b2a1f...\nOPENAI_API_KEY=sk-live-...`,\n});\nconst goodCode = codeCard(st, {\n  x: R.x + pad, y: y0, w: R.w - 2 * pad,\n  title: \"Credentials API · Referenced by ID only\", lang: \"ts\", size: 19,\n  code: `await ai.credentials.create({\n  id: \"gh-token\", type: \"bearer_token\", token,\n});\n// Turn uses { credential: \"gh-token\" } only`,\n});\nconst codeH = Math.max(badCode.h, goodCode.h);\n[badCode, goodCode].forEach((c) => { c.el.style.height = px(codeH); c.el.dataset.h = codeH; c.h = codeH; });\n\nconst conseqY = y0 + codeH + 24;\nconst badConseq = box(st, {\n  x: L.x + pad, y: conseqY, w: L.w - 2 * pad,\n  tone: \"red\", align: \"left\", icon: \"warn\",\n  title: \"Readable via os.environ & /proc\",\n  sub: \"Prompt injection or untrusted code inside the container can read .env or os.environ and exfiltrate the token.\",\n});\nconst goodConseq = box(st, {\n  x: R.x + pad, y: conseqY, w: R.w - 2 * pad,\n  tone: \"green\", align: \"left\", icon: \"shield\",\n  title: \"Write-only vault + proxy injection\",\n  sub: \"Sandbox has zero secrets in .env or os.environ. The egress proxy injects Bearer headers on the wire only.\",\n});\nconst conseqH = Math.max(badConseq.h, goodConseq.h);\n[badConseq, goodConseq].forEach((b) => { b.el.style.height = px(conseqH); b.el.dataset.h = conseqH; b.h = conseqH; });\n\nconst leftPanel = panel(st, {\n  around: [badCode, badConseq], pad,\n  title: \"Traditional · .env inside the container\",\n});\nconst rightPanel = panel(st, {\n  around: [goodCode, goodConseq], pad,\n  title: \"Gemini Managed Agents · Credentials Vault\",\n});\n\nconst dy = Math.round((h.y + h.h + f.bottom - leftPanel.h) / 2 - leftPanel.y);\n[badCode, goodCode, badConseq, goodConseq, leftPanel, rightPanel].forEach((s) => {\n  s.y += dy; s.cy += dy;\n  s.el.style.top = px(s.y); s.el.dataset.y = s.y;\n});"},{"id":"workshop-12-cred-proxy-mcp","title":"12 · Step 3 · Egress proxy & Remote GitHub MCP","notes":"Here is how the Egress Proxy and Remote GitHub MCP work together at runtime. Inside the sandbox, pr-reviewer holds zero tokens. Outbound MCP and GitHub requests pass through the Egress Proxy, which reads gh-token from the write-only Credential Store and injects Authorization: Bearer to api.githubcopilot.com/mcp and api.github.com, while dropping unapproved hosts.","anim":true,"code":"const st = slide({ n: 12, total: 17, cls: \"flat\" });\nconst f = st.frame;\nconst h = heading(st, {\n  x: f.x, y: f.y, w: f.w,\n  text: `<span class=\"kicker\">Step 3 of 4 · Network isolation</span>Egress proxy &amp; Remote GitHub MCP`,\n});\nconst Y = 590;\nconst code = box(st, {\n  x: f.x + 32, y: Y, w: 348, size: \"lg\", icon: \"terminal\", tone: \"surface\",\n  title: \"pr-reviewer agent\", sub: \"zero tokens in os.environ\",\n});\nconst sandbox = panel(st, { around: [code], pad: 32, title: \"Sandbox\" });\nconst proxy = box(st, {\n  x: 724, y: Y, w: 336, size: \"lg\", icon: \"shield\", tone: \"purple\", strong: true,\n  title: \"Egress Proxy\", sub: \"checks allowlist & injects header\",\n});\nconst vault = box(st, {\n  x: 724, y: Y - 235, w: 336, size: \"lg\", icon: \"key\", tone: \"amber\",\n  title: \"Credential Store\", sub: \"workshop-gh-oauth (write-only)\",\n});\nconst RW = 410, RX = f.right - RW;\nconst ghMcp = box(st, {\n  x: RX, y: Y - 185, w: RW, size: \"lg\", icon: \"plug\", tone: \"teal\",\n  title: \"api.githubcopilot.com/mcp\", sub: \"Authorization: Bearer injected\",\n});\nconst ghApi = box(st, {\n  x: RX, y: Y, w: RW, size: \"lg\", icon: \"branch\", tone: \"blue\",\n  title: \"api.github.com\", sub: \"Authorization: Bearer injected\",\n});\nconst evil = box(st, {\n  x: RX, y: Y + 185, w: RW, size: \"lg\", icon: \"x\", tone: \"dashed\",\n  title: \"attacker.example\", sub: \"not on allowlist · dropped\",\n});\nconst a1 = connect(st, sandbox, proxy, { label: \"no token\" });\nconst a2 = connect(st, vault, proxy, { from: \"bottom\", to: \"top\", cls: \"dash\" });\nconst a3 = connect(st, proxy, ghMcp, { from: \"right\", to: \"left\", fromAt: 0.25, label: \"MCP\", cls: \"g\" });\nconst a4 = connect(st, proxy, ghApi, { from: \"right\", to: \"left\", fromAt: 0.5, label: \"Bearer\", cls: \"g\" });\nconst a5 = connect(st, proxy, evil, { from: \"right\", to: \"left\", fromAt: 0.75, label: \"dropped\", cls: \"dash r\" });\nconst t = scene(st, [[sandbox, code], [a1, proxy], [vault, a2], [a3, ghMcp, a4, ghApi], [a5, evil]], { step: 0.48 });\nflow(st, a1, { at: t, tone: \"green\" });\nflow(st, [a3, a4], { at: t + 0.5, tone: \"green\" });"},{"id":"workshop-13-cred-types","title":"13 · Step 3 · Three credential types in the vault","notes":"The Credentials API supports three vault types. bearer_token stores GitHub OAuth access tokens and PATs for remote MCP servers and allowlist headers. oauth2 exchanges and refreshes tokens automatically in the proxy. environment_variable hands SDKs a placeholder that swaps on the wire only for trusted_domains.","anim":false,"code":"const st = slide({ n: 13, total: 17, cls: \"flat\" });\nconst f = st.frame;\nconst h = heading(st, {\n  x: f.x, y: f.y, w: f.w,\n  text: `<span class=\"kicker\">Step 3 of 4 · Credentials API</span>Three credential types in the vault`,\n});\nconst cs = cols(f, 3, 48);\nconst kinds = [\n  [\"key\", \"blue\", \"<code>bearer_token</code>\", \"GitHub OAuth tokens &amp; remote MCP servers\", `await ai.credentials.create({\n  id: \"workshop-gh-oauth\",\n  type: \"bearer_token\",\n  token: accessToken,\n});`],\n  [\"loop\", \"purple\", \"<code>oauth2</code>\", \"Refresh token exchanged &amp; refreshed automatically\", `await ai.credentials.create({\n  id: \"github-oauth\",\n  type: \"oauth2\",\n  client_id: CLIENT_ID,\n  client_secret: CLIENT_SECRET,\n  refresh_token: REFRESH_TOKEN,\n  token_url: TOKEN_URL,\n});`],\n  [\"terminal\", \"green\", \"<code>environment_variable</code>\", \"<code>__GEMINI_CRED_&lt;id&gt;__</code> swapped for <code>trusted_domains</code>\", `await ai.credentials.create({\n  id: \"sdk-api-key\",\n  type: \"environment_variable\",\n  value: API_KEY,\n  trusted_domains: [\"api.github.com\"],\n  injection_location: \"header\",\n});`],\n];\nconst y0 = h.y + h.h + 52;\nconst heads = kinds.map(([icon, tone, title, text], i) =>\n  feature(st, { x: cs[i].x, y: y0, w: cs[i].w, size: \"sm\", icon, tone, title, text })\n);\nconst cy = Math.max(...heads.map((x) => x.y + x.h)) + 44;\nconst cards = kinds.map(([, , , , code], i) =>\n  codeCard(st, { x: cs[i].x, y: cy, w: cs[i].w, title: \"\", lang: \"ts\", size: 17.5, code })\n);\nconst maxCardH = Math.max(...cards.map((c) => c.h));\ncards.forEach((c) => { c.el.style.height = px(maxCardH); c.el.dataset.h = maxCardH; c.h = maxCardH; });"},{"id":"workshop-14-step3-build","title":"14 · Step 3 · Wire Credentials API & GitHub MCP","notes":"Copy the Step 3 prompt into your coding agent to connect GitHub OAuth, the Credentials API vault, and Remote GitHub MCP, and run a live authenticated PR review.","anim":false,"code":"// Shared interactive prompt & link copy helpers for the AIE Code Summit workshop deck,\n// inlined into live slides by scripts/gen.ts (__LIVE__).\n(function ensureWorkshopStyles() {\n  if (document.getElementById(\"workshop-live-css\")) return;\n  const style = document.createElement(\"style\");\n  style.id = \"workshop-live-css\";\n  style.textContent = `\n    .card.copy-prompt .bar {\n      height: 52px;\n      padding: 0 20px;\n    }\n    .card.copy-prompt .bar .ctitle {\n      text-align: left;\n      margin-right: 0 !important;\n      font-size: 15px;\n      font-weight: 500;\n      color: var(--muted);\n    }\n    .card.copy-prompt pre {\n      white-space: pre-wrap;\n      overflow-wrap: break-word;\n      line-height: 1.55;\n      padding: 20px 26px 22px;\n    }\n    .card.copy-prompt pre .ln {\n      padding: 2px 26px;\n      margin: 0 -26px 6px;\n    }\n    .card.copy-prompt pre .ln:last-child {\n      margin-bottom: 0;\n    }\n    .card.copy-prompt pre .ln:first-child {\n      font-weight: 600;\n      color: var(--ink);\n    }\n    .copy-prompt-btn {\n      display: inline-flex;\n      align-items: center;\n      gap: 8px;\n      padding: 7px 16px;\n      border-radius: 999px;\n      border: 0;\n      background: var(--blue-bg);\n      color: var(--blue);\n      font: 600 14.5px/1.2 var(--font);\n      cursor: pointer;\n      flex: none;\n      transition: background 0.15s ease, transform 0.1s ease;\n    }\n    .copy-prompt-btn:hover {\n      background: color-mix(in srgb, var(--blue) 18%, var(--blue-bg));\n    }\n    .copy-prompt-btn:active {\n      transform: scale(0.97);\n    }\n    .copy-prompt-btn.copied {\n      background: var(--green-bg);\n      color: var(--green);\n    }\n    .copy-prompt-btn svg {\n      width: 16px;\n      height: 16px;\n      fill: none;\n      stroke: currentColor;\n      stroke-width: 2.1;\n      stroke-linecap: round;\n      stroke-linejoin: round;\n    }\n    .photo.demo-shot .ph-pic {\n      border-radius: 20px;\n      background: #ffffff;\n      box-shadow: 0 18px 44px -24px rgba(15, 23, 42, 0.22);\n    }\n  `;\n  document.head.appendChild(style);\n})();\n\nconst COPY_ICON = '<svg viewBox=\"0 0 24 24\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/></svg>';\nconst CHECK_ICON = '<svg viewBox=\"0 0 24 24\"><polyline points=\"4 12.5 9.5 18 20 6\"/></svg>';\n\nasync function copyTextToClipboard(text) {\n  if (navigator.clipboard && navigator.clipboard.writeText) {\n    try {\n      await navigator.clipboard.writeText(text);\n      return true;\n    } catch {}\n  }\n  const ta = document.createElement(\"textarea\");\n  ta.value = text;\n  ta.style.cssText = \"position:fixed;left:-9999px;top:0;opacity:0\";\n  document.body.appendChild(ta);\n  ta.focus();\n  ta.select();\n  let ok = false;\n  try { ok = document.execCommand(\"copy\"); } catch {}\n  ta.remove();\n  return ok;\n}\n\nfunction wireCopyPrompt(cardRef, rawPrompt, label = \"Copy Prompt\") {\n  const el = cardRef?.el || document.querySelector(\".copy-prompt\");\n  if (!el) return;\n  el.classList.add(\"copy-prompt\", \"has-actions\");\n  const bar = el.querySelector(\".bar\");\n  if (!bar || bar.querySelector(\".copy-prompt-btn\")) return;\n  const textToCopy = rawPrompt || Array.from(el.querySelectorAll(\"pre .ln\")).map((n) => n.textContent).join(\"\\n\");\n  const btn = document.createElement(\"button\");\n  btn.type = \"button\";\n  btn.className = \"copy-prompt-btn\";\n  btn.innerHTML = `${COPY_ICON}<span>${label}</span>`;\n  let resetTimer = null;\n  btn.addEventListener(\"click\", async (e) => {\n    e.stopPropagation();\n    await copyTextToClipboard(textToCopy);\n    btn.classList.add(\"copied\");\n    btn.innerHTML = `${CHECK_ICON}<span>Copied!</span>`;\n    clearTimeout(resetTimer);\n    resetTimer = setTimeout(() => {\n      btn.classList.remove(\"copied\");\n      btn.innerHTML = `${COPY_ICON}<span>${label}</span>`;\n    }, 1800);\n  });\n  bar.appendChild(btn);\n}\nconst st = slide({ n: 14, total: 17, cls: \"flat\" });\nconst f = st.frame;\nconst h = heading(st, {\n  x: f.x, y: f.y, w: f.w,\n  text: `<span class=\"kicker\">Step 3 of 4 · Hands-on build</span>Wire Credentials API &amp; GitHub MCP`,\n});\n\nconst PROMPT = `Use the gemini-managed-agents skill to connect GitHub OAuth, Credentials API, and GitHub MCP:\n1. Run a local OAuth callback on port 3000 to get a GitHub token and store it as a bearer_token in the vault.\n2. Run \"pr-reviewer\" with the GitHub MCP server and network allowlist wired to that vault credential.\n3. Review an open PR on google/budoux via GitHub MCP, verify zero secrets in env, and delete the credential.`;\n\nconst pCard = codeCard(st, {\n  x: f.x, y: h.y + h.h + 48, w: f.w,\n  title: \"Prompt · Copy & paste into your coding agent\",\n  lang: \"text\", light: true, cls: \"copy-prompt\", size: 22,\n  code: PROMPT,\n});\nconst cy = Math.round((h.y + h.h + f.bottom - pCard.h) / 2);\npCard.el.style.top = px(cy); pCard.el.dataset.y = cy; pCard.y = cy;\nwireCopyPrompt(pCard, PROMPT);"},{"id":"workshop-15-ui-flow","title":"15 · Step 4 · OAuth, Vault, and UI architecture","notes":"In Step 4 we connect our agent to a multi-user web app. When a user signs in with GitHub, the Bun server exchanges the OAuth code, vaults the user's token via credentials.create, and keeps only credentialId in an HttpOnly cookie. Every POST /api/chat streams GitHub MCP steps and PR verdicts over SSE, and signing out deletes both the vault credential and the remote environment.","anim":false,"code":"const st = slide({ n: 15, total: 17, cls: \"flat\" });\nconst f = st.frame;\nconst h = heading(st, {\n  x: f.x, y: f.y, w: f.w,\n  text: `<span class=\"kicker\">Step 4 of 4 · Web architecture</span>OAuth, Vault, and UI architecture`,\n});\nsequence(st, {\n  x: f.x + 150, y: h.y + h.h + 38, gap: 433, rowGap: 68, firstGap: 48, lastGap: 32,\n  size: \"lg\", caps: false, footer: false,\n  participants: [\n    { id: \"b\", name: \"Browser\", icon: \"globe\", tone: \"blue\", w: 250 },\n    { id: \"s\", name: \"Bun Server\", icon: \"server\", tone: \"surface\", w: 250 },\n    { id: \"g\", name: \"GitHub OAuth\", icon: \"lock\", tone: \"amber\", w: 250 },\n    { id: \"m\", name: \"Gemini API\", icon: \"gemini\", tone: \"purple\", w: 250 },\n  ],\n  steps: [\n    { from: \"b\", to: \"s\", label: \"Sign in with GitHub\" },\n    { from: \"s\", to: \"g\", label: \"PKCE code exchange -> access_token\" },\n    { from: \"s\", to: \"m\", label: 'credentials.create(type=\"bearer_token\")' },\n    { from: \"s\", to: \"b\", label: \"HttpOnly cookie (credentialId only)\", kind: \"return\" },\n    { from: \"b\", to: \"s\", label: \"POST /api/chat (repo + PR prompt)\" },\n    { from: \"s\", to: \"m\", label: \"interactions.create (GitHub MCP + skill)\" },\n    { from: \"m\", to: \"b\", label: \"SSE stream: MCP steps & PR verdict\", kind: \"return\" },\n    { from: \"s\", to: \"m\", label: \"Sign out: credentials.delete + environments.delete\" },\n  ],\n});"},{"id":"workshop-16-step4-build","title":"16 · Step 4 · Connect the Web UI","notes":"Copy the Step 4 prompt into your coding agent. It will wire server/auth.ts and server/chat.ts and start the web app on localhost:3000.","anim":false,"code":"// Shared interactive prompt & link copy helpers for the AIE Code Summit workshop deck,\n// inlined into live slides by scripts/gen.ts (__LIVE__).\n(function ensureWorkshopStyles() {\n  if (document.getElementById(\"workshop-live-css\")) return;\n  const style = document.createElement(\"style\");\n  style.id = \"workshop-live-css\";\n  style.textContent = `\n    .card.copy-prompt .bar {\n      height: 52px;\n      padding: 0 20px;\n    }\n    .card.copy-prompt .bar .ctitle {\n      text-align: left;\n      margin-right: 0 !important;\n      font-size: 15px;\n      font-weight: 500;\n      color: var(--muted);\n    }\n    .card.copy-prompt pre {\n      white-space: pre-wrap;\n      overflow-wrap: break-word;\n      line-height: 1.55;\n      padding: 20px 26px 22px;\n    }\n    .card.copy-prompt pre .ln {\n      padding: 2px 26px;\n      margin: 0 -26px 6px;\n    }\n    .card.copy-prompt pre .ln:last-child {\n      margin-bottom: 0;\n    }\n    .card.copy-prompt pre .ln:first-child {\n      font-weight: 600;\n      color: var(--ink);\n    }\n    .copy-prompt-btn {\n      display: inline-flex;\n      align-items: center;\n      gap: 8px;\n      padding: 7px 16px;\n      border-radius: 999px;\n      border: 0;\n      background: var(--blue-bg);\n      color: var(--blue);\n      font: 600 14.5px/1.2 var(--font);\n      cursor: pointer;\n      flex: none;\n      transition: background 0.15s ease, transform 0.1s ease;\n    }\n    .copy-prompt-btn:hover {\n      background: color-mix(in srgb, var(--blue) 18%, var(--blue-bg));\n    }\n    .copy-prompt-btn:active {\n      transform: scale(0.97);\n    }\n    .copy-prompt-btn.copied {\n      background: var(--green-bg);\n      color: var(--green);\n    }\n    .copy-prompt-btn svg {\n      width: 16px;\n      height: 16px;\n      fill: none;\n      stroke: currentColor;\n      st (function initDeck() {
  const wrap = document.getElementById("stage-scale-wrap");
  const select = document.getElementById("slide-select");
  const ntitle = document.getElementById("ntitle");
  const nbody = document.getElementById("nbody");
  const btnNotes = document.getElementById("btn-notes");
  const btnTheme = document.getElementById("btn-theme");

  SLIDES.forEach((s, idx) => {
    const opt = document.createElement("option");
    opt.value = String(idx);
    opt.textContent = (idx + 1) + " / " + SLIDES.length + " · " + s.title;
    select.appendChild(opt);
  });

  let curTheme = new URLSearchParams(location.search).get("theme") === "dark" ? "dark" : "light";
  window.__deckTheme = curTheme;
  document.documentElement.dataset.theme = curTheme;
  btnTheme.textContent = curTheme === "dark" ? "Light" : "Dark";

  function resolveInitialIndex() {
    const rawHash = location.hash.slice(1).trim();
    if (!rawHash) return 0;
    const byId = SLIDES.findIndex((s) => s.id === rawHash);
    if (byId >= 0) return byId;
    const num = Number(rawHash);
    if (Number.isInteger(num) && num >= 1 && num <= SLIDES.length) return num - 1;
    return 0;
  }

  let curIdx = resolveInitialIndex();

  function computeScale() {
    const notesOpen = document.body.dataset.notes === "1";
    const availH = window.innerHeight - (notesOpen ? 185 : 0);
    const k = Math.min(window.innerWidth / 1920, availH / 1080);
    wrap.style.transform = "translate(-50%, -50%) scale(" + k + ")";
  }

  function renderCurrentSlide() {
    const s = SLIDES[curIdx];
    wrap.style.transform = "translate(-50%, -50%)";
    wrap.replaceChildren();
    const stageDiv = document.createElement("div");
    stageDiv.className = "stage";
    const wiresSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    wiresSvg.setAttribute("class", "wires");
    stageDiv.appendChild(wiresSvg);
    wrap.appendChild(stageDiv);

    window.__deckTheme = curTheme;
    document.documentElement.dataset.theme = curTheme;
    if (Array.isArray(window.__kitResets)) {
      for (const fn of window.__kitResets) {
        try { fn(); } catch {}
      }
    }

    try {
      new Function(s.code)();
    } catch (err) {
      console.error("Slide render error (" + s.id + "):", err);
    }

    computeScale();
    const isOnDark = stageDiv.classList.contains("ondark") || stageDiv.classList.contains("grad-hero");
    document.getElementById("deck-viewport").style.background = isOnDark ? "linear-gradient(135deg, #101528 0%, #1A1135 50%, #06241E 100%)" : "";

    select.value = String(curIdx);
    document.getElementById("slide-count").textContent = (curIdx + 1) + " / " + SLIDES.length;
    history.replaceState(null, "", "#" + s.id);
    ntitle.textContent = "Slide " + (curIdx + 1) + " / " + SLIDES.length + " · " + s.title;
    nbody.textContent = s.notes || "No speaker notes for this slide.";
    closeCommentPopover();
    renderSlidePins();
  }

  // --- Click-to-Comment System ---
  const popover = document.getElementById("cmt-popover");
  const cmtCtx = document.getElementById("cmt-ctx");
  const cmtInput = document.getElementById("cmt-input");
  const cmtSave = document.getElementById("cmt-save");
  const cmtCancel = document.getElementById("cmt-cancel");
  const cmtDelete = document.getElementById("cmt-delete");
  const btnCommentQuick = document.getElementById("btn-comment-quick");
  const hudCmtCount = document.getElementById("hud-cmt-count");
  const bannerCmtCount = document.getElementById("banner-cmt-count");
  const drawer = document.getElementById("comments-drawer");
  const cdTitle = document.getElementById("cd-title");
  const cdList = document.getElementById("cd-list");

  let comments = [];
  let activeDraft = null;
  let hoveredEl = null;

  function updateCommentCounts() {
    const total = comments.length;
    const onSlide = comments.filter((c) => c.slide_id === SLIDES[curIdx]?.id).length;
    hudCmtCount.textContent = total > 0 ? "Comment (" + (onSlide ? onSlide + "/" + total : total) + ")" : "Comment";
    bannerCmtCount.textContent = String(total);
    cdTitle.textContent = "Slide Feedback (" + total + ")";
    Array.from(select.options).forEach((opt, idx) => {
      const s = SLIDES[idx];
      const n = comments.filter((c) => c.slide_id === s.id).length;
      opt.textContent = (idx + 1) + " / " + SLIDES.length + " · " + s.title + (n ? " 💬" + n : "");
    });
    renderDrawerList();
  }

  function renderDrawerList() {
    cdList.replaceChildren();
    if (!comments.length) {
      const empty = document.createElement("div");
      empty.style.cssText = "color:#9aa0a6;font-size:13px;padding:12px 4px;";
      empty.textContent = "No comments yet. Click 💬 Comment (or press C) and click any element on a slide.";
      cdList.appendChild(empty);
      return;
    }
    comments.forEach((c) => {
      const item = document.createElement("div");
      item.className = "cd-item";
      const sl = document.createElement("div");
      sl.className = "cd-slide";
      sl.textContent = "Slide " + c.slide_num + " · " + c.slide_title.replace(/^\d+\s*·\s*/, "");
      item.appendChild(sl);
      if (c.target_text || c.target_kind) {
        const tg = document.createElement("div");
        tg.className = "cd-target";
        tg.textContent = (c.target_kind ? "[" + c.target_kind + "] " : "") + (c.target_text || "");
        item.appendChild(tg);
      }
      const tx = document.createElement("div");
      tx.className = "cd-text";
      tx.textContent = c.text;
      item.appendChild(tx);
      item.addEventListener("click", () => {
        const idx = SLIDES.findIndex((s) => s.id === c.slide_id);
        if (idx >= 0 && idx !== curIdx) go(idx);
        setTimeout(() => openCommentPopover(c), 40);
      });
      cdList.appendChild(item);
    });
  }

  function renderSlidePins() {
    const stage = wrap.querySelector(".stage");
    if (!stage) return;
    stage.querySelectorAll(".cmt-pin").forEach((el) => el.remove());
    const slideId = SLIDES[curIdx]?.id;
    const list = comments.filter((c) => c.slide_id === slideId);
    list.forEach((c, idx) => {
      const pin = document.createElement("div");
      pin.className = "cmt-pin" + (activeDraft && activeDraft.id === c.id ? " active" : "");
      pin.style.left = c.x + "px";
      pin.style.top = c.y + "px";
      pin.title = c.text;
      const sp = document.createElement("span");
      sp.textContent = String(idx + 1);
      pin.appendChild(sp);
      pin.addEventListener("click", (e) => {
        e.stopPropagation();
        e.preventDefault();
        openCommentPopover(c, e.clientX, e.clientY);
      });
      stage.appendChild(pin);
    });
    if (activeDraft && !activeDraft.id && activeDraft.slide_id === slideId) {
      const pin = document.createElement("div");
      pin.className = "cmt-pin active";
      pin.style.left = activeDraft.x + "px";
      pin.style.top = activeDraft.y + "px";
      const sp = document.createElement("span");
      sp.textContent = "+";
      pin.appendChild(sp);
      stage.appendChild(pin);
    }
    updateCommentCounts();
  }

  function stagePointToScreen(x, y) {
    const stage = wrap.querySelector(".stage");
    if (!stage) return { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    const r = stage.getBoundingClientRect();
    return {
      x: r.left + (x / 1920) * r.width,
      y: r.top + (y / 1080) * r.height,
    };
  }

  function openCommentPopover(draft, clientX, clientY) {
    activeDraft = { ...draft };
    renderSlidePins();
    const label = (draft.target_kind ? draft.target_kind + " · " : "") + (draft.target_text ? '“' + draft.target_text + '”' : "Slide " + draft.slide_num + " (" + Math.round(draft.x) + ", " + Math.round(draft.y) + ")");
    cmtCtx.textContent = label;
    cmtInput.value = draft.text || "";
    cmtDelete.style.display = draft.id ? "inline-block" : "none";
    popover.classList.add("open");

    const pt = (clientX && clientY) ? { x: clientX, y: clientY } : stagePointToScreen(draft.x, draft.y);
    const pw = 348, ph = 200;
    const left = Math.min(Math.max(16, pt.x + 18), window.innerWidth - pw - 16);
    const top = Math.min(Math.max(16, pt.y - 24), window.innerHeight - ph - 16);
    popover.style.left = left + "px";
    popover.style.top = top + "px";
    setTimeout(() => { cmtInput.focus(); cmtInput.select(); }, 20);
  }

  function closeCommentPopover() {
    activeDraft = null;
    popover.classList.remove("open");
    renderSlidePins();
  }

  const cdStatus = document.getElementById("cd-status");
  function setSyncStatus(ok, msg) {
    if (!cdStatus) return;
    cdStatus.className = "cd-status " + (ok ? "ok" : "err");
    cdStatus.textContent = msg;
  }
  function saveLocal() {
    try { localStorage.setItem("workshop_slide_comments", JSON.stringify(comments)); } catch {}
  }
  async function postComments(payload) {
    const res = await fetch("/api/workshop/comments", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (!Array.isArray(data.comments)) throw new Error("bad response");
    serverMeta = { cleared_at: data.cleared_at || "", deleted: data.deleted || [] };
    return data;
  }
  // Server is the source of truth, but a failed request never drops a comment:
  // unsynced comments stay in this browser and are pushed again on the next save or load.
  let serverMeta = { cleared_at: "", deleted: [] };
  function mergeWithServer(serverList) {
    const ids = new Set(serverList.map((c) => c.id));
    const gone = new Set(serverMeta.deleted || []);
    const cleared = serverMeta.cleared_at || "";
    const unsynced = comments.filter((c) => c && c.id && c.text && !ids.has(c.id) && !gone.has(c.id)
      && !(cleared && String(c.updated_at || c.created_at || "") <= cleared));
    return { merged: serverList.concat(unsynced), unsynced };
  }
  async function pushUnsynced(unsynced) {
    let data = null;
    for (const c of unsynced) data = await postComments({ action: "upsert", comment: c });
    return data;
  }
  async function syncCommentsApi(payload) {
    saveLocal();
    try {
      const data = await postComments(payload);
      const { merged, unsynced } = mergeWithServer(data.comments);
      comments = merged;
      if (unsynced.length) { const d2 = await pushUnsynced(unsynced); if (d2) comments = d2.comments; }
      setSyncStatus(true, "Saved · " + comments.length + " comments in " + String(data.file || "feedback.md").split("/").slice(-3).join("/"));
    } catch (err) {
      setSyncStatus(false, "Not saved to the server (" + (err && err.message || err) + "). Kept in this browser; it retries on the next save. Use Copy all as a backup.");
    }
    saveLocal();
    renderSlidePins();
  }

  async function loadInitialComments() {
    try {
      const saved = localStorage.getItem("workshop_slide_comments");
      if (saved) comments = JSON.parse(saved) || [];
    } catch {}
    try {
      const res = await fetch("/api/workshop/comments");
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!Array.isArray(data.comments)) throw new Error("bad response");
      serverMeta = { cleared_at: data.cleared_at || "", deleted: data.deleted || [] };
      const { merged, unsynced } = mergeWithServer(data.comments);
      comments = merged;
      if (unsynced.length) { const d2 = await pushUnsynced(unsynced); if (d2) comments = d2.comments; }
      setSyncStatus(true, (unsynced.length ? "Recovered " + unsynced.length + " unsaved comments · " : "") + "Saved · " + comments.length + " comments in " + String(data.file || "feedback.md").split("/").slice(-3).join("/"));
    } catch (err) {
      setSyncStatus(false, "Server not reachable (" + (err && err.message || err) + "). Comments are kept in this browser only.");
    }

    renderSlidePins();
  }

  document.getElementById("cd-copy").addEventListener("click", async (e) => {
    e.stopPropagation();
    const md = comments
      .slice()
      .sort((a, b) => (a.slide_num || 0) - (b.slide_num || 0))
      .map((c) => "- Slide " + c.slide_num + " · " + (c.slide_title || "") + (c.target_text ? " [" + c.target_kind + ": " + c.target_text + "]" : "") + "\n  " + String(c.text).replace(/\n/g, "\n  "))

    try { await navigator.clipboard.writeText(md); setSyncStatus(true, "Copied " + comments.length + " comments to the clipboard"); }
    catch { setSyncStatus(false, "Clipboard not available"); }
  });

  function describeTarget(el) {
    if (!el || el.classList?.contains("stage")) return { kind: "slide", text: "" };
    const hit = el.closest(".ln, .feature, .photo, .code-card, .callout, .stat, .card, .box, .heading, .prose, .pill, [data-kind]");
    if (!hit) return { kind: "slide", text: "" };
    const kind = hit.getAttribute("data-kind") || (hit.classList.contains("ln") ? "code-line" : (hit.className.split(" ")[0] || "element"));
    const txt = (hit.innerText || hit.textContent || "").replace(/\s+/g, " ").trim().slice(0, 110);
    return { el: hit, kind, text: txt };
  }

  function clearHoverTarget() {
    if (hoveredEl) {
      hoveredEl.classList.remove("cmt-hover-target");
      hoveredEl = null;
    }
  }

  wrap.addEventListener("mousemove", (e) => {
    if (document.body.dataset.commentMode !== "1") { clearHoverTarget(); return; }
    if (e.target.closest?.(".cmt-pin")) { clearHoverTarget(); return; }
    const { el } = describeTarget(e.target);
    if (el !== hoveredEl) {
      clearHoverTarget();
      if (el) {
        hoveredEl = el;
        hoveredEl.classList.add("cmt-hover-target");
      }
    }
  });

  wrap.addEventListener("mouseleave", clearHoverTarget);

  wrap.addEventListener("click", (e) => {
    if (e.target.closest?.(".cmt-pin")) return;
    const isCommentClick = document.body.dataset.commentMode === "1" || e.altKey;
    if (!isCommentClick) {
      if (popover.classList.contains("open")) closeCommentPopover();
      return;
    }
    e.stopPropagation();
    e.preventDefault();
    const stage = wrap.querySelector(".stage");
    if (!stage) return;
    const r = stage.getBoundingClientRect();
    const x = Math.max(20, Math.min(1900, Math.round(((e.clientX - r.left) / r.width) * 1920)));
    const y = Math.max(20, Math.min(1060, Math.round(((e.clientY - r.top) / r.height) * 1080)));
    const info = describeTarget(e.target);
    const s = SLIDES[curIdx];
    openCommentPopover({
      slide_id: s.id,
      slide_num: curIdx + 1,
      slide_title: s.title,
      x,
      y,
      target_kind: info.kind,
      target_text: info.text,
      text: "",
    }, e.clientX, e.clientY);
  }, true);

  async function saveActiveComment() {
    if (!activeDraft) return;
    const text = cmtInput.value.trim();
    if (!text) { closeCommentPopover(); return; }
    const id = activeDraft.id || ("c_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 6));
    const entry = { ...activeDraft, id, text, updated_at: new Date().toISOString(), created_at: activeDraft.created_at || new Date().toISOString() };
    const idx = comments.findIndex((c) => c.id === id);
    if (idx >= 0) comments[idx] = entry;
    else comments.push(entry);
    closeCommentPopover();
    await syncCommentsApi({ action: "upsert", comment: entry });
  }

  cmtSave.addEventListener("click", (e) => { e.stopPropagation(); saveActiveComment(); });
  cmtCancel.addEventListener("click", (e) => { e.stopPropagation(); closeCommentPopover(); });
  cmtDelete.addEventListener("click", async (e) => {
    e.stopPropagation();
    if (!activeDraft || !activeDraft.id) return;
    const id = activeDraft.id;
    comments = comments.filter((c) => c.id !== id);
    closeCommentPopover();
    await syncCommentsApi({ action: "delete", id });
  });
  cmtInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      saveActiveComment();
    } else if (e.key === "Escape") {
      e.preventDefault();
      closeCommentPopover();
    }
  });

  function toggleCommentMode(force) {
    const next = typeof force === "boolean" ? (force ? "1" : "0") : (document.body.dataset.commentMode === "1" ? "0" : "1");
    document.body.dataset.commentMode = next;
    if (next === "0") {
      clearHoverTarget();
      closeCommentPopover();
    }
  }

  btnCommentQuick.addEventListener("click", (e) => { e.stopPropagation(); toggleCommentMode(); });
  document.getElementById("btn-comment-exit").addEventListener("click", (e) => { e.stopPropagation(); toggleCommentMode(false); });
  document.getElementById("btn-comment-list").addEventListener("click", (e) => { e.stopPropagation(); drawer.classList.toggle("open"); });
  document.getElementById("btn-drawer").addEventListener("click", (e) => { e.stopPropagation(); drawer.classList.toggle("open"); });
  document.getElementById("cd-close").addEventListener("click", (e) => { e.stopPropagation(); drawer.classList.remove("open"); });

  function go(nextIdx) {
    curIdx = (nextIdx + SLIDES.length) % SLIDES.length;
    renderCurrentSlide();
  }

  function toggleNotes() {
    const next = document.body.dataset.notes === "1" ? "0" : "1";
    document.body.dataset.notes = next;
    btnNotes.classList.toggle("on", next === "1");
    computeScale();
  }

  function toggleTheme() {
    curTheme = curTheme === "dark" ? "light" : "dark";
    window.__deckTheme = curTheme;
    btnTheme.textContent = curTheme === "dark" ? "Light" : "Dark";
    renderCurrentSlide();
  }

  window.addEventListener("resize", computeScale);
  window.addEventListener("hashchange", () => {
    const next = resolveInitialIndex();
    if (next !== curIdx) go(next);
  });
  select.addEventListener("change", () => go(Number(select.value)));
  document.getElementById("btn-prev").addEventListener("click", (e) => { e.stopPropagation(); go(curIdx - 1); });
  document.getElementById("btn-next").addEventListener("click", (e) => { e.stopPropagation(); go(curIdx + 1); });
  btnNotes.addEventListener("click", (e) => { e.stopPropagation(); toggleNotes(); });
  btnTheme.addEventListener("click", (e) => { e.stopPropagation(); toggleTheme(); });
  document.getElementById("btn-fs").addEventListener("click", (e) => {
    e.stopPropagation();
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  });

  window.addEventListener("keydown", (e) => {
    const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
    if (tag === "input" || tag === "textarea" || tag === "select" || (e.target && e.target.isContentEditable)) return;
    if (["ArrowRight", " ", "PageDown", "j"].includes(e.key)) { e.preventDefault(); go(curIdx + 1); }
    else if (["ArrowLeft", "PageUp", "k"].includes(e.key)) { e.preventDefault(); go(curIdx - 1); }
    else if (e.key === "n") { e.preventDefault(); toggleNotes(); }
    else if (e.key === "t") { e.preventDefault(); toggleTheme(); }
    else if (e.key === "c") { e.preventDefault(); toggleCommentMode(); }
    else if (e.key === "Escape") {
      if (popover.classList.contains("open")) { e.preventDefault(); closeCommentPopover(); }
      else if (document.body.dataset.commentMode === "1") { e.preventDefault(); toggleCommentMode(false); }
      else if (drawer.classList.contains("open")) { e.preventDefault(); drawer.classList.remove("open"); }
    }
    else if (e.key === "Home") { e.preventDefault(); go(0); }
    else if (e.key === "End") { e.preventDefault(); go(SLIDES.length - 1); }
    else if (e.key === "f") {
      e.preventDefault();
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    }
  });

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      renderCurrentSlide();
      loadInitialComments();
    });
  } else {
    renderCurrentSlide();
    loadInitialComments();
  }
})();
</script>
</body>
</html>
