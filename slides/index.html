    return c;
  }

  // legend(st, {x, y, title, items, width}) left-aligned at x; items may contain <code>
  function legend(st, o) {
    const l = div("legend");
    l.dataset.kind = "legend";
    l.style.left = px(o.x); l.style.top = px(o.y); l.style.width = px(o.width || 420);
    l.innerHTML = `<h4>${o.title}</h4><ul>${o.items.map((i) => `<li>${i}</li>`).join("")}</ul>`;
    st.el.appendChild(l);
    return l;
  }

  // bounds(st, items): visible extent {left, top, right, bottom} of nodes,
  // boxes, chips, legends, svg groups or raw elements, in stage coordinates.
  function bounds(st, items) {
    const base = st.el.getBoundingClientRect();
    const b = { left: Infinity, top: Infinity, right: -Infinity, bottom: -Infinity };
    for (const it of items) {
      const el = it.el || it;
      const cl = el.classList || { contains: () => false };
      const leaves = cl.contains("node") ? [...el.children] : cl.contains("chips") ? [...el.querySelectorAll(".chip")] : [el];
      for (const l of leaves) {
        const r = l.getBoundingClientRect();
        if (!r.width && !r.height) continue;
        b.left = Math.min(b.left, r.left - base.left); b.top = Math.min(b.top, r.top - base.top);
        b.right = Math.max(b.right, r.right - base.left); b.bottom = Math.max(b.bottom, r.bottom - base.top);
      }
    }
    return b;
  }

  function frame(st, o) {
    let { left, top, right, bottom } = o;
    if (o.around) {
      const b = bounds(st, o.around), p = o.pad ?? 40;
      const pt = o.padTop ?? p;
      left ??= b.left - p; top ??= b.top - pt; right ??= b.right + p; bottom ??= b.bottom + p;
    }
    return { left, top, right, bottom };
  }

  // group(st, {around: [items], pad, left, top, right, bottom, tag, label, fill})
  // Dashed container drawn behind nodes. Pass `around` to size it from content
  // (+pad, default 40); explicit edges override the measured ones.
  // `tag` is a pill centred on the top border; `label` is a heading above the
  // top-left corner (use one or the other).
  function group(st, o) {
    const { left, top, right, bottom } = frame(st, o);
    const g = div("group" + (o.fill ? " fill" : "") + (o.tone ? " " + o.tone : ""));
    g.dataset.kind = "group";
    g.style.left = px(left); g.style.top = px(top); g.style.width = px(right - left); g.style.height = px(bottom - top);
    if (o.tag) g.innerHTML = `<div class="tag">${o.tag}</div>`;
    else if (o.label) g.innerHTML = `<div class="tag above">${o.label}</div>`;
    st.el.insertBefore(g, st.el.firstChild);
    g.dataset.x = left; g.dataset.y = top; g.dataset.w = right - left; g.dataset.h = bottom - top;
    return Object.assign(g, { kind: "box", x: left, y: top, w: right - left, h: bottom - top, cx: (left + right) / 2, cy: (top + bottom) / 2, el: g });
  }

  // ---------- boxes ----------
  // box(st, {x, y, w, h?, title, sub, body, kicker, icon, tone, shape, size, mono, caps, strong, align, id})
  //   tone:  surface (default) | blue green purple amber red teal pink gray | ink | dashed | ghost
  //   shape: rect (default) | pill | diamond | hex
  //   size:  sm | (default) | lg ; mono: monospaced title ; caps: uppercase mono title
  //   strong: saturated fill + white text (with a color tone)
  // (x, y) is the top-left corner. Height is measured unless given.
  function box(st, o) {
    const el = div(["box", o.tone || "surface", o.shape || "", o.size || "", o.mono ? "mono" : "", o.caps ? "caps" : "", o.strong ? "strong" : "", o.align === "left" ? "left" : "", o.cls || ""].filter(Boolean).join(" "));
    el.style.left = px(o.x); el.style.top = px(o.y); el.style.width = px(o.w);
    if (o.h) el.style.height = px(o.h);
    el.dataset.kind = "box";
    if (o.id) el.id = o.id;
    let html = "";
    if (o.kicker) html += `<div class="kicker">${o.kicker}</div>`;
    if (o.icon && !o.title) html += `<div class="icon-only">${ICONS[o.icon] || ""}</div>`;
    else if (o.title) html += `<div class="head">${o.icon ? ICONS[o.icon] || "" : ""}<div class="title">${o.title}</div></div>`;
    if (o.sub) html += `<div class="sub">${o.sub}</div>`;
    if (o.body) html += `<div class="body">${o.body}</div>`;
    el.innerHTML = html;
    st.el.appendChild(el);
    const h = o.h || el.getBoundingClientRect().height;
    if (o.shape === "diamond" || o.shape === "hex") {
      const w = o.w, s = 22;
      const points = o.shape === "diamond" ? `${w / 2},0 ${w},${h / 2} ${w / 2},${h} 0,${h / 2}` : `${s},0 ${w - s},0 ${w},${h / 2} ${w - s},${h} ${s},${h} 0,${h / 2}`;
      const svg = svgEl("svg", { class: "shape", viewBox: `0 0 ${w} ${h}` });
      svg.appendChild(svgEl("polygon", { points }));
      el.insertBefore(svg, el.firstChild);
    }
    el.dataset.x = o.x; el.dataset.y = o.y; el.dataset.w = o.w; el.dataset.h = h;
    return { el, kind: "box", x: o.x, y: o.y, w: o.w, h, cx: o.x + o.w / 2, cy: o.y + h / 2 };
  }

  // column(st, {x, y, w, gap, items:[boxOpts | null], connect: true|opts, tone, size})
  // Boxes stacked top-down, centered on x. Returns the shapes; null items leave a gap.
  function column(st, o) {
    const out = []; let y = o.y;
    for (const it of o.items) {
      if (!it) { y += (o.gap ?? 40); continue; }
      const w = it.w ?? o.w;
      const b = box(st, { tone: o.tone, size: o.size, ...it, x: o.x - w / 2, y, w });
      out.push(b); y = b.y + b.h + (it.gapAfter ?? o.gap ?? 40);
    }
    if (o.connect) for (let i = 1; i < out.length; i++) connect(st, out[i - 1], out[i], { ...(typeof o.connect === "object" ? o.connect : {}), ...(o.items.filter(Boolean)[i].edge || {}) });
    return out;
  }

  // row(st, {x, y, gap, items:[boxOpts], connect, w, tone, size}) left-to-right, top-aligned at y
  function row(st, o) {
    const out = []; let x = o.x;
    for (const it of o.items) {
      if (!it) { x += (o.gap ?? 60); continue; }
      const w = it.w ?? o.w;
      const b = box(st, { tone: o.tone, size: o.size, ...it, x, y: it.y ?? o.y, w });
      out.push(b); x = b.x + b.w + (it.gapAfter ?? o.gap ?? 60);
    }
    if (o.connect) for (let i = 1; i < out.length; i++) connect(st, out[i - 1], out[i], { ...(typeof o.connect === "object" ? o.connect : {}), ...(o.items.filter(Boolean)[i].edge || {}) });
    return out;
  }

  // panel(st, {x, y, w, h | around, pad, title, sub, tone, big, cls})
  //   tone: (default surface-2) | surface | plain | dashed | hatch | blue green red amber purple
  // A titled container behind boxes; title sits inside the top-left.
  function panel(st, o) {
    const { left, top, right, bottom } = o.around ? frame(st, { ...o, padTop: o.padTop ?? (o.pad ?? 40) + (o.title ? 30 : 0) + (o.sub ? 20 : 0) }) : { left: o.x, top: o.y, right: o.x + o.w, bottom: o.y + o.h };
    const p = div("panel " + (o.tone || "") + (o.cls ? " " + o.cls : ""));
    p.dataset.kind = "panel";
    p.style.left = px(left); p.style.top = px(top); p.style.width = px(right - left); p.style.height = px(bottom - top);
    p.innerHTML = (o.title ? `<div class="ptitle${o.big ? " big" : ""}">${o.title}</div>` : "") + (o.sub ? `<div class="psub">${o.sub}</div>` : "");
    st.el.insertBefore(p, st.el.firstChild);
    const head = stageRect(st, p);
    const inner = { x: left + 22, y: top + 18 + (o.title ? (o.big ? 34 : 24) : 0) + (o.sub ? 22 : 0) + (o.title || o.sub ? 14 : 0), right: right - 22, bottom: bottom - 18 };
    p.dataset.x = left; p.dataset.y = top; p.dataset.w = right - left; p.dataset.h = bottom - top;
    return { el: p, kind: "box", x: left, y: top, w: right - left, h: bottom - top, cx: (left + right) / 2, cy: (top + bottom) / 2, inner };
  }

  // tile(st, {x, y, w, h, title, sub, icon, tone, body})
  // A card with a header strip (title + optional sub) and a large icon (or free
  // HTML) in the body. It is a box for every other purpose: arrows stop at its
  // edge, port()/connect() work, the checker treats it as hard.
  function tile(st, o) {
    const el = div(["box", "tile", o.tone || "surface", o.cls || ""].filter(Boolean).join(" "));
    el.style.left = px(o.x); el.style.top = px(o.y); el.style.width = px(o.w ?? 220);
    if (o.h) el.style.height = px(o.h);
    el.dataset.kind = "box";
    if (o.id) el.id = o.id;
    el.innerHTML = `<div class="thead"><div class="title">${o.title}</div>${o.sub ? `<div class="sub">${o.sub}</div>` : ""}</div>` +
      `<div class="tbody"${o.bodyH ? ` style="height:${o.bodyH}px"` : ""}>${o.body ?? (o.icon ? ICONS[o.icon] || "" : "")}</div>`;
    st.el.appendChild(el);
    const w = o.w ?? 220, h = o.h || el.getBoundingClientRect().height;
    el.dataset.x = o.x; el.dataset.y = o.y; el.dataset.w = w; el.dataset.h = h;
    return { el, kind: "box", x: o.x, y: o.y, w, h, cx: o.x + w / 2, cy: o.y + h / 2 };
  }

  // hub(st, {cx, cy, center, spokes: {top, right, bottom, left}, gap, w, h, pair})
  // A centre tile with up to four satellite tiles and a pair of arrows to each:
  // solid centre→spoke and dashed spoke→centre by default. `center` and each
  // spoke are tile() options; a spoke may add `out` / `in` (arrow options, or
  // false to omit that direction). `gap` is the distance between the edges.
  // Returns { center, spokes: { top, right, bottom, left } }.
  function hub(st, o) {
    const w = o.w ?? 200, h = o.h ?? 190, gap = o.gap ?? 120;
    const center = tile(st, { w, h, ...o.center, x: o.cx - w / 2, y: o.cy - h / 2 });
    const pos = {
      top: [o.cx - w / 2, o.cy - h / 2 - gap - h], bottom: [o.cx - w / 2, o.cy + h / 2 + gap],
      left: [o.cx - w / 2 - gap - w, o.cy - h / 2], right: [o.cx + w / 2 + gap, o.cy - h / 2],
    };
    const opp = { top: "bottom", bottom: "top", left: "right", right: "left" };
    const spokes = {};
    for (const side of ["top", "right", "bottom", "left"]) {
      const s = o.spokes?.[side]; if (!s) continue;
      const { out, in: back, ...tileOpts } = s;
      const t = spokes[side] = tile(st, { w, h, ...tileOpts, x: pos[side][0], y: pos[side][1] });
      // vertical spokes split the width; horizontal spokes sit in the body, below the header strip
      const horiz = side === "left" || side === "right";
      const a = o.pair === false ? 0.5 : horiz ? 0.56 : 0.42, b = o.pair === false ? 0.5 : horiz ? 0.74 : 0.58;
      if (out !== false) connect(st, center, t, { from: side, to: opp[side], fromAt: a, toAt: a, ...(o.out || {}), ...(out || {}) });
      if (back !== false && o.pair !== false) connect(st, t, center, { from: opp[side], to: side, fromAt: b, toAt: b, cls: "dash", ...(o.in || {}), ...(back || {}) });
    }
    return { center, spokes };
  }

  // ---------- text ----------
  // title(st, {x, y, w, text, muted, sub, small, center})
  function title(st, o) {
    const t = div("dtitle" + (o.small ? " small" : "") + (o.center ? " center" : ""));
    t.dataset.kind = "text";
    t.style.left = px(o.x); t.style.top = px(o.y);
    if (o.w) t.style.width = px(o.w);
    t.innerHTML = (o.text ?? o.title ?? "") + (o.muted ? ` <span class="muted">${o.muted}</span>` : "") + (o.sub ? `<span class="sub">${o.sub}</span>` : "");
    st.el.appendChild(t);
    return Object.assign({ el: t, kind: "box" }, stageRect(st, t));
  }

  // caption(st, {x, y, w, html}) centered muted text (use for the one-line takeaway under a diagram)
  function caption(st, o) {
    const c = div("caption");
    c.dataset.kind = "text";
    c.style.left = px(o.x); c.style.top = px(o.y); c.style.width = px(o.w);
    c.innerHTML = o.html || o.text;
    st.el.appendChild(c);
    return Object.assign({ el: c, kind: "box" }, stageRect(st, c));
  }

  // anno(st, {x, y, w, html, mono, align, cls}) annotation text; target of leader()
  function anno(st, o) {
    const a = div("anno" + (o.mono ? " mono" : "") + (o.cls ? " " + o.cls : ""));
    a.dataset.kind = "anno";
    a.style.left = px(o.x); a.style.top = px(o.y); if (o.w) a.style.width = px(o.w);
    if (o.align) a.style.textAlign = o.align;
    a.innerHTML = o.html || o.text;
    st.el.appendChild(a);
    const r = stageRect(st, a);
    a.dataset.x = r.x; a.dataset.y = r.y; a.dataset.w = r.w; a.dataset.h = r.h;
    return { el: a, kind: "box", ...r, cx: r.x + r.w / 2, cy: r.y + r.h / 2 };
  }

  // leader(st, from:[x,y], to:[x,y], {cls, elbow, jogX, pin}) thin dotted line without a head, optionally with one bend (elbow: "h" | "v") and hollow anchor circle (pin: true | "start" | "end" | "both")
  function leader(st, from, to, o = {}) {
    const cls = o.cls ?? "dot thin";
    let g;
    if (o.elbow === "h") g = elbow(st, [from, [to[0], from[1]], to], { cls, arrow: false });
    else if (o.elbow === "v") g = elbow(st, [from, [from[0], to[1]], to], { cls, arrow: false });
    else if (Math.abs(from[0] - to[0]) > 0.5 && Math.abs(from[1] - to[1]) > 0.5) {
      const jx = o.jogX ?? (from[0] + to[0]) / 2;
      g = elbow(st, [from, [jx, from[1]], [jx, to[1]], to], { cls, arrow: false });
    }
    else g = arrow(st, [...from, ...to], { cls, arrow: false });
    if (o.pin === true || o.pin === "start" || o.pin === "both") {
      g.appendChild(svgEl("circle", { cx: from[0], cy: from[1], r: o.pinR ?? 4, class: "pin" }));
    }
    if (o.pin === "end" || o.pin === "both") {
      g.appendChild(svgEl("circle", { cx: to[0], cy: to[1], r: o.pinR ?? 4, class: "pin" }));
    }
    return g;
  }

  // brace(st, {x, y1, y2, side: "left"|"right" | y, x1, x2, side: "top"|"bottom", label, sub, w, tick})
  // Square bracket with optional midpoint tick (defaults to false in dmi theme, true otherwise).
  function brace(st, o) {
    const w = o.w ?? 10;
    const isDmi = document.documentElement.dataset.theme === "dmi";
    const tick = o.tick ?? !isDmi;
    const g = svgEl("g", { "data-kind": "brace", class: "brace" });
    st.svg.appendChild(g);
    if (o.side === "top" || o.side === "bottom") {
      const s = o.side === "bottom" ? 1 : -1, xm = (o.x1 + o.x2) / 2;
      const tickPath = tick ? ` M${xm} ${o.y} V${o.y + s * w}` : "";
      g.appendChild(svgEl("path", { class: "brace", d: `M${o.x1} ${o.y - s * w} V${o.y} H${o.x2} V${o.y - s * w}${tickPath}` }));
      if (o.label) {
        const ty = o.y + s * ((tick ? w : 2) + 20);
        g.appendChild(svgText({ x: xm, y: ty, "text-anchor": "middle", class: "small" }, o.label));
        if (o.sub) g.appendChild(svgEl("text", { x: xm, y: ty + 20, "text-anchor": "middle", class: "sub" }, o.sub));
      }
      return g;
    }
    const s = o.side === "right" ? 1 : -1, ym = (o.y1 + o.y2) / 2;
    const tickPath = tick ? ` M${o.x} ${ym} H${o.x + s * w}` : "";
    g.appendChild(svgEl("path", { class: "brace", d: `M${o.x - s * w} ${o.y1} H${o.x} V${o.y2} H${o.x - s * w}${tickPath}` }));
    if (o.label) {
      const tx = o.x + s * ((tick ? w : 0) + 14);
      g.appendChild(svgText({ x: tx, y: ym + (o.sub ? -2 : 5), "text-anchor": s > 0 ? "start" : "end", class: "small" }, o.label));
      if (o.sub) g.appendChild(svgEl("text", { x: tx, y: ym + 22, "text-anchor": s > 0 ? "start" : "end", class: "sub" }, o.sub));
    }
    return g;
  }

  // curve(st, a, b, opts) or curve(st, [x1,y1,x2,y2], opts)
  // Smooth cubic Bezier S-curve arrow between two shapes (or points), e.g. for
  // autoregressive token loops from output[i] back to input[i+1].
  function curve(st, a, b, o = {}) {
    let x1, y1, x2, y2, from = o.from || "right", to = o.to || "left";
    if (Array.isArray(a)) {
      [x1, y1, x2, y2] = a;
      o = b || {};
      from = o.from || "right"; to = o.to || "left";
    } else {
      const gap = o.gap ?? 5;
      [x1, y1] = port(a, from, o.fromGap ?? gap, o.fromAt ?? 0.5);
      [x2, y2] = port(b, to, o.toGap ?? gap, o.toAt ?? 0.5);
    }
    const cls = o.cls || "thin";
    const dx = x2 - x1, dy = y2 - y1;
    let cx1, cy1, cx2, cy2;
    if (o.c1 && o.c2) {
      [cx1, cy1] = o.c1; [cx2, cy2] = o.c2;
    } else if ((from === "right" || from === "left") && (to === "left" || to === "right")) {
      const s1 = from === "right" ? 1 : -1, s2 = to === "left" ? -1 : 1;
      const bow = o.bow ?? Math.max(Math.abs(dx) * 0.68, 28);
      cx1 = x1 + s1 * bow; cy1 = y1;
      cx2 = x2 + s2 * bow; cy2 = y2;
    } else {
      const s1 = from === "bottom" ? 1 : -1, s2 = to === "top" ? -1 : 1;
      const bow = o.bow ?? Math.max(Math.abs(dy) * 0.5, 36);
      cx1 = x1; cy1 = y1 + s1 * bow;
      cx2 = x2; cy2 = y2 + s2 * bow;
    }
    const g = svgEl("g", { "data-kind": "arrow", "data-x1": x1, "data-y1": y1, "data-x2": x2, "data-y2": y2, "data-label": o.label || "" });
    st.svg.appendChild(g);
    g.appendChild(svgEl("path", { d: `M${x1} ${y1} C${cx1} ${cy1} ${cx2} ${cy2} ${x2} ${y2}`, class: (cls + " line").trim() }));
    if (o.label) {
      const lx = o.lx ?? (x1 + x2) / 2, ly = o.ly ?? (y1 + y2) / 2;
      g.appendChild(svgText({ x: lx, y: ly, "text-anchor": o.anchor || "middle", class: o.labelCls || "small halo" }, o.label));
    }
    if (o.arrow !== false) arrowhead(g, cx2, cy2, x2, y2, cls);
    return g;
  }

  // arrowLegend(st, {x, y, gap, lineW, items:[{cls, label}]})
  // Inline horizontal legend of sample SVG arrows + labels (e.g. solid = chain of thought, dotted = opaque computation).
  function arrowLegend(st, o) {
    const lineW = o.lineW ?? 34, itemGap = o.gap ?? 36;
    const g = svgEl("g", { "data-kind": "legend", class: "alegend" });
    st.svg.appendChild(g);
    const entries = o.items.map((it) => {
      const t = svgEl("text", { x: 0, y: o.y + 5, class: "small" }, it.label);
      g.appendChild(t);
      const tw = t.getBBox().width;
      return { it, t, w: lineW + 10 + tw };
    });
    const totalW = entries.reduce((acc, e) => acc + e.w, 0) + itemGap * Math.max(0, entries.length - 1);
    let cx = o.align === "left" ? o.x : o.x - totalW / 2;
    for (const e of entries) {
      const cls = e.it.cls || "thin";
      const x1 = cx, x2 = cx + lineW;
      g.appendChild(svgEl("path", { d: `M${x1} ${o.y} L${x2} ${o.y}`, class: (cls + " line").trim() }));
      arrowhead(g, x1, o.y, x2, o.y, cls);
      e.t.setAttribute("x", x2 + 10);
      cx += e.w + itemGap;
    }
    return g;
  }

  // layerMesh(st, {colCenters, topY, botY, mode: "bipartite"|"serial", steps, band:{x,y,w,h,tone}, units, unitGap, r, passArrow, passPad, dir, cls})
  // Draws the internal layer structure inside a horizontal computation band and returns
  // anchor shapes `cols[i].top` and `cols[i].bottom` for connecting input/output tokens.
  function layerMesh(st, o) {
    const cols = o.colCenters || [];
    const topY = o.topY, botY = o.botY, midY = (topY + botY) / 2;
    const r = o.r ?? 5.5, units = o.units ?? 3, unitGap = o.unitGap ?? 17;
    const mode = o.mode || "bipartite";
    const steps = o.steps ?? 1;
    const cls = o.cls || "dot thin";
    const g = svgEl("g", { "data-kind": "mesh", class: "mesh" });
    st.svg.appendChild(g);

    if (o.band) {
      g.appendChild(svgEl("rect", {
        x: o.band.x ?? 1,
        y: o.band.y,
        width: o.band.w,
        height: o.band.h,
        class: "band " + (o.band.tone || "pink"),
      }));
    }

    const passYs = [];
    if (mode === "serial" && steps > 1) {
      for (let s = 1; s <= steps; s++) {
        passYs.push(topY + ((botY - topY) * s) / (steps + 1));
      }
    } else {
      passYs.push(midY);
    }

    const outCols = cols.map((cx, idx) => {
      if (mode === "bipartite") {
        const xs = Array.from({ length: units }, (_, k) => cx + (k - (units - 1) / 2) * unitGap);
        for (const xTop of xs) {
          for (const xBot of xs) {
            g.appendChild(svgEl("line", { x1: xTop, y1: topY, x2: xBot, y2: botY, class: "hair" }));
          }
        }
        for (const x of xs) {
          g.appendChild(svgEl("circle", { cx: x, cy: topY, r, class: "unit" }));
          g.appendChild(svgEl("circle", { cx: x, cy: botY, r, class: "unit" }));
        }

  // timeline(st, {x, y, w, events:[{label, sub, tone, at, group}], alternate, tickH})

// Pictograms: document stacks and tile grids for "story" diagrams (search →
// narrow → verify) where quantity and selection matter more than labels.
// Requires kit.js (div, px, ICONS, stageRect).
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const S = (tag, attrs = {}, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; };

  // one sheet of paper with a folded top-right corner, top-left at (x, y)
  function sheet(g, x, y, w, h, fold = Math.round(w * 0.28)) {
    const r = 4;
    g.appendChild(S("path", { class: "sheet", d: `M${x + r} ${y} H${x + w - fold} L${x + w} ${y + fold} V${y + h - r} Q${x + w} ${y + h} ${x + w - r} ${y + h} H${x + r} Q${x} ${y + h} ${x} ${y + h - r} V${y + r} Q${x} ${y} ${x + r} ${y} Z` }));

  function glyph(g, cx, cy, o, size = 20) {

      const ic = wrap.firstElementChild; ic.setAttribute("x", cx - size / 2); ic.setAttribute("y", cy - size / 2); ic.setAttribute("width", size); ic.setAttribute("height", size);
      g.appendChild(wrap);

      g.appendChild(S("circle", { class: "mark", cx, cy, r: size / 2 + 1 }));
      g.appendChild(S("text", { class: "mark-text", x: cx, y: cy + 0.5 }, String(o.mark)));
    }
  }

  // `n` sheets fanned up and to the right; the front sheet carries an icon or a
  // mark. `tone`: blue green amber purple gray (default: surface). `label`
  // writes a small muted caption underneath. (x, y) is the top-left of the
  // whole pictogram. Returns box geometry.

    const g = S("g", { class: o.tone || "" }); svg.appendChild(g);
    for (let k = n - 1; k >= 0; k--) sheet(g, k * off, (n - 1 - k) * off, w, h);

    if (o.label) {
      const c = div("scap"); c.textContent = o.label; el.appendChild(c); el.style.height = "";
      const cw = c.scrollWidth; if (cw > W) { el.style.width = px(cw); el.style.left = px(o.x - (cw - W) / 2); svg.style.margin = "0 auto"; }
    }
    return finish(st, el, "stack");
  }

  // tileGrid(st, {x, y, cols, rows, size = 44, gap = 10, tone, cells: { index: { mark | icon, tone } }})
  // A grid of blank rounded cells, row-major from 0. Entries in `cells` are
  // drawn as a document sheet with a mark instead of a blank cell, which reads
  // as "the few that matched". Returns geometry plus cell(i) → { x, y, w, h }
  // in stage coordinates.
  function tileGrid(st, o) {
    const size = o.size ?? 44, gap = o.gap ?? 10, cols = o.cols, rows = o.rows;
    const W = cols * size + (cols - 1) * gap, H = rows * size * 1.15 + (rows - 1) * gap;
    const el = div("tilegrid picto" + (o.tone ? " " + o.tone : "")); el.style.left = px(o.x); el.style.top = px(o.y); el.style.width = px(W); el.style.height = px(H);
    st.el.appendChild(el);
    const svg = S("svg", { width: W, height: H }); el.appendChild(svg);

    const pos = (i) => [(i % cols) * (size + gap), Math.floor(i / cols) * (ch + gap)];

    return geo;
  }

})();

    root.dataset.x = r.x; root.dataset.y = r.y; root.dataset.w = r.w; root.dataset.h = r.h;
    const rows = rowEls.map((el, i) => ({ el, ...stageRect(st, el), item: items[i] }));

      el: root, kind: "box", ...r, cx: r.x + r.w / 2, cy: r.y + r.h / 2, rows,
      header: hd ? stageRect(st, root.querySelector(".chd")) : null,
      composer: comp ? stageRect(st, comp) : null,
    };
  }

  Object.assign(window, { chatUI, trace });
})();


// === kit-slides.js ===
// Slide kit: a 16:9 shell plus the editorial components a deck needs (large
// headings, prose, bullets, stats, agendas, quotes, cards, callouts, social
// posts, polaroids, pills, buttons, modals, attachments, visualizers,
// skeletons, small illustrations, a line chart). Requires kit.js (div, px,
// stage, stageRect, ICONS). Everything is placed in stage pixels like the rest
// of the kit, so panels, boxes, connects, code cards and chat mocks combine
// freely with these.
//
// Sizes are tuned for a 1920×1080 stage (the deck's 16 px root: title 56,
// hero 99, body 32, card text 18). Use size classes (xs sm md lg xl) rather
// than inline font sizes so slides stay consistent.
(function () {
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const finish = (st, el, kind) => { el.dataset.kind = kind; const r = stageRect(st, el); el.dataset.x = r.x; el.dataset.y = r.y; el.dataset.w = r.w; el.dataset.h = r.h; return { el, kind: "box", ...r, right: r.x + r.w, bottom: r.y + r.h, cx: r.x + r.w / 2, cy: r.y + r.h / 2 }; };
  const place = (el, o) => { el.style.left = px(o.x); el.style.top = px(o.y); if (o.w) el.style.width = px(o.w); if (o.h) el.style.height = px(o.h); return el; };
  const cls = (...parts) => parts.filter(Boolean).join(" ");

  // ---------- shell ----------
  // slide({ w = 1920, h = 1080, n, total, pad = [128, 160], bg, dotgrid, cls }) → st
  // Stage with the deck's padding; st.frame is the content box {x, y, w, h,
  // right, bottom, cx, cy}. `bg`: grad-hero | grad-bleed | grad-sandbox draws a
  // dark gradient (light text on both themes); `dotgrid` adds the dotted scrim.
  // `n` / `total` print the slide number bottom right.
  function slide(o = {}) {
    const W = o.w ?? 1920, H = o.h ?? 1080;
    const st = stage(W, H);
    st.el.classList.add("slide");
    if (o.bg) st.el.classList.add(o.bg, "ondark");
    if (o.dotgrid) st.el.classList.add("dotgrid");
    if (o.cls) o.cls.split(/\s+/).filter(Boolean).forEach((c) => st.el.classList.add(c));
    const [py, pxx] = Array.isArray(o.pad) ? o.pad : [o.pad ?? 128, o.pad ?? 160];
    if (o.n != null) { const n = div("slidenum"); n.dataset.kind = "text"; n.textContent = o.total ? `${o.n} / ${o.total}` : String(o.n); st.el.appendChild(n); }
    st.W = W; st.H = H;
    st.frame = { x: pxx, y: py, w: W - 2 * pxx, h: H - 2 * py, right: W - pxx, bottom: H - py, cx: W / 2, cy: H / 2 };
    return st;
  }

  // cols(frame, n | [fr, fr, …], gap = 96) → [{ x, w, cx, right }] column boxes inside a frame
  function cols(f, n, gap = 96) {
    const frs = Array.isArray(n) ? n : Array(n).fill(1);
    const sum = frs.reduce((a, b) => a + b, 0), free = f.w - gap * (frs.length - 1);
    let x = f.x; return frs.map((fr) => { const w = (free * fr) / sum; const c = { x, w, cx: x + w / 2, right: x + w }; x += w + gap; return c; });
  }

  // ---------- inline helpers (return html) ----------
  const hl = (text, tone = "blue") => `<mark class="hl ${tone}">${text}</mark>`;
  const dot = (tone = "green", glow) => `<i class="sdot ${tone}${glow ? " glow" : ""}"></i>`;
  const grad = (text) => `<span class="grad">${text}</span>`;
  const mono = (text) => `<span class="mono">${text}</span>`;

  // ---------- text ----------
  // heading(st, { x, y, w, text, html, kicker, size = "md", weight, sub, align, cls })
  //   size: sm 44 | md 56 (slide title) | lg 72 | xl 99 (hero). "\n" breaks lines.
  //   text may contain <span class="grad"> (gradient) or <span class="accent"> (blue).
  function heading(st, o) {
    const el = place(div(cls("heading", o.size || "md", o.weight === 400 ? "light" : o.weight === 300 ? "thin" : "", o.align === "center" ? "center" : "", o.cls)), o);
    const kick = o.kicker ? `<span class="kicker">${o.kicker}</span>` : "";
    const body = String(o.html ?? o.text ?? "").replace(/\n/g, "<br>");
    el.innerHTML = kick + body + (o.sub ? `<span class="sub">${o.sub}</span>` : "");

    return finish(st, el, "heading");
  }

  // prose(st, { x, y, w, html | text | paras: [...], size = "md", muted, align, mono, cls })
  //   size: xs 17 | sm 20 | ms 26 (code annotations) | md 32 (slide body) | lg 40 | xl 48. Paragraphs: pass
  //   `paras` (array) or html with <p>. Inline: hl(), dot(), <code>, <b>.
  function prose(st, o) {

    el.innerHTML = o.paras ? o.paras.map((p) => `<p>${p}</p>`).join("") : (o.html ?? esc(o.text ?? ""));

  }

  // bullets(st, { x, y, w, items, size = "md", marker = "arrow" | "dot" | "num", tone })
  function bullets(st, o) {
    const el = place(document.createElement("ul"), o);
    el.className = cls("bullets", o.size || "md", o.marker || "arrow", o.tone);
    el.innerHTML = o.items.map((i) => `<li>${i}</li>`).join("");
    st.el.appendChild(el);
    return finish(st, el, "bullets");
  }

  // stat(st, { x, y, w, value, label, grad = true, tone, size = "lg", cls })  big number + label
  function stat(st, o) {
    const el = place(div(cls("stat", o.size || "lg", o.grad !== false ? "gradval" : "", o.tone, o.cls)), o);
    el.innerHTML = `<div class="value">${o.value}</div>${o.label ? `<div class="label">${String(o.label).replace(/\n/g, "<br>")}</div>` : ""}`;

  function agenda(st, o) {

  function quote(st, o) {
    const el = place(div(cls("quote", o.size, o.cls)), o);
    el.innerHTML = `<p>${o.html ?? esc(o.text ?? "")}</p>${o.cite ? `<span class="cite">${o.cite}</span>` : ""}`;

  // ---------- cards ----------
  // card(st, { x, y, w, h, kicker, pill, icon, iconTone, title, text, html, foot, link,
  //            tone, layout = "col" | "row", accent, raised, outline, size, cls })
  //   tone: (default surface-2) | surface | high | blue green purple amber (tinted)
  //   accent: blue green purple → 4 px bar on top ; raised → shadow ; outline: blue → tinted border
  //   pill: text badge above the title ; icon: ICONS key in a rounded square (iconTone)
  //   layout "row": icon badge left, title + text right (compact feature card)
  function card(st, o) {
    const el = place(div(cls("scard", o.tone, o.layout === "row" ? "row" : "", o.accent ? "accent accent-" + o.accent : "", o.raised ? "raised" : "", o.outline ? "outline-" + o.outline : "", o.size, o.cls)), o);

    const head = badge || kick ? `<div class="khead">${badge}${kick}</div>` : "";
    const main = `${o.pill ? `<span class="cpill ${it}">${o.pill}</span>` : ""}${o.title ? `<div class="ttl">${o.title}</div>` : ""}${o.text ? `<div class="txt">${o.text}</div>` : ""}${o.html || ""}`;
    const tail = `${o.foot ? `<div class="foot ${it}">${o.foot}</div>` : ""}${o.link ? `<div class="link">${o.link} <span>→</span></div>` : ""}`;

// Product app mocks: an authentic Slack desktop workspace (slackUI) and a
// Google Sheets window (sheetUI). Unlike chatUI these are branded on purpose:
// they reproduce the real product chrome with the --slack-* / --sheet-* tokens
// from kit.css (light and dark). Also an unbranded dev-tool trigger & webhook
// console (consoleUI, --con-* tokens) and a floating connection indicator
// (statusDock) that reads over any of them. Requires kit.js (div, px, ICONS, stageRect).
//
// Both are laid out at 1:1 product density (Slack 15 px body, Sheets 13 px
// cells) and scaled with CSS zoom: `scale` defaults to 1.35 when w >= 1600
// (a full 1920 slide read on a projector) and 1 otherwise. Geometry and
// handles are in stage pixels either way.
//
//   slackUI(st, {
//     x, y, w, h, scale, bleed,          // bleed: no radius/shadow (auto when the mock fills the stage width at 0,0)
//     workspace: "Acme Capital", initials: "AC", search: "Search Acme Capital",
//     chrome: true, sidebar: true,      // false hides the top bar + rail / the channel sidebar
//     channels: [{ name, unread: true | n, active, muted, private }],
//     dms: [{ name, app, presence: "online" | "away", active, avatar, tone, icon }],
//     channel: { name, topic, members, private },
//     messages: [ msg | { divider: "Today" } ],
//     thread: { open, channel, parent: msg | id, replies: [msg], composer: "Reply…", typing },
//     composer: "Message #…" | { placeholder, text }, typing: "Buck",
//   })
//   msg = { id, author, app, avatar, icon, tone, time, cont, html | text,
//           attachment: { tone, pretext, title, text, fields: [{ k, v, wide }], buttons: [{ text, primary, danger }], footer },
//           buttons, reactions: [{ emoji, n, me }], replies: { n, last, avatars: [name | { author, tone, avatar }] } }
//   html: <b> <code> <a> <pre> <ul> allowed; "@name", "@here" and "#channel" become Slack mention chips.
//
//   Returns box geometry plus msg(id) → rect, messages[i] = { el, x, y, w, h, item },
//   feed / thread / composer / sidebar rects, and runtime handles:
//   addMessage(msg, { to: "feed" | "thread" }) → el, updateMessage(id, patch) → el,
//   setTyping(name | null, { to }), openThread(parent, replies), closeThread(),
//   addReaction(id, emoji), feedInput / threadInput (contenteditable elements).
//
//   sheetUI(st, {

    const setBusy = (busy) => { root.classList.toggle("busy", !!busy); Object.values(actions).forEach((b) => { b.disabled = !!busy; }); };

    const setTrigger = (t) => {
      if (!tbody) return;
      if (!t) { tbody.innerHTML = `<div class="cn-empty">${esc(o.emptyTrigger ?? "Click a trigger button above to run Buck…")}</div>`; return; }
      const [lab, tone] = TRIG[t.kind] || [String(t.kind || "event").toUpperCase(), "gray"];
      const promptHtml = t.prompt ? `<div class="cn-tprompt"><span class="cn-tplbl">PROMPT</span><span class="cn-tptxt">${inlineCode(t.prompt)}</span></div>` : "";
      tbody.innerHTML = `<div class="cn-trow"><span class="cn-kb cn-c-${tone}">${esc(lab)}</span><div class="cn-tmain"><div class="cn-tt">${esc(t.title)}</div>${t.detail ? `<div class="cn-td">${esc(t.detail)}</div>` : ""}</div>${t.time ? `<span class="cn-time">${esc(t.time)}</span>` : ""}</div>${promptHtml}`;
    };
    const setInteraction = (i) => {
      if (!i) { iline.innerHTML = `<div class="cn-empty">No run yet</div>`; return; }
      const s = i.status || "running";
      const tone = s === "completed" ? "green" : s === "failed" ? "red" : s === "running" ? "blue" : "gray";
      const idLbl = i.label ?? "interaction";
      iline.innerHTML = `<span class="cn-ids"><span class="cn-m">${esc(idLbl)}</span> <b title="${esc(i.id)}">${esc(short(i.id, i.shortLen ?? 12))}</b>${i.environment_id ? ` <span class="cn-m">· ${esc(i.envLabel ?? "env")}</span> <b title="${esc(i.environment_id)}">${esc(short(i.environment_id, i.envShortLen ?? 8))}</b>` : ""}</span><span class="cn-pill cn-c-${tone}${s === "running" ? " running" : ""}"><i></i>${esc(s)}</span>`;
    };
    const setMetrics = (list) => {
      if (!metricsEl) return;
      if (!list || !list.length) { metricsEl.innerHTML = ""; return; }
      metricsEl.innerHTML = list.map((m) => `<div class="cn-met${m.tone ? ` cn-c-${esc(m.tone)}` : ""}"><span class="cn-mlbl">${esc(m.label)}</span><b class="cn-mval">${esc(m.value)}</b></div>`).join("");
    };

    const emptyLog = () => { if (!logIn.querySelector(".cn-row")) logIn.innerHTML = `<div class="cn-empty">Steps stream in here once a run starts…</div>`; };
    function addStep(s = {}) {
      logIn.querySelector(".cn-empty")?.remove();
      const [lab, tone] = KIND[s.kind] || [String(s.kind || "step").replace(/_/g, " "), "gray"];
      const el = div(`cn-row${s.is_error ? " err" : ""}`);
      el.dataset.kind = s.kind || "";
      el.innerHTML = `<span class="cn-k cn-c-${s.is_error ? "red" : tone}">${esc(lab)}</span><div class="cn-rmain">${s.name ? `<div class="cn-rhead"><span class="cn-rn">${esc(s.name)}</span></div>` : ""}${s.text != null ? `<div class="cn-rt${MONO_KINDS.has(s.kind) ? " mono" : ""}">${inlineCode(s.text)}</div>` : ""}</div>`;
      logIn.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }
    const clearSteps = () => { logIn.innerHTML = ""; emptyLog(); };

    const setWebhook = (wh) => {
      if (!hbody) return;
      if (!wh) { hbody.innerHTML = `<div class="cn-empty">No webhook delivered yet</div>`; return; }
      const v = wh.verified === true ? '<span class="cn-ver cn-c-green">✓ signature verified</span>' : wh.verified === false ? '<span class="cn-ver cn-c-red">✗ invalid</span>' : '<span class="cn-ver cn-c-gray">pending</span>';
      const hdrs = Object.entries(wh.headers || {}).map(([k, val]) => `<div class="cn-hr"><span class="cn-hk">${esc(k)}:</span><span class="cn-hv">${esc(val)}</span></div>`).join("");
      hbody.innerHTML = `<div class="cn-wurl"><span class="cn-dir">${wh.direction === "in" ? "IN" : "POST"}</span><span class="cn-url">${esc(wh.url)}</span>${v}</div>${hdrs ? `<div class="cn-hdrs">${hdrs}</div>` : ""}${wh.body != null ? `<pre class="cn-json">${jsonHTML(wh.body)}</pre>` : ""}`;
    };

    function reset() { setBusy(false); setTrigger(null); setInteraction(null); if (o.metrics) setMetrics(o.metrics); clearSteps(); setWebhook(null); }

    setStatus([]); setStatus(o.status || []);
    setTrigger(o.trigger || null); setInteraction(o.interaction || null);
    if (showMetrics) setMetrics(o.metrics || []);
    (o.steps || []).forEach(addStep); emptyLog();
    setWebhook(o.webhook || null);

    st.el.appendChild(root);
    log.scrollTop = log.scrollHeight;
    const r = finish(st, root);
    return {
      el: root, kind: "box", ...r, cx: r.x + r.w / 2, cy: r.y + r.h / 2, scale: sh.s,
      log: stageRect(st, log), webhookRect: hbody ? stageRect(st, $(".cn-hook")) : null,
      actions, setStatus, setBusy, onAction, setTrigger, setInteraction, setMetrics, addStep, clearSteps, setWebhook, reset,
    };
  }

  //   statusDock(st, { x, y, items: [{ id, label, state, detail }], align: "right" | "left", scale })
  //   align "right": x is the dock's right edge (it grows leftward); "left": x is its left edge.
  //   Returns geometry plus set(arrayOrMap) (same merge rules as consoleUI.setStatus).
  function statusDock(st, o = {}) {
    const root = div("statusdock" + (o.align === "left" ? "" : " right"));
    root.dataset.kind = "statusdock";
    const inner = div("cn-dockin");
    if (o.scale && o.scale !== 1) inner.style.zoom = o.scale;
    root.appendChild(inner);
    st.el.appendChild(root);
    let items = [];
    const place = () => {
      root.style.top = px(o.y ?? 0);
      root.style.left = px(o.align === "left" ? o.x ?? 0 : (o.x ?? st.el.offsetWidth) - root.offsetWidth);
      const r = stageRect(st, root); root.dataset.x = r.x; root.dataset.y = r.y; root.dataset.w = r.w; root.dataset.h = r.h;
      return r;
    };
    const set = (next) => { items = mergeStatus(items, next); inner.innerHTML = items.map(chipHTML).join(""); return Object.assign(api, place()); };
    const api = { el: root, kind: "box", set };
    set(o.items || []);
    api.cx = api.x + api.w / 2; api.cy = api.y + api.h / 2;
    return api;
  }

  // ======================================================================
  // Terminal UI (live interactive CLI runner + full transcript)
  // ======================================================================
  function terminalUI(st, o = {}) {
    const sh = shell(st, { ...o, scale: o.scale ?? 1.12 }, "terminalui", 960, 720);
    const { root, app } = sh;
    const $ = (sel) => app.querySelector(sel);

    const presets = (o.presets || []).map((p) => ({ ...p }));
    let activePresetId = presets.find((p) => p.active)?.id || presets[0]?.id || "";
    let busy = false;
    const runHandlers = [];
    const resetHandlers = [];
    const accelHandlers = [];

    const presetsHTML = presets.length
      ? `<div class="tui-presets">${presets.map((p) => `<button type="button" class="tui-preset${p.id === activePresetId ? " on" : ""}" data-preset="${esc(p.id)}"><span class="tui-plbl">${esc(p.label)}</span>${p.sub ? `<small>${esc(p.sub)}</small>` : ""}</button>`).join("")}<div class="tui-spacer"></div>${o.accelerate ? `<button type="button" class="tui-act tui-accel" title="${esc(o.accelerate.title || "Show the final result of every lane now")}">${esc(o.accelerate.label || "Accelerate")}</button>` : ""}<button type="button" class="tui-act tui-reset" title="Reset workspace">Reset</button></div>`
      : "";

    app.innerHTML =
      `<div class="tui-bar"><div class="tui-dots"><i></i><i></i><i></i></div><div class="tui-title">${esc(o.title || "terminal")}</div><div class="tui-status"></div></div>` +
      presetsHTML +
      `<div class="tui-cmdbar"><span class="tui-ps1">$</span><textarea class="tui-input" rows="1" spellcheck="false" aria-label="Terminal command">${esc(o.command || "")}</textarea><button type="button" class="tui-run">▶ Run</button></div>` +
      `<div class="tui-log"><div class="tui-login"></div></div>`;

    const statusEl = $(".tui-status");
    const cmdInput = $(".tui-input");
    const runBtn = $(".tui-run");
    const resetBtn = $(".tui-reset");
    const accelBtn = $(".tui-accel");
    const log = $(".tui-log");
    const logIn = $(".tui-login");

    function setStatus(s = {}) {
      if (!s || !s.label) { statusEl.innerHTML = ""; return; }
      const state = s.state || "live";
      statusEl.innerHTML = `<span class="tui-badge ${esc(state)}"><i></i>${esc(s.label)}</span>`;
    }

    function setActivePreset(id) {
      activePresetId = id;
      app.querySelectorAll(".tui-preset").forEach((b) => {
        b.classList.toggle("on", b.dataset.preset === id);
      });
      const hit = presets.find((p) => p.id === id);
      if (hit && hit.command) { cmdInput.value = hit.command; fitInput(); }
    }

    // The command wraps instead of scrolling sideways: the textarea grows to its content (CSS caps it).
    function fitInput() {
      cmdInput.style.height = "auto";
      cmdInput.style.height = `${cmdInput.scrollHeight}px`;
    }

    function setBusy(on) {
      busy = !!on;
      runBtn.disabled = busy;
      runBtn.textContent = busy ? "Running…" : "▶ Run";
      cmdInput.readOnly = busy;
      app.querySelectorAll(".tui-preset").forEach((b) => { b.disabled = busy; });
      if (resetBtn) resetBtn.disabled = false;
      if (accelBtn) accelBtn.disabled = false;
    }

    function formatOutLine(raw) {
      return String(raw ?? "").split("\n").map((ln) => {
        const e = esc(ln);
        if (/^\+\+\+|^---/.test(ln)) return `<span class="tui-dim">${e}</span>`;
        if (/^\+/.test(ln)) return `<span class="tui-add">${e}</span>`;
        if (/^-/.test(ln)) return `<span class="tui-del">${e}</span>`;
        if (/✓|PASS\b|\b0 fail\b/i.test(ln)) return `<span class="tui-ok">${e}</span>`;
        if (/✗|FAIL\b|AssertionError|Expected:|Received:/i.test(ln)) return `<span class="tui-bad">${e}</span>`;
        return e;
      }).join("\n");
    }

    function addLine(item = {}) {
      const kind = item.kind || "out";
      const row = div(`tui-line tui-${kind}`);
      const text = String(item.text ?? "");
      if (kind === "prompt") {
        row.innerHTML = `<span class="tui-ps">$</span><span class="tui-txt">${esc(text)}</span>`;
      } else if (kind === "thought") {
        row.innerHTML = `<span class="tui-tag">⟳</span><span class="tui-txt">${esc(text)}</span>`;
      } else if (kind === "cmd") {
        const lbl = item.label ? `<span class="tui-kbadge">${esc(item.label)}</span>` : `<span class="tui-ps">$</span>`;
        row.innerHTML = `${lbl}<pre class="tui-pre">${esc(text)}</pre>`;
      } else if (kind === "tool") {
        row.innerHTML = `<span class="tui-tbadge">${esc(item.label || "tool")}</span><span class="tui-txt">${esc(text)}</span>`;
      } else if (kind === "turn") {
        row.innerHTML = `<span class="tui-turn-line">${esc(text)}</span>`;
      } else if (kind === "answer") {
        row.innerHTML = `<span class="tui-ans-ic">✓</span><div class="tui-txt">${esc(text)}</div>`;
      } else if (kind === "err") {
        row.innerHTML = `<span class="tui-err-ic">✗</span><pre class="tui-pre">${esc(text)}</pre>`;
      } else {
        row.innerHTML = `<pre class="tui-pre">${formatOutLine(text)}</pre>`;
      }
      logIn.appendChild(row);
      log.scrollTop = log.scrollHeight;
      return row;
    }

    function clearLines() { logIn.innerHTML = ""; }
    function setCommand(c) { cmdInput.value = String(c ?? ""); fitInput(); }
    function getCommand() { return cmdInput.value; }

    function fireRun(presetOverride) {
      if (busy) return;
      const pid = presetOverride || activePresetId;
      const cmd = cmdInput.value.trim();
      runHandlers.forEach((fn) => fn({ presetId: pid, command: cmd }));
    }

    app.querySelectorAll(".tui-preset").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const pid = btn.dataset.preset || "";
        setActivePreset(pid);
        fireRun(pid);
      });
    });

    runBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      fireRun();
    });

    cmdInput.addEventListener("input", fitInput);
    cmdInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        e.stopPropagation();
        fireRun();
      }
    });

    if (resetBtn) {
      resetBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        resetHandlers.forEach((fn) => fn());
      });
    }
    if (accelBtn) {
      accelBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        accelHandlers.forEach((fn) => fn({ presetId: activePresetId }));
      });
    }

    setStatus(o.status || null);
    (o.lines || []).forEach(addLine);

    st.el.appendChild(root);
    fitInput();
    log.scrollTop = log.scrollHeight;
    const r = finish(st, root);
    return {
      el: root, kind: "box", ...r, cx: r.x + r.w / 2, cy: r.y + r.h / 2, scale: sh.s,
      addLine, clearLines, setCommand, getCommand, setActivePreset, setBusy, setStatus,
      onRun: (fn) => runHandlers.push(fn),
      onReset: (fn) => resetHandlers.push(fn),
      onAccelerate: (fn) => accelHandlers.push(fn),
      getActivePreset: () => activePresetId,
    };
  }

  // ======================================================================
  // Workspace UI (live repo file explorer + diff viewer + run telemetry)
  // ======================================================================
  function workspaceUI(st, o = {}) {
    if (o.view === "trajectory") return trajectoryWorkspace(st, o);
    const sh = shell(st, { ...o, scale: o.scale ?? 1.12 }, "workspaceui", 840, 720);
    const { root, app } = sh;
    const $ = (sel) => app.querySelector(sel);

    let files = (o.files || []).map((f) => ({ ...f }));
    let diffText = String(o.diff || "");
    let activeTab = o.activeFile || files[0]?.path || (diffText ? "__diff__" : "");
    let runs = (o.runs || []).map((r) => ({ ...r }));

    app.innerHTML =
      `<div class="wui-head"><div class="wui-path"><span class="wui-folder">${P.folder}</span><span class="wui-root">${esc(o.root || "workspace/")}</span></div><div class="wui-badge"></div></div>` +
      `<div class="wui-tabs"></div>` +
      `<div class="wui-viewer"><pre class="wui-code"></pre></div>` +
      `<div class="wui-foot"><div class="wui-foot-hd">Run comparison</div><div class="wui-runs"></div></div>`;

    const badgeEl = $(".wui-badge");
    const tabsEl = $(".wui-tabs");
    const codeEl = $(".wui-code");
    const viewerEl = $(".wui-viewer");
    const runsEl = $(".wui-runs");
    const footEl = $(".wui-foot");

    function setBadge(b) {
      if (!b || !b.label) { badgeEl.innerHTML = ""; return; }
      badgeEl.innerHTML = `<span class="wui-pill ${esc(b.tone || "gray")}">${esc(b.label)}</span>`;
    }

    function renderCodeContent(txt, isDiff) {
      const lines = String(txt ?? "").replace(/\n$/, "").split("\n");
      return lines.map((ln, idx) => {
        const e = esc(ln);
        if (isDiff) {
          if (/^diff --git|^index |^--- |^\+\+\+ /.test(ln)) return `<div class="wui-ln wui-meta">${e}</div>`;
          if (/^@@ /.test(ln)) return `<div class="wui-ln wui-hunk">${e}</div>`;
          if (/^\+/.test(ln)) return `<div class="wui-ln wui-add">${e}</div>`;
          if (/^-/.test(ln)) return `<div class="wui-ln wui-del">${e}</div>`;
          return `<div class="wui-ln">${e}</div>`;
        }
        return `<div class="wui-ln"><span class="wui-lnum">${idx + 1}</span><span>${e}</span></div>`;
      }).join("");
    }

    function renderTabsAndView() {
      const tabItems = files.map((f) => {
        const stCls = f.state === "modified" ? " mod" : f.state === "read" ? " rd" : "";
        const dot = f.state === "modified" ? `<i class="mod">M</i>` : f.state === "read" ? `<i class="rd">R</i>` : "";
        return `<button type="button" class="wui-tab${activeTab === f.path ? " on" : ""}${stCls}" data-path="${esc(f.path)}">${esc(f.path)}${dot}</button>`;
      });
      if (diffText.trim()) {
        tabItems.unshift(`<button type="button" class="wui-tab diff${activeTab === "__diff__" ? " on" : ""}" data-path="__diff__">git diff<i>Δ</i></button>`);
      }
      tabsEl.innerHTML = tabItems.join("");
      tabsEl.querySelectorAll(".wui-tab").forEach((b) => {
        b.addEventListener("click", (e) => {
          e.stopPropagation();
          activeTab = b.dataset.path || "";
          renderTabsAndView();
        });
      });

      if (activeTab === "__diff__" && diffText.trim()) {
        codeEl.innerHTML = renderCodeContent(diffText, true);
      } else {
        const hit = files.find((f) => f.path === activeTab) || files[0];
        if (hit) {
          activeTab = hit.path;
          codeEl.innerHTML = renderCodeContent(hit.content || "", false);
        } else {
          codeEl.innerHTML = `<div class="wui-ln wui-meta">No file selected</div>`;
        }
      }
    }

    function setFiles(nextFiles, opts = {}) {
      files = (nextFiles || []).map((f) => ({ ...f }));
      if (opts.diff !== undefined) diffText = String(opts.diff || "");
      if (opts.activeFile) activeTab = opts.activeFile;
      else if (opts.preferDiff && diffText.trim()) activeTab = "__diff__";
      else if (!files.some((f) => f.path === activeTab) && activeTab !== "__diff__") activeTab = files[0]?.path || "";
      renderTabsAndView();
      if (opts.flash) {
        viewerEl.classList.remove("flash");
        void viewerEl.offsetWidth;
        viewerEl.classList.add("flash");
      }
    }

    function markFile(filePath, state = "read", newContent) {
      const clean = String(filePath || "").replace(/^\.\//, "");
      const hit = files.find((f) => f.path === clean || clean.endsWith("/" + f.path));
      if (hit) {
        if (state === "modified" || hit.state !== "modified") hit.state = state;
        if (typeof newContent === "string") hit.content = newContent;
        activeTab = hit.path;
        renderTabsAndView();
      }
    }

    function setDiff(nextDiff, selectDiff = true) {
      diffText = String(nextDiff || "");
      if (selectDiff && diffText.trim()) activeTab = "__diff__";
      renderTabsAndView();
    }

    function setRuns(nextRuns) {
      runs = (nextRuns || []).map((r) => ({ ...r }));
      footEl.style.display = runs.length ? "flex" : "none";
      runsEl.innerHTML = runs.map((r) => {
        const tone = r.tone || "gray";
        return `<div class="wui-run${r.active ? " active" : ""}"><div class="wui-rlbl"><span class="wui-rdot ${esc(tone)}"></span><b>${esc(r.label)}</b></div><div class="wui-rmets"><span><em>calls</em> ${esc(r.calls ?? "—")}</span><span><em>chain</em> ${esc(r.subcmds ?? "—")}</span><span><em>tokens</em> ${esc(r.tokens ?? "—")}</span><span class="wui-rstat ${esc(tone)}">${esc(r.status ?? "idle")}</span></div></div>`;
      }).join("");
    }

    setBadge(o.badge || null);
    renderTabsAndView();
    setRuns(runs);

    st.el.appendChild(root);
    const r = finish(st, root);
    return {
      el: root, kind: "box", ...r, cx: r.x + r.w / 2, cy: r.y + r.h / 2, scale: sh.s,
      setBadge, setFiles, markFile, setDiff, setRuns,
    };
  }

  // workspaceUI({ view: "trajectory" }): the run-centric variant. Three stacked sections instead of
  // file tabs: lanes compared side by side (calls, tokens, time as bars scaled to the largest real
  // value), the trajectory of the active lane (one row per model call: tools used, a short summary,
  // tokens so far) and a short diff (changed lines only, no context). Same API as workspaceUI plus
  // addStep(step), clearSteps(), setTrajectoryTitle(text); sections: ["compare", "steps", "diff"]
  // picks which parts to show (default all). runs: [{ id, label, tone, status,
  // callsN, toolsN, tokensN, active }]; step: { n, tools: [{ name, text }], tokens, ms }.
  function trajectoryWorkspace(st, o) {
    const sh = shell(st, { ...o, scale: o.scale ?? 1.12 }, "workspaceui", 840, 720);
    const { root, app } = sh;
    app.classList.add("traj");
    const $ = (sel) => app.querySelector(sel);
    let runs = (o.runs || []).map((r) => ({ ...r }));
    let steps = [];
    let diffText = String(o.diff || "");
    let files = (o.files || []).map((f) => ({ ...f }));

    app.innerHTML =
      `<div class="wui-head"><div class="wui-path"><span class="wui-folder">${P.folder}</span><span class="wui-root">${esc(o.root || "workspace/")}</span></div><div class="wui-badge"></div></div>` +
      `<div class="wui-sec" data-sec="compare"><div class="wui-sec-hd"><span>${esc(o.compareTitle || "Lanes · same prompt")}</span></div><div class="wui-cmp"></div></div>` +
      `<div class="wui-sec grow" data-sec="steps"><div class="wui-sec-hd"><span class="wui-traj-title">${esc(o.trajectoryTitle || "Trajectory")}</span><span class="wui-traj-meta"></span></div><div class="wui-steps"></div></div>` +
      `<div class="wui-sec" data-sec="diff"><div class="wui-sec-hd"><span>${esc(o.diffTitle || "git diff · changed lines")}</span></div><div class="wui-mini"></div></div>`;
    // sections: which of "compare", "steps", "diff" to show (default all three).
    if (Array.isArray(o.sections)) app.querySelectorAll("[data-sec]").forEach((el) => { if (!o.sections.includes(el.dataset.sec)) el.style.display = "none"; });

    const badgeEl = $(".wui-badge"), cmpEl = $(".wui-cmp"), stepsEl = $(".wui-steps"), miniEl = $(".wui-mini");
    const titleEl = $(".wui-traj-title"), metaEl = $(".wui-traj-meta");
    const fmtTok = (n) => (n >= 1e6 ? `${(n / 1e6).toFixed(2)}M` : n >= 1000 ? `${(n / 1000).toFixed(1)}k` : String(n));

    function setBadge(b) {
      badgeEl.innerHTML = b && b.label ? `<span class="wui-pill ${esc(b.tone || "gray")}">${esc(b.label)}</span>` : "";
    }

    function setRuns(next) {
      runs = (next || []).map((r) => ({ ...r }));
      const max = (k) => Math.max(0, ...runs.map((r) => (typeof r[k] === "number" ? r[k] : 0)));
      const mx = { callsN: max("callsN"), toolsN: max("toolsN"), tokensN: max("tokensN") };
      const cell = (r, k, fmt) => {
        const v = r[k];
        if (typeof v !== "number") return `<div class="wui-met"><b>—</b><i></i></div>`;
        const pct = mx[k] > 0 ? Math.max(3, Math.round((v / mx[k]) * 100)) : 0;
        return `<div class="wui-met"><b>${esc(fmt(v))}</b><i><span class="wui-bar ${esc(r.tone || "gray")}" style="width:${pct}%"></span></i></div>`;
      };
      cmpEl.innerHTML =
        `<div class="wui-cmp-row hd"><span></span><span>model calls</span><span>tool calls</span><span>tokens</span><span></span></div>` +
        runs.map((r) =>
          `<div class="wui-cmp-row${r.active ? " active" : ""}" data-id="${esc(r.id || "")}"><span class="wui-rlbl"><span class="wui-rdot ${esc(r.tone || "gray")}"></span><b>${esc(r.label)}</b></span>` +
          cell(r, "callsN", String) + cell(r, "toolsN", String) + cell(r, "tokensN", fmtTok) +
          `<span class="wui-rstat ${esc(r.tone || "gray")}">${esc(r.status ?? "")}</span></div>`).join("") +
        compareNote();
    }

    // compareNote: true compares the finished lane with the fewest tokens to the first lane.
    // compareNote: { pairs: [[baseId, otherId, "label"], …], what: "bash" } writes one clause per pair
    // ("bash: 4.1× fewer tokens, 2.0× fewer model calls on 3.5 Flash"), each once both lanes finished.
    function compareNote() {
      if (!o.compareNote) return "";
      const done = (r) => typeof r.tokensN === "number" && r.tokensN > 0 && !/running/.test(String(r.status || ""));
      if (o.compareNote.pairs) {
        const by = (id) => runs.find((r) => r.id === id);
        const x = (a, b) => (a > 0 && b > 0 ? (a / b >= 1 ? `${(a / b).toFixed(1)}× fewer` : `${(b / a).toFixed(1)}× more`) : null);
        const parts = o.compareNote.pairs.map(([a, b, label]) => {
          const A = by(a), B = by(b);
          if (!A || !B || !done(A) || !done(B)) return null;
          return `<b>${esc(x(A.tokensN, B.tokensN))} tokens</b>, ${esc(x(A.callsN, B.callsN) || "—")} model calls on ${esc(label)}`;
        }).filter(Boolean);
        return parts.length ? `<div class="wui-cmp-note">${esc(o.compareNote.what || "bash")}: ${parts.join(" · ")}</div>` : "";
      }
      const base = runs[0];
      const best = runs.slice(1).filter(done).sort((a, b) => a.tokensN - b.tokensN)[0];
      if (!base || !done(base) || !best) return "";
      const ratio = (a, b) => {
        if (!(a > 0 && b > 0)) return null;
        const x = a / b;
        return x >= 1 ? `${x.toFixed(1)}× fewer` : `${(1 / x).toFixed(1)}× more`;
      };
      const parts = [
        ratio(base.callsN, best.callsN) && `${ratio(base.callsN, best.callsN)} model calls`,
        ratio(base.tokensN, best.tokensN) && `${ratio(base.tokensN, best.tokensN)} tokens`,
      ].filter(Boolean);
      return `<div class="wui-cmp-note"><b>${esc(best.label)}</b> vs ${esc(base.label)}: ${esc(parts.join(" · "))}</div>`;
    }

    // Rows open on click to show the full command or script of every tool call in that model call
    // (step.calls: [{ label, text }], else step.tools). Open rows stay open across re-renders.
    const open = new Set();
    const toolCls = (n) => `wui-tool t-${String(n).replace(/[^a-z0-9_-]/gi, "")}`;
    function detail(s) {
      const calls = s.calls && s.calls.length ? s.calls : (s.tools || []).map((t) => ({ label: t.name, text: t.text }));
      if (!calls.length) return s.text ? esc(s.text) : "";
      return calls.map((c) => `<span class="wui-dk">${esc(c.label || "bash")}</span>\n${esc(c.text || "")}`).join("\n\n");
    }
    function renderSteps() {
      if (!steps.length) {
        stepsEl.innerHTML = `<div class="wui-empty">${esc(o.emptySteps || "Model calls appear here when a lane runs.")}</div>`;
        metaEl.textContent = "";
        return;
      }
      // maxSteps: keep the first and last rows and fold the middle into one "… N more model calls" row.
      const max = o.maxSteps || 0;
      const idx = steps.map((s, i) => ({ ...s, _i: i }));
      const shown = max && steps.length > max ? [...idx.slice(0, max - 3), { gap: steps.length - (max - 1) }, ...idx.slice(-2)] : idx;
      stepsEl.innerHTML = shown.map((s) => {
        if (s.gap) return `<div class="wui-step gap"><span class="wui-sn"></span><span class="wui-stxt">… ${s.gap} more model calls</span></div>`;
        const tools = s.tools || [];
        const names = tools.length ? [...new Set(tools.map((t) => t.name))].map((n) => `<em class="${toolCls(n)}">${esc(n)}${tools.filter((t) => t.name === n).length > 1 ? ` ×${tools.filter((t) => t.name === n).length}` : ""}</em>`).join("") : `<em class="wui-tool ans">answer</em>`;
        const txt = tools.length ? tools[0].text + (tools.length > 1 ? `  (+${tools.length - 1})` : "") : s.text || "";
        const can = !!(o.expandable && (tools.length || s.text));
        const isOpen = can && open.has(s._i);
        const row = `<div class="wui-step${can ? " exp" : ""}${isOpen ? " open" : ""}" data-i="${s._i}"><span class="wui-sn">${esc(s.n)}</span><span class="wui-stools">${names}</span><span class="wui-stxt">${esc(txt)}</span><span class="wui-stok">${typeof s.tokens === "number" ? esc(fmtTok(s.tokens)) : ""}</span></div>`;
        return isOpen ? row + `<pre class="wui-sdetail">${detail(s)}</pre>` : row;
      }).join("");
      const last = steps[steps.length - 1];
      metaEl.textContent = `${steps.length} model call${steps.length === 1 ? "" : "s"}${typeof last.tokens === "number" ? ` · ${fmtTok(last.tokens)} tokens` : ""}`;
    }
    stepsEl.addEventListener("click", (e) => {
      const row = e.target.closest?.(".wui-step.exp");
      if (!row) return;
      e.stopPropagation();
      const i = Number(row.dataset.i);
      if (open.has(i)) open.delete(i); else open.add(i);
      const top = stepsEl.scrollTop;
      renderSteps();
      stepsEl.scrollTop = top;
    });
    const runSelect = [];
    cmpEl.addEventListener("click", (e) => {
      const row = e.target.closest?.(".wui-cmp-row[data-id]");
      if (!row || !row.dataset.id) return;
      e.stopPropagation();
      runSelect.forEach((fn) => fn(row.dataset.id));
    });
    const addStep = (s) => { steps.push({ ...s }); renderSteps(); stepsEl.scrollTop = stepsEl.scrollHeight; };
    const clearSteps = () => { steps = []; open.clear(); renderSteps(); };
    const setTrajectoryTitle = (t) => { titleEl.textContent = String(t || "Trajectory"); };

    // Changed lines only: file names from "+++ b/…", then -/+ lines; context, index and hunk lines dropped.
    function setDiff(d) {
      diffText = String(d || "");
      const out = [];
      for (const ln of diffText.split("\n")) {
        if (/^\+\+\+ b\//.test(ln)) out.push(`<div class="wui-ln wui-meta">${esc(ln.slice(6))}</div>`);
        else if (/^(\+\+\+|---|diff --git|index |@@)/.test(ln)) continue;
        else if (/^\+/.test(ln)) out.push(`<div class="wui-ln wui-add">${esc(ln)}</div>`);
        else if (/^-/.test(ln)) out.push(`<div class="wui-ln wui-del">${esc(ln)}</div>`);
      }
      miniEl.innerHTML = out.length ? out.join("") : `<div class="wui-ln wui-meta">${esc(o.emptyDiff || "No changes")}</div>`;
    }
    function setFiles(next, opts = {}) {
      files = (next || []).map((f) => ({ ...f }));
      if (opts.diff !== undefined) setDiff(opts.diff);
      if (opts.flash) { miniEl.classList.remove("flash"); void miniEl.offsetWidth; miniEl.classList.add("flash"); }
    }

    setBadge(o.badge || null);
    setRuns(runs);
    (o.steps || []).forEach((s) => steps.push({ ...s }));
    renderSteps();
    if (o.trajectoryTitle) setTrajectoryTitle(o.trajectoryTitle);
    setDiff(diffText);

    st.el.appendChild(root);
    const r = finish(st, root);
    return {
      el: root, kind: "box", ...r, cx: r.x + r.w / 2, cy: r.y + r.h / 2, scale: sh.s,
      setBadge, setFiles, setDiff, setRuns, addStep, clearSteps, setTrajectoryTitle,
      onRunSelect: (fn) => runSelect.push(fn),
      markFile: () => {}, getFiles: () => files,
    };
  }

  Object.assign(window, { slackUI, sheetUI, consoleUI, statusDock, terminalUI, workspaceUI });
})();


// === kit-anim.js ===
// Motion for diagrams: dots flowing along arrows, elements appearing one after
// another, arrows drawing themselves, a pulse ring around a shape.
// Requires kit.js (svgEl, stageRect).
//
// Everything here is a NO-OP unless the page is opened with `?anim=1` (play
// once) or `?anim=loop` (replay forever). Without the flag a diagram renders its
// final, static state, so `render` and `check` are unaffected and a PNG and a
// video come from the same file. `bun run animate <name>` steps through the
// timeline frame by frame and writes out/<name>_<v>[_dark].mp4 (+ .gif).
//
//   flow(st, arrows, { dur, n, tone, r, at, reverse })        dots along arrows
//   reveal(st, items, { at, step, dur })  → end time (s)     fade/draw in, staggered
//   scene(st, groups, { step, stagger, dur, at }) → end      groups one after another
//   pulse(st, shape, { at, dur, tone, n })                   ring pulse around a box
//   animated() → bool   duration() → s   seek(ms)  pause()  play()  replay()
//
// Items for reveal/scene: anything with `.el` (shapes), an SVG <g> from
// arrow/elbow/connect, a DOM element, a sequence row (`{ els }`), or arrays of
// those (flattened). Times are seconds from the start of the timeline.
// Keyboard while playing: space pause/play, r replay, ←/→ scrub 250 ms.
(function () {
  const MODE = new URLSearchParams(location.search).get("anim") ?? "1";
  const ON = MODE != null && MODE !== "0";
  const HOLD = 1.2;            // seconds kept after the last reveal when exporting
  let clock = 0;               // where the next reveal starts by default
  let total = 0;               // last scheduled moment
  let ids = 0;

  const animated = () => ON;
  const duration = () => total + HOLD;
  const svgRoot = () => document.querySelector("svg.wires");
  const mark = (t) => { total = Math.max(total, t); };

  // ---- normalise items -------------------------------------------------
  function elsOf(item) {
    if (!item) return [];
    if (Array.isArray(item)) return item.flatMap(elsOf);
    if (item instanceof Element) return [item];
    if (item.els) return item.els.flatMap(elsOf);
    if (item.el) return [item.el];
    return [];
  }
  const isArrow = (el) => el.tagName === "g" && el.dataset.kind === "arrow";

  // ---- flow: dots along an arrow ----------------------------------------
  // The motion path is the arrow's full route, even when the line is broken
  // around a label. Dots are inserted above the line and below the text.
  function routeOf(g) {
    const lines = g.querySelectorAll("path.line");
    if (lines.length === 1) return lines[0].getAttribute("d");
    const d = g.dataset;
    return `M${d.x1} ${d.y1} L${d.x2} ${d.y2}`;
  }
  function flow(st, arrows, o = {}) {
    if (!ON) return;
    const dur = o.dur ?? 1.6, n = o.n ?? 1, r = o.r ?? 5, at = o.at ?? 0;
    for (const g of elsOf(arrows).filter(isArrow)) {
      let fp = g.querySelector("path.flowpath");
      if (!fp) {
        fp = svgEl("path", { class: "flowpath", id: "fp" + ++ids, d: routeOf(g), style: "stroke:none;fill:none" });
        g.insertBefore(fp, g.firstChild);
      }
      const before = g.querySelector("text, .badge");
      for (let i = 0; i < n; i++) {
        const begin = at + (i * dur) / n;
        const c = svgEl("circle", { class: "flowdot " + (o.tone || ""), r, opacity: 0 });
        const m = svgEl("animateMotion", { dur: dur + "s", begin: begin + "s", repeatCount: "indefinite", calcMode: "linear" });
        if (o.reverse) { m.setAttribute("keyPoints", "1;0"); m.setAttribute("keyTimes", "0;1"); }
        m.appendChild(svgEl("mpath", { href: "#" + fp.id }));
        c.appendChild(m);
        c.appendChild(svgEl("set", { attributeName: "opacity", to: 1, begin: begin + "s", fill: "freeze" }));
        before ? g.insertBefore(c, before) : g.appendChild(c);
      }
      mark(at + dur);
    }
  }

  // ---- reveal: fade in, arrows draw themselves --------------------------
  function revealEl(el, t, dur) {
    el.style.setProperty("--d", t + "s");
    el.style.setProperty("--dur", dur + "s");
    if (isArrow(el) && !/\b(dash|dot)\b/.test(el.querySelector("path.line")?.getAttribute("class") || "")) {
      el.classList.add("rv-arrow");
      el.querySelectorAll("path.line").forEach((p) => p.style.setProperty("--len", p.getTotalLength() + "px"));
    } else {
      el.classList.add("rv");
    }
  }
  function reveal(st, items, o = {}) {
    if (!ON) return 0;
    const step = o.step ?? 0.35, dur = o.dur ?? 0.45;
    const t0 = o.at ?? clock;
    const els = elsOf(items);
    els.forEach((el, i) => revealEl(el, t0 + i * step, dur));
    const end = t0 + Math.max(0, els.length - 1) * step + dur;
    clock = end; mark(end);
    return end;
  }
  // groups appear one after another; members of a group together (small stagger)
  function scene(st, groups, o = {}) {
    if (!ON) return 0;
    const step = o.step ?? 0.7, stagger = o.stagger ?? 0.08, dur = o.dur ?? 0.45;
    let t = o.at ?? clock;
    for (const g of groups) {
      const els = elsOf(g);
      els.forEach((el, i) => revealEl(el, t + i * stagger, dur));
      mark(t + (els.length - 1) * stagger + dur);
      t += step;
    }
    clock = total;
    return total;
  }

  // ---- pulse: expanding ring around a shape -----------------------------
  function pulse(st, shape, o = {}) {
    if (!ON) return;
    const r = shape.kind === "circle" ? { x: shape.x - shape.r, y: shape.y - shape.r, w: 2 * shape.r, h: 2 * shape.r } : stageRect(st, shape.el);
    const rx = shape.kind === "circle" ? shape.r : Number(getComputedStyle(shape.el).borderRadius.replace("px", "")) || 12;
    const at = o.at ?? clock, dur = o.dur ?? 1.2, n = o.n ?? 1;
    for (let i = 0; i < n; i++) {
      const ring = svgEl("rect", { class: "pulse " + (o.tone || ""), x: r.x, y: r.y, width: r.w, height: r.h, rx });
      ring.style.setProperty("--d", at + i * (dur / 2) + "s");
      ring.style.setProperty("--dur", dur + "s");
      svgRoot().insertBefore(ring, svgRoot().firstChild);
    }
    mark(at + dur + ((n - 1) * dur) / 2);
  }

  // ---- transport -------------------------------------------------------
  function seek(ms) {
    const s = svgRoot();
    s.pauseAnimations(); s.setCurrentTime(ms / 1000);
    for (const a of document.getAnimations()) { a.pause(); a.currentTime = ms; }
  }
  function pause() { svgRoot().pauseAnimations(); document.getAnimations().forEach((a) => a.pause()); }
  function play() { svgRoot().unpauseAnimations(); document.getAnimations().forEach((a) => a.play()); }
  function replay() { seek(0); play(); }
  function now() { return svgRoot().getCurrentTime() * 1000; }

  if (ON) {
    document.documentElement.dataset.anim = MODE;
    // keydown handled by deck shell
    if (MODE === "loop") addEventListener("load", () => setInterval(() => { if (now() > duration() * 1000 + 800) replay(); }, 200));
  }

  (window.__kitResets = window.__kitResets || []).push(() => { clock = 0; total = 0; ids = 0; });
  Object.assign(window, { animated, duration, flow, reveal, scene, pulse, seek, pause, play, replay });
})();
