/* DevSite-style diagram kit: design tokens + components.
   See docs/design-language.md for the rules behind these values.
   Three themes: light (DevSite, default), dark (DeepMind), and dmi
   (DeepMind Institute editorial serif), switched with <html data-theme="…">
   (stage() reads ?theme=… from the URL). */

:root {
  /* surfaces + text */
  --bg: #F7F7F5;
  --surface: #FFFFFF;      /* cards, boxes */
  --surface-2: #EFF1F3;    /* containers, panels */
  --app: #FFFFFF;          /* product UI mocks (chat screens) */
  --app-2: #F0F2F5;        /* their bubbles and fields */
  --ink: #1F1F1F;
  --muted: #5F6368;
  --arrow: #C4C7C5;
  --border: #DADCE0;
  --border-strong: #9AA0A6;
  --dash: #B8BBB9;

  /* pastel pairs: fill + ink (icons, text, borders) */
  --green: #1E8E3E;  --green-bg: #E6F4EA;  --green-wash: #F1F9F3;
  --blue: #1A73E8;   --blue-bg: #E8F0FE;   --blue-wash: #F2F7FE;
  --purple: #7C4DFF; --purple-bg: #E9E3FF; --purple-wash: #F4F1FF;
  --amber: #B06000;  --amber-bg: #FEEFC3;  --amber-wash: #FFF8E1;
  --red: #D93025;    --red-bg: #FCE8E6;    --red-wash: #FEF3F2;
  --teal: #12805C;   --teal-bg: #E0F2F1;   --teal-wash: #EFF9F8;
  --pink: #C2185B;   --pink-bg: #FCE4EC;   --pink-wash: #FDF2F7;
  --gray: #5F6368;   --gray-bg: #E8EAED;   --gray-wash: #F1F3F4;

  /* code cards are dark on both themes */
  --code-bg: #202124;
  --code-border: #202124;
  --code-ink: #E8EAED;
  --code-muted: #9AA0A6;

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }

/* stage: the exported canvas */
.stage { position: relative; background: var(--bg); overflow: hidden; }
[data-theme="dmi"] .stage { box-shadow: inset 0 0 0 1px var(--border); }
.stage.white, [data-theme="dmi"] .stage.white { background: var(--surface); box-shadow: none; }

/* ------------------------------------------------------------------ */
/* node: circle + name + optional sub. (left, top) is the CIRCLE center, so
   port() and arrows can target it; the text hangs below (or above with .above) */
.node { position: absolute; transform: translate(-50%, calc(var(--circle) / -2)); display: flex; flex-direction: column; align-items: center; width: 0; z-index: 2; }
.node.sm { transform: translate(-50%, calc(var(--circle-sm) / -2)); }
.node.above { transform: translate(-50%, calc(-100% + var(--circle) / 2)); }
.node.above.sm { transform: translate(-50%, calc(-100% + var(--circle-sm) / 2)); }
.node .circle { width: var(--circle); height: var(--circle); border-radius: 999px; display: flex; align-items: center; justify-content: center; flex: none; }
.node.sm .circle { width: var(--circle-sm); height: var(--circle-sm); }
.node .circle svg { width: var(--icon); height: var(--icon); }
.node.sm .circle svg { width: var(--icon-sm); height: var(--icon-sm); }
.node .name { margin-top: 18px; font-size: var(--name); font-weight: 500; white-space: nowrap; letter-spacing: -0.01em; }
.node .sub { margin-top: 4px; font-size: var(--sub); color: var(--muted); white-space: nowrap; text-align: center; line-height: 1.35; }
.node .sub.mono { font-family: var(--mono); font-size: 14px; }
.node.above { flex-direction: column-reverse; }
.node.above .name { margin-top: 0; margin-bottom: 18px; }
.node.above .sub { margin-top: 0; margin-bottom: 4px; }

.green .circle { background: var(--green-bg); color: var(--green); }
.blue .circle { background: var(--blue-bg); color: var(--blue); }
.purple .circle { background: var(--purple-bg); color: var(--purple); }
.amber .circle { background: var(--amber-bg); color: var(--amber); }
.red .circle { background: var(--red-bg); color: var(--red); }
.teal .circle { background: var(--teal-bg); color: var(--teal); }
.pink .circle { background: var(--pink-bg); color: var(--pink); }
.gray .circle { background: var(--gray-bg); color: var(--muted); }
.red .name { color: var(--red); }

/* ------------------------------------------------------------------ */
/* wires: one SVG layer for arrows, labels, badges */
svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 2; }
.wires path { fill: none; stroke: var(--arrow); stroke-width: var(--stroke); stroke-linecap: round; stroke-linejoin: round; }
.wires path.g { stroke: var(--green); }
.wires path.b { stroke: var(--blue); }
.wires path.p { stroke: var(--purple); }
.wires path.r { stroke: var(--red); stroke-dasharray: 10 10; }
.wires path.dash { stroke-dasharray: 10 10; }
.wires path.dot { stroke-dasharray: 2 9; stroke-width: 3; }
.wires path.thin { stroke-width: var(--stroke-thin); }
.wires path.ink { stroke: var(--ink); }
.wires path.lifeline { stroke: var(--border-strong); stroke-width: 2px; stroke-dasharray: 6 8; }
.wires text { font-family: var(--font); font-size: var(--label); fill: var(--ink); font-weight: 500; }
.wires text.sub { font-size: var(--sub); fill: var(--muted); font-weight: 400; }
.wires text.mono { font-family: var(--mono); font-size: var(--sub); fill: var(--muted); font-weight: 400; }
.wires text.mono-lg { font-family: var(--mono); font-size: 20px; fill: var(--ink); font-weight: 500; }
.wires text.g { fill: var(--green); }
.wires text.b { fill: var(--blue); }
.wires text.p { fill: var(--purple); }
.wires text.r { fill: var(--red); }
.wires text.small { font-size: 16px; }
.wires text.halo { paint-order: stroke; stroke: var(--bg); stroke-width: 12px; stroke-linejoin: round; }
.wires .badge circle { stroke: none; }
.wires .badge text { fill: #fff; font-size: 17px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
.wires .brace { stroke: var(--border-strong); stroke-width: 2px; }
.wires .act { fill: var(--surface-2); stroke: var(--border-strong); stroke-width: 1.5px; }
.wires .act.blue { fill: var(--blue-bg); stroke: var(--blue); }
.wires .act.green { fill: var(--green-bg); stroke: var(--green); }
.wires .act.purple { fill: var(--purple-bg); stroke: var(--purple); }
.wires .act.amber { fill: var(--amber-bg); stroke: var(--amber); }
.wires .act.red { fill: var(--red-bg); stroke: var(--red); }
.wires .act.teal { fill: var(--teal-bg); stroke: var(--teal); }

/* ------------------------------------------------------------------ */
/* chips: tag row centered on left */
.chips { position: absolute; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; z-index: 2; }
.chip { font-family: var(--mono); font-size: 14px; padding: 5px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--ink); white-space: nowrap; }
.chip.label { font-family: var(--font); background: transparent; border: none; color: var(--muted); padding-left: 0; padding-right: 2px; }
.chip.amber { background: var(--amber-bg); border-color: color-mix(in srgb, var(--amber) 35%, transparent); color: var(--amber); }
.chip.rose { background: var(--pink-bg); border-color: color-mix(in srgb, var(--pink) 35%, transparent); color: var(--pink); }
.chip.sky { background: var(--blue-bg); border-color: color-mix(in srgb, var(--blue) 35%, transparent); color: var(--blue); }
.chip.mint { background: var(--green-bg); border-color: color-mix(in srgb, var(--green) 35%, transparent); color: var(--green); }

/* legend: small titled list, left-aligned at left */
.legend { position: absolute; z-index: 2; }
.legend h4 { margin: 0 0 8px; font-size: 15px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.legend ul { margin: 0; padding: 0; list-style: none; }
.legend li { font-size: 17px; line-height: 1.55; color: var(--ink); }
.legend li code { font-family: var(--mono); font-size: 15px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }

/* group: dashed container with a pill tag on the top border */
.group { position: absolute; border: 2px dashed var(--dash); border-radius: 28px; background: transparent; z-index: 1; }
.group.fill { background: var(--surface-2); }
.group .tag { position: absolute; left: 50%; top: -15px; transform: translateX(-50%); font-size: 17px; font-weight: 500; color: var(--muted); background: var(--bg); padding: 2px 14px; border-radius: 999px; white-space: nowrap; }

/* ------------------------------------------------------------------ */
/* box: rounded rectangle node. (left, top) is the top-left corner. */
.box { position: absolute; z-index: 2; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 14px 20px; border-radius: var(--radius); background: var(--surface); border: 1.5px solid var(--border); color: var(--ink); text-align: center; min-height: 56px; }
.box.left { text-align: left; align-items: flex-start; }
.box .head { display: flex; align-items: center; justify-content: center; gap: 10px; min-width: 0; }
.box.left .head { justify-content: flex-start; }
.box .head svg { width: 22px; height: 22px; flex: none; }
.box .title { font-size: 20px; font-weight: 500; line-height: 1.25; letter-spacing: -0.005em; }
.box .sub { font-size: 14px; color: var(--muted); line-height: 1.4; }
.box .body { font-size: 15px; line-height: 1.5; color: var(--ink); }
.box .body ul { margin: 6px 0 0; padding: 0; list-style: none; text-align: left; }
.box .body li { display: flex; gap: 8px; align-items: baseline; }
.box .body li::before { content: "•"; color: var(--muted); }
.box .body li.ok::before { content: "✓"; color: var(--green); font-weight: 600; }
.box .body li.bad::before { content: "✕"; color: var(--red); font-weight: 600; }
.box.mono .title { font-family: var(--mono); font-size: 17px; font-weight: 500; letter-spacing: 0; }
.box.mono .sub { font-family: var(--mono); font-size: 13px; }
.box.caps .title { font-family: var(--mono); font-size: 15px; text-transform: uppercase; letter-spacing: 0.08em; }
.box.xs { padding: 3px 5px; min-height: 24px; border-radius: 6px; gap: 1px; }
.box.xs .title { font-size: 11.5px; font-weight: 600; line-height: 1.15; white-space: nowrap; }
.box.xs .sub { font-size: 10px; line-height: 1.12; white-space: nowrap; }
.box.sm { padding: 9px 14px; min-height: 40px; border-radius: 10px; }
.box.sm .title { font-size: 16px; }
.box.sm .sub { font-size: 13px; }
.box.lg { padding: 20px 28px; }
.box.lg .title { font-size: 24px; }
.box.lg .sub { font-size: 16px; }
/* a row of chips inside a box body: body: `<div class="chiprow"><span class="chip">…</span></div>` */
.box .body .chiprow { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
.box.left .body .chiprow { justify-content: flex-start; }
.box.lg .chip { font-size: 16px; padding: 6px 13px; }
.box.pill { border-radius: 999px; padding-left: 28px; padding-right: 28px; }
/* tones */
.box.blue   { background: var(--blue-bg);   border-color: color-mix(in srgb, var(--blue) 40%, transparent);   color: var(--ink); }
.box.green  { background: var(--green-bg);  border-color: color-mix(in srgb, var(--green) 40%, transparent);  }
.box.purple { background: var(--purple-bg); border-color: color-mix(in srgb, var(--purple) 40%, transparent); }
.box.amber  { background: var(--amber-bg);  border-color: color-mix(in srgb, var(--amber) 40%, transparent);  }
.box.red    { background: var(--red-bg);    border-color: color-mix(in srgb, var(--red) 40%, transparent);    }
.box.teal   { background: var(--teal-bg);   border-color: color-mix(in srgb, var(--teal) 40%, transparent);   }
.box.pink   { background: var(--pink-bg);   border-color: color-mix(in srgb, var(--pink) 40%, transparent);   }
.box.gray   { background: var(--gray-bg);   border-color: transparent; }
.box.white  { background: var(--surface);   border-color: var(--ink); border-width: 1.8px; color: var(--ink); }
.box.blue .head svg { color: var(--blue); }   .box.green .head svg { color: var(--green); }
.box.purple .head svg { color: var(--purple); } .box.amber .head svg { color: var(--amber); }
.box.red .head svg { color: var(--red); }     .box.teal .head svg { color: var(--teal); }
.box.pink .head svg { color: var(--pink); }   .box.gray .head svg, .box.surface .head svg { color: var(--muted); }
.box.red .title { color: var(--red); }
/* strong: saturated fill, white text (emphasis, terminal states) */
.box.strong.blue   { background: var(--blue);   color: #fff; border-color: transparent; }
.box.strong.green  { background: var(--green);  color: #fff; border-color: transparent; }
.box.strong.purple { background: var(--purple); color: #fff; border-color: transparent; }
.box.strong.amber  { background: var(--amber);  color: #fff; border-color: transparent; }
.box.strong.red    { background: var(--red);    color: #fff; border-color: transparent; }
.box.strong.teal   { background: var(--teal);   color: #fff; border-color: transparent; }
.box.strong.pink   { background: var(--pink);   color: #fff; border-color: transparent; }
.box.strong.gray   { background: #6E6E73;       color: #fff; border-color: #27272A; }
.box.strong .title, .box.strong .sub, .box.strong .head svg { color: inherit; }
.box.strong .sub { opacity: 0.8; }
[data-theme="dark"] .box.strong.blue, [data-theme="dark"] .box.strong.green, [data-theme="dark"] .box.strong.purple,
[data-theme="dark"] .box.strong.amber, [data-theme="dark"] .box.strong.red, [data-theme="dark"] .box.strong.teal,
[data-theme="dark"] .box.strong.pink { color: #121317; }
[data-theme="dark"] .box.strong.gray { background: #4B5563; color: #F9FAFB; border-color: #9CA3AF; }
/* ink: near-black fill (light) / near-white (dark): the "result" box */
.box.ink { background: var(--ink); color: var(--bg); border-color: transparent; }
.box.ink .title, .box.ink .sub, .box.ink .head svg { color: inherit; }
.box.ink .sub { opacity: 0.75; }
/* dashed: ephemeral, untrusted, optional */
.box.dashed { background: transparent; border-style: dashed; border-width: 2px; border-color: var(--dash); }
.box.dashed.red { border-color: color-mix(in srgb, var(--red) 55%, transparent); background: color-mix(in srgb, var(--red-bg) 50%, transparent); }
.box.dashed.blue { border-color: color-mix(in srgb, var(--blue) 55%, transparent); background: color-mix(in srgb, var(--blue-bg) 50%, transparent); }
/* ghost: text only */
.box.ghost { background: transparent; border-color: transparent; color: var(--muted); }
/* shapes drawn with an inline svg behind the text */
.box.diamond, .box.hex { background: transparent !important; border-color: transparent !important; }
.box .shape { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; overflow: visible; }
.box .shape polygon { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; stroke-linejoin: round; }
.box.blue .shape polygon { fill: var(--blue-bg); stroke: color-mix(in srgb, var(--blue) 40%, transparent); }
.box.amber .shape polygon { fill: var(--amber-bg); stroke: color-mix(in srgb, var(--amber) 40%, transparent); }
.box.purple .shape polygon { fill: var(--purple-bg); stroke: color-mix(in srgb, var(--purple) 40%, transparent); }
.box.green .shape polygon { fill: var(--green-bg); stroke: color-mix(in srgb, var(--green) 40%, transparent); }
.box.ink .shape polygon { fill: var(--ink); stroke: var(--ink); }
.box.diamond { padding: 10px 44px; }
.box.hex { padding-left: 36px; padding-right: 36px; }
.box .icon-only { display: flex; justify-content: center; }
.box .icon-only svg { width: 40px; height: 40px; }
.box .kicker { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.box.strong .kicker, .box.ink .kicker { color: inherit; opacity: 0.75; }

/* ------------------------------------------------------------------ */
/* panel: titled container drawn behind boxes */
.panel { position: absolute; z-index: 1; border-radius: var(--radius-lg); background: var(--surface-2); border: 1.5px solid var(--border); padding: 18px 22px; }
.panel.surface { background: var(--surface); }
.panel.plain { background: transparent; border-color: transparent; }
.panel.dashed { background: transparent; border: 2px dashed var(--dash); }
.panel.hatch { background: repeating-linear-gradient(135deg, transparent 0 9px, color-mix(in srgb, var(--border-strong) 35%, transparent) 9px 10px); }
.panel.blue  { background: color-mix(in srgb, var(--blue-bg) 55%, var(--bg)); border-color: color-mix(in srgb, var(--blue) 35%, transparent); }
.panel.green { background: color-mix(in srgb, var(--green-bg) 55%, var(--bg)); border-color: color-mix(in srgb, var(--green) 35%, transparent); }
.panel.red   { background: color-mix(in srgb, var(--red-bg) 45%, var(--bg)); border-color: color-mix(in srgb, var(--red) 45%, transparent); }
.panel.amber { background: color-mix(in srgb, var(--amber-bg) 45%, var(--bg)); border-color: color-mix(in srgb, var(--amber) 40%, transparent); }
.panel.purple { background: color-mix(in srgb, var(--purple-bg) 55%, var(--bg)); border-color: color-mix(in srgb, var(--purple) 35%, transparent); }
.panel .ptitle { font-size: 15px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; width: max-content; }
.panel.blue .ptitle { color: var(--blue); } .panel.green .ptitle { color: var(--green); } .panel.red .ptitle { color: var(--red); }
.panel.amber .ptitle { color: var(--amber); } .panel.purple .ptitle { color: var(--purple); }
.panel .psub { font-size: 14px; color: var(--muted); margin-top: 2px; white-space: nowrap; width: max-content; }
.panel .ptitle.big { font-size: 22px; font-weight: 500; text-transform: none; letter-spacing: -0.005em; color: var(--ink); }
.panel.dashed .ptitle, .panel.plain .ptitle { color: var(--muted); }

/* title + caption */
.dtitle { position: absolute; z-index: 2; font-family: var(--display); font-size: 34px; font-weight: 500; letter-spacing: -0.015em; line-height: 1.15; color: var(--ink); white-space: pre-line; }
.dtitle .sub { display: block; margin-top: 8px; font-family: var(--font); font-size: 18px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.dtitle.small { font-size: 26px; }
.caption { position: absolute; z-index: 2; text-align: center; font-size: 17px; color: var(--muted); line-height: 1.5; }
.caption code, .anno code, .chat code, .step code { font-family: var(--mono); font-size: 0.92em; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; color: var(--ink); }
.caption b, .anno b { color: var(--ink); font-weight: 500; }
.caption .hi, .anno .hi { color: var(--blue); font-weight: 500; }

/* anno: annotation text (target of a leader line) */
.anno { position: absolute; z-index: 2; font-size: 16px; line-height: 1.45; color: var(--muted); }
.anno .k { font-family: var(--mono); color: var(--blue); font-weight: 600; font-size: 15px; }
.anno.mono { font-family: var(--mono); font-size: 14px; }

/* ------------------------------------------------------------------ */
/* code card: dark card with dots + title, monospaced body */
.card { position: absolute; z-index: 2; border-radius: 16px; background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--code-border); overflow: visible; }
.card .bar { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
.card .bar .dots { display: flex; gap: 6px; }
.card .bar .dots i { width: 11px; height: 11px; border-radius: 50%; background: var(--code-dots); }
.card .bar .ctitle { flex: 1; text-align: center; font-family: var(--mono); font-size: 13px; color: var(--code-muted); white-space: nowrap; }
.card .bar .dots + .ctitle { margin-right: 45px; }
.card pre { margin: 0; padding: 18px 22px; font-family: var(--mono); font-size: 15px; line-height: 1.65; white-space: pre; tab-size: 2; }
.card pre .ln { display: block; padding: 0 22px; margin: 0 -22px; }
.card pre .ln.hl { background: var(--code-hl); box-shadow: inset 3px 0 0 var(--code-hl-bar); }
.card pre .ln.dim { opacity: 0.45; }
.card pre .ln.mute { opacity: 0.38; filter: grayscale(1); }
.card pre .ln.new { background: var(--code-add); box-shadow: inset 3px 0 0 var(--code-add-bar); }
.card .kw { color: var(--code-kw); } .card .str { color: var(--code-str); } .card .num { color: var(--code-num); }
.card .fn { color: var(--code-fn); } .card .cm { color: var(--code-cm); font-style: italic; } .card .key { color: var(--code-kw); }
.card .hd { color: var(--code-num); font-weight: 600; } .card .op { color: var(--code-muted); } .card .hi { color: var(--code-num); }
.card .mark { background: rgba(253, 214, 99, 0.16); border-radius: 4px; padding: 0 3px; }
.card .add { color: var(--code-str); } .card .del { color: #F28B82; }
.card.light .add { color: var(--green); } .card.light .del { color: var(--red); }
.card.light { background: var(--surface); color: var(--ink); border-color: var(--border); }
.card.light .bar { border-bottom-color: var(--border); }
.card.light .bar .dots i { background: var(--border-strong); }
.card.light .kw { color: var(--blue); } .card.light .str { color: var(--green); } .card.light .num { color: var(--amber); }
.card.light .fn { color: var(--purple); } .card.light .cm { color: var(--muted); } .card.light .op { color: var(--muted); } .card.light .hi { color: var(--red); }
.card.light pre .ln.hl { background: var(--blue-bg); box-shadow: inset 3px 0 0 var(--blue); }
.card.light pre .ln.new { background: var(--green-wash); box-shadow: inset 3px 0 0 var(--green); }
.card .cfoot { padding: 12px 22px 16px; font-size: 14px; color: var(--code-muted); border-top: 1px solid rgba(255, 255, 255, 0.08); }
.card.light .cfoot { color: var(--muted); border-top-color: var(--border); }
/* accent border on the left (compare "bad" vs "good") */
.card.edge-red { border-left: 5px solid var(--red); border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
.card.edge-green { border-left: 5px solid var(--green); border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
.card.edge-blue { border-left: 5px solid var(--blue); border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
/* line numbers + action bar (shadcn CodeBlock style) */
.card.numbered pre .lnum { display: inline-block; width: 26px; padding-right: 14px; text-align: right; color: var(--code-muted); opacity: 0.55; font-variant-numeric: tabular-nums; user-select: none; }
.card.light.numbered pre .lnum { color: var(--muted); opacity: 0.65; }
.card.has-actions .bar .ctitle { text-align: left; }
.card.has-actions .bar .dots + .ctitle { margin-right: 0; }
.card .bar .cfico { display: inline-flex; color: var(--code-muted); }
.card .bar .cfico svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.card .bar .cacts { display: inline-flex; align-items: center; gap: 2px; color: var(--code-muted); }
.card .bar .cacts i { width: 26px; height: 26px; border-radius: 6px; display: inline-grid; place-items: center; }
.card .bar .cacts svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.card.light .bar .cfico, .card.light .bar .cacts { color: var(--muted); }

/* file tree */
.tree { position: absolute; z-index: 2; border-radius: calc(16px * var(--ts, 1)); background: var(--surface); border: 1.5px solid var(--border); padding: calc(18px * var(--ts, 1)) calc(22px * var(--ts, 1)); font-family: var(--mono); font-size: calc(15px * var(--ts, 1)); line-height: 1.9; color: var(--ink); }
.tree .troot { color: var(--muted); font-size: calc(13px * var(--ts, 1)); text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--font); font-weight: 600; margin-bottom: calc(8px * var(--ts, 1)); }
.tree .tpath { color: var(--muted); margin-bottom: calc(6px * var(--ts, 1)); }
.tree .tpath b { color: var(--ink); font-weight: 600; }
.tree .row { display: flex; align-items: center; gap: calc(6px * var(--ts, 1)); white-space: nowrap; }
.tree .row .pre { color: var(--border-strong); }
.tree .row.hl .nm { color: var(--blue); font-weight: 600; }
.tree .row.hl { background: var(--blue-bg); margin: 0 calc(-10px * var(--ts, 1)); padding: 0 calc(10px * var(--ts, 1)); border-radius: calc(8px * var(--ts, 1)); }
.tree .row .note { margin-left: calc(10px * var(--ts, 1)); font-family: var(--font); font-size: calc(13px * var(--ts, 1)); color: var(--blue); }
.tree .row .ic { width: calc(16px * var(--ts, 1)); height: calc(16px * var(--ts, 1)); color: var(--muted); flex: none; }
.tree .row.dir .nm { font-weight: 600; }
.tree .tfoot { margin-top: calc(12px * var(--ts, 1)); font-family: var(--font); font-size: calc(14px * var(--ts, 1)); color: var(--muted); line-height: 1.45; white-space: normal; }

/* ------------------------------------------------------------------ */
/* sequence diagram participants reuse .box; lifelines and activations are svg */

/* chat / trajectory rows */
.chat { position: absolute; z-index: 2; display: grid; grid-template-columns: max-content 1fr; column-gap: 14px; row-gap: 10px; align-items: start; }
.chat .msg { display: contents; }
.chat .role { min-width: 92px; padding: 8px 12px; border-radius: 10px; text-align: center; font-size: 15px; font-weight: 500; background: var(--surface); border: 1.5px solid var(--border); color: var(--ink); white-space: nowrap; }
.chat .role.user { background: var(--surface); }
.chat .role.model { background: var(--purple-bg); border-color: transparent; color: var(--purple); }
.chat .role.tool { background: var(--amber-bg); border-color: transparent; color: var(--amber); }
.chat .role.system { background: var(--gray-bg); border-color: transparent; color: var(--muted); }
.chat .txt { padding: 8px 0; font-size: 18px; line-height: 1.4; color: var(--ink); min-width: 0; }
.chat .txt.mono { font-family: var(--mono); font-size: 15px; color: var(--muted); white-space: pre-wrap; }
.chat .txt.mono b { color: var(--ink); font-weight: 500; }
.chat .msg.final .txt { padding: 8px 14px; border: 2px dashed color-mix(in srgb, var(--purple) 55%, transparent); border-radius: 10px; }

/* token strips */
.strip { position: absolute; z-index: 2; display: flex; align-items: center; gap: 12px; }
.strip .slabel { width: 90px; text-align: right; font-size: 13px; color: var(--muted); line-height: 1.2; white-space: pre-line; }
.strip .cells { display: flex; gap: 4px; }
.strip .cell { width: 36px; height: 22px; border-radius: 3px; background: var(--gray-bg); border: 1.5px solid transparent; }
.strip .cell.amber { background: color-mix(in srgb, var(--amber) 28%, var(--amber-bg)); } .strip .cell.blue { background: color-mix(in srgb, var(--blue) 28%, var(--blue-bg)); }
.strip .cell.purple { background: color-mix(in srgb, var(--purple) 28%, var(--purple-bg)); } .strip .cell.green { background: color-mix(in srgb, var(--green) 28%, var(--green-bg)); }
.strip .cell.red { background: var(--red-bg); border-color: var(--red); border-style: dashed; }
.strip .cell.dashed { background: transparent; border-color: var(--border-strong); border-style: dashed; }
.strip.divider { height: 28px; border-radius: 6px; background: var(--surface-2); justify-content: center; font-size: 13px; color: var(--muted); }
.swatches { position: absolute; z-index: 2; display: flex; gap: 22px; font-size: 14px; color: var(--muted); align-items: center; }
.swatches .sw { display: flex; align-items: center; gap: 8px; }
.swatches .sw i { width: 22px; height: 14px; border-radius: 3px; background: var(--gray-bg); border: 1.5px solid transparent; display: inline-block; }
.swatches .sw i.amber { background: color-mix(in srgb, var(--amber) 28%, var(--amber-bg)); } .swatches .sw i.blue { background: color-mix(in srgb, var(--blue) 28%, var(--blue-bg)); } .swatches .sw i.purple { background: color-mix(in srgb, var(--purple) 28%, var(--purple-bg)); }
.swatches .sw i.green { background: color-mix(in srgb, var(--green) 28%, var(--green-bg)); } .swatches .sw i.red { background: var(--red-bg); border-color: var(--red); border-style: dashed; }
.swatches .sw i.dashed { background: transparent; border-color: var(--border-strong); border-style: dashed; }
.swatches .sw i.dot { width: 14px; height: 14px; border-radius: 50%; }
.swatches .sw i.line { width: 28px; height: 0; border-radius: 0; border: none; border-top: 3px solid var(--arrow); }
.swatches .sw i.line.dash { border-top-style: dashed; } .swatches .sw i.line.dot { border-top-style: dotted; width: 28px; height: 0; border-radius: 0; }
.swatches .sw i.line.g { border-top-color: var(--green); } .swatches .sw i.line.b { border-top-color: var(--blue); } .swatches .sw i.line.r { border-top-color: var(--red); }

/* spectrum markers reuse .box; the axis is svg */
.axis-label { position: absolute; z-index: 2; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }

/* numbered steps (title + optional code line) */
.step { position: absolute; z-index: 2; display: flex; gap: 12px; align-items: baseline; font-size: 17px; color: var(--ink); }
.step .n { font-weight: 600; color: var(--muted); }
.step .pre { font-family: var(--mono); font-size: 14px; color: var(--muted); white-space: pre; line-height: 1.7; }

/* check overlay (added by scripts/check.ts, never in exports) */
.check-box { position: absolute; border: 2px solid #D93025; background: rgba(217, 48, 37, 0.12); z-index: 99; pointer-events: none; }
.check-box.warn { border-color: #F29900; background: rgba(242, 153, 0, 0.12); }
.check-box .tag { position: absolute; left: 0; top: -18px; font: 600 11px/1 var(--mono); color: #fff; background: inherit; background-color: #D93025; padding: 2px 5px; border-radius: 4px; white-space: nowrap; }
.check-box.warn .tag { background-color: #F29900; }

/* ------------------------------------------------------------------ */
/* charts (kit-charts.js): stackbar, gantt, matrix, scatter, timeline.
   One element each; inner .lbl elements are what the checker compares. */
.stackbar { position: absolute; z-index: 2; }
.stackbar .bar { position: relative; border-radius: 12px; overflow: hidden; border: 1.5px solid var(--border); background: var(--surface); }
.stackbar .seg { position: absolute; top: 0; display: flex; align-items: center; justify-content: center; border-right: 1.5px solid var(--bg); }
.stackbar .seg:last-child { border-right: 0; }
.stackbar .seg .lbl { display: flex; flex-direction: column; align-items: center; line-height: 1.15; font-size: 15px; font-weight: 500; white-space: nowrap; padding: 0 8px; }
.stackbar .seg .lbl em { font-style: normal; font-family: var(--mono); font-size: 12.5px; font-weight: 400; color: var(--muted); margin-top: 3px; }
.stackbar .seg.blue { background: color-mix(in srgb, var(--blue) 22%, var(--blue-bg)); color: var(--ink); }
.stackbar .seg.purple { background: color-mix(in srgb, var(--purple) 22%, var(--purple-bg)); }
.stackbar .seg.green { background: color-mix(in srgb, var(--green) 22%, var(--green-bg)); }
.stackbar .seg.amber { background: color-mix(in srgb, var(--amber) 22%, var(--amber-bg)); }
.stackbar .seg.red { background: color-mix(in srgb, var(--red) 22%, var(--red-bg)); }
.stackbar .seg.teal { background: color-mix(in srgb, var(--teal) 22%, var(--teal-bg)); }
.stackbar .seg.pink { background: color-mix(in srgb, var(--pink) 22%, var(--pink-bg)); }
.stackbar .seg.gray { background: var(--gray-bg); }
.stackbar .seg.free { background: repeating-linear-gradient(-45deg, transparent 0 7px, color-mix(in srgb, var(--border) 60%, transparent) 7px 8px); color: var(--muted); }
.stackbar .seg.free .lbl { font-weight: 400; }
.stackbar .axis { position: relative; height: 26px; margin-top: 8px; }
.stackbar .axis .tick, .gantt .axis .tick { position: absolute; top: 0; transform: translateX(-50%); font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; padding-top: 8px; }
.stackbar .axis .tick::before, .gantt .axis .tick::before { content: ""; position: absolute; left: 50%; top: 0; width: 1.5px; height: 5px; background: var(--border-strong); }
.stackbar .axis .tick.first, .gantt .axis .tick.first { transform: translateX(0); } .stackbar .axis .tick.first::before, .gantt .axis .tick.first::before { left: 0; }
.stackbar .axis .tick.last, .gantt .axis .tick.last { transform: translateX(-100%); } .stackbar .axis .tick.last::before, .gantt .axis .tick.last::before { left: auto; right: 0; }

.gantt { position: absolute; z-index: 2; }
.gantt .rows { position: relative; }
.gantt .row { position: relative; display: flex; align-items: center; }
.gantt .rlabel { font-size: 15px; color: var(--ink); text-align: right; padding-right: 16px; white-space: nowrap; overflow: hidden; text-overflow: clip; }
.gantt .lane { position: absolute; top: 0; height: 100%; }
.gantt .gbar { position: absolute; top: 0; height: 100%; border-radius: 8px; display: flex; align-items: center; justify-content: center; border: 1.5px solid transparent; }
.gantt .gbar .lbl { font-size: 14px; font-weight: 500; white-space: nowrap; padding: 0 8px; line-height: 1.2; }
.gantt .gbar .lbl.outside { position: absolute; left: 100%; color: var(--muted); font-weight: 400; }
.gantt .gbar.blue { background: var(--blue-bg); border-color: color-mix(in srgb, var(--blue) 40%, transparent); }

.timeline .pill.green { background: var(--green-bg); border-color: color-mix(in srgb, var(--green) 40%, transparent); } .timeline .pill.amber { background: var(--amber-bg); border-color: color-mix(in srgb, var(--amber) 40%, transparent); }
.timeline .pill.red { background: var(--red-bg); border-color: color-mix(in srgb, var(--red) 40%, transparent); } .timeline .pill.teal { background: var(--teal-bg); border-color: color-mix(in srgb, var(--teal) 40%, transparent); }

.strip .cell.teal { background: color-mix(in srgb, var(--teal) 28%, var(--teal-bg)); } .strip .cell.pink { background: color-mix(in srgb, var(--pink) 28%, var(--pink-bg)); }

/* ------------------------------------------------------------------ */
/* tile: header strip + large icon body (hub diagrams, component maps) */
.box.tile { padding: 0; gap: 0; justify-content: flex-start; overflow: hidden; }

.box.tile.teal .thead { background: color-mix(in srgb, var(--teal) 14%, var(--surface)); border-color: color-mix(in srgb, var(--teal) 40%, transparent); } .box.tile.teal .tbody { color: var(--teal); }
.box.tile.gray .thead { background: var(--gray-bg); }
.box.tile.blue, .box.tile.green, .box.tile.purple, .box.tile.amber, .box.tile.teal { background: var(--surface); }

/* group heading above the top-left corner (alternative to the centred tag pill) */
.group .tag.above { left: 18px; top: -38px; transform: none; background: transparent; padding: 0; font-size: 19px; color: var(--ink); font-weight: 500; }

.group.blue { border-color: color-mix(in srgb, var(--blue) 55%, transparent); } .group.blue.fill { background: color-mix(in srgb, var(--blue-bg) 60%, transparent); }
.group.green { border-color: color-mix(in srgb, var(--green) 55%, transparent); } .group.green.fill { background: color-mix(in srgb, var(--green-bg) 60%, transparent); }

/* ------------------------------------------------------------------ */
/* table: prose/spec table (kit-tables.js) */
.table { position: absolute; z-index: 2; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 8px 28px 10px; }
.table.plain { background: transparent; border-color: transparent; padding: 0; }
.table .trow { display: flex; gap: 28px; border-bottom: 1px solid var(--border); padding: 18px 0 20px; align-items: flex-start; }

.table .tcell { flex: none; font-size: 16px; line-height: 1.5; color: var(--ink); min-width: 0; }
.table .tcell.grow { flex: 1 1 0; }
.table .thead .tcell { font-weight: 500; font-size: 17px; }
.table .tcell.strong { font-weight: 500; font-size: 17px; }

.table .tcell .pill.amber { background: var(--amber-bg); color: var(--amber); } .table .tcell .pill.red { background: var(--red-bg); color: var(--red); }
.table .tcell .pill.purple { background: var(--purple-bg); color: var(--purple); }

/* ladder: compact two-party message ladder (kit-tables.js) */
.ladder { position: absolute; z-index: 2; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.ladder .lhead { height: 44px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; color: #fff; background: var(--blue); }
.ladder.purple .lhead { background: var(--purple); } .ladder.green .lhead { background: var(--green); } .ladder.teal .lhead { background: var(--teal); } .ladder.ink .lhead { background: var(--ink); color: var(--bg); } .ladder.gray .lhead { background: var(--gray-bg); color: var(--ink); }
[data-theme="dark"] .ladder .lhead { color: var(--bg); }
.ladder .lcols { display: flex; justify-content: space-between; padding: 12px 14px 4px; font-family: var(--mono); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.ladder svg { display: block; overflow: visible; }
.ladder svg .rail { stroke: var(--border-strong); stroke-width: 2; }
.ladder svg .msg { stroke: var(--border-strong); stroke-width: 1.6; fill: none; }
.ladder svg .msg.hi { stroke: var(--blue); stroke-width: 2; }

.ladder svg text.note { font-size: 13px; fill: var(--muted); font-style: italic; }

/* ------------------------------------------------------------------ */
/* pictograms (kit-picto.js): document stacks and tile grids */
.picto { position: absolute; z-index: 2; }

.picto .sheet { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.4; stroke-linejoin: round; }

.picto .blue .sheet { fill: var(--blue-bg); stroke: color-mix(in srgb, var(--blue) 50%, transparent); }
.picto .green .sheet { fill: var(--green-bg); stroke: color-mix(in srgb, var(--green) 50%, transparent); }
.picto .amber .sheet { fill: var(--amber-bg); stroke: color-mix(in srgb, var(--amber) 55%, transparent); }
.picto .purple .sheet { fill: var(--purple-bg); stroke: color-mix(in srgb, var(--purple) 50%, transparent); }
.picto .gray .sheet { fill: var(--gray-bg); stroke: var(--border-strong); }
.picto .glyph { color: var(--muted); }
.picto .blue .glyph { color: var(--blue); } .picto .green .glyph { color: var(--green); } .picto .amber .glyph { color: var(--amber); } .picto .purple .glyph { color: var(--purple); }
.picto .mark { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.2; }

.tilegrid .cell { fill: var(--surface); stroke: var(--border); stroke-width: 1.2; }

.tilegrid.blue .cell { fill: color-mix(in srgb, var(--blue-bg) 55%, var(--surface)); stroke: color-mix(in srgb, var(--blue) 30%, transparent); }
.tilegrid.gray .cell { fill: var(--surface-2); stroke: var(--border); }
/* icon-only boxes (status marks, join points): no text padding, icon fills the box */

/* ---------- chat UI mock (kit-chat.js) ---------- */

  --acc: var(--blue); --acc-bg: var(--blue-bg); --bub: var(--app-2); }

.chatui.amber { --acc: var(--amber); --acc-bg: var(--amber-bg); } .chatui.teal { --acc: var(--teal); --acc-bg: var(--teal-bg); } .chatui.pink { --acc: var(--pink); --acc-bg: var(--pink-bg); }

/* tool calls: numbered, with a rail */

/* ---------- agent trace (kit-chat.js: trace() & chatUI trace) ---------- */
.trace { position: absolute; z-index: 2; display: flex; flex-direction: column; font-family: var(--font); font-size: 14px; line-height: 1.45; color: var(--ink);
  --acc: var(--blue); --bub: var(--app-2); }

.trace .tr-head { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 0 8px 6px; align-self: flex-start; }

.tr-badge { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; background: var(--app-2); border: 1px solid var(--border); font-size: 12px; font-weight: 500; color: var(--ink); white-space: nowrap; }

/* ---------- animation (kit-anim.js; classes only appear with ?anim=) ---------- */
.wires path.flowpath { fill: none; stroke: none; }
.flowdot { fill: var(--blue); }
.flowdot.green { fill: var(--green); } .flowdot.amber { fill: var(--amber); } .flowdot.purple { fill: var(--purple); }
.flowdot.red { fill: var(--red); } .flowdot.teal { fill: var(--teal); } .flowdot.pink { fill: var(--pink); }
.flowdot.gray { fill: var(--muted); } .flowdot.ink { fill: var(--ink); }
.rv { opacity: 0; animation: rv-in var(--dur, .45s) cubic-bezier(.2, .7, .2, 1) var(--d, 0s) both; }
svg .rv { transform-box: fill-box; }
@keyframes rv-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.rv-arrow path.line { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: rv-draw var(--dur, .45s) linear var(--d, 0s) both; }
.rv-arrow .head, .rv-arrow text, .rv-arrow .badge { opacity: 0; animation: rv-fade .25s ease-out calc(var(--d, 0s) + var(--dur, .45s)) both; }
@keyframes rv-draw { to { stroke-dashoffset: 0; } }
@keyframes rv-fade { to { opacity: 1; } }
.pulse { fill: none; stroke: var(--blue); stroke-width: 2.5; opacity: 0; transform-box: fill-box; transform-origin: center; animation: pulse var(--dur, 1.2s) ease-out var(--d, 0s) forwards; }
.pulse.green { stroke: var(--green); } .pulse.amber { stroke: var(--amber); } .pulse.purple { stroke: var(--purple); } .pulse.red { stroke: var(--red); }
@keyframes pulse { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.12); } }

/* slides (kit-slides.js): 16:9 shell and editorial components.
   Sizes assume a 1920×1080 stage (deck root 16 px). */
:root {
  --surface-3: #E3E6EA;                     /* raised containers (modals, buttons) */
  --shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
  --shadow-lg: 0 25px 60px rgba(0, 0, 0, 0.35);
  --grad-gemini: linear-gradient(90deg, #3B6BFF 0%, #2E96FF 65%, #ACB7FF 100%);
  --grad-sandbox: linear-gradient(135deg, #182855 0%, #2E1C6D 50%, #005143 100%);
  --grad-bleed: linear-gradient(135deg, #1C2B66 0%, #3D238E 50%, #006B58 100%);
  --grad-hero: linear-gradient(135deg, #101528 0%, #1A1135 50%, #06241E 100%);
}
[data-theme="dark"] { --surface-3: #2F3034; --shadow: 0 15px 45px rgba(0, 0, 0, 0.35); --shadow-lg: 0 25px 60px rgba(0, 0, 0, 0.6); }

.stage.slide { font-family: var(--display); }
/* gradient shells are dark on both themes: switch the text tokens locally */

  --border: rgba(230, 234, 240, 0.14); --border-strong: rgba(230, 234, 240, 0.38); --dash: rgba(230, 234, 240, 0.32);
  --green: #9BE69A; --green-bg: #0B3D2E; --blue: #9DD2FF; --blue-bg: #1E2867; --purple: #B8C0FF; --purple-bg: #2E1C6D; --amber: #FDD663; --amber-bg: #4A3300; --red: #FF6B7D; --red-bg: #4E1B24; --gray-bg: #2F3034; }
.stage.slide.grad-hero { background: var(--grad-hero); }
.stage.slide.grad-bleed { background: var(--grad-bleed); }
.stage.slide.grad-sandbox { background: var(--grad-sandbox); }
.stage.slide.dotgrid::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 0); background-size: 32px 32px; opacity: 0.4; pointer-events: none; z-index: 0; }

/* panel extras used by slides */

/* inline helpers */
mark.hl { background: var(--blue-bg); color: var(--blue); font-style: italic; font-weight: 500; padding: 0 0.3em; border-radius: 0; }

mark.hl.red { background: var(--red-bg); color: var(--red); } mark.hl.amber { background: var(--amber-bg); color: var(--amber); }
.sdot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--green); vertical-align: middle; margin: -3px 10px 0 0; }
.sdot.blue { background: var(--blue); } .sdot.purple { background: var(--purple); } .sdot.amber { background: var(--amber); } .sdot.red { background: var(--red); } .sdot.gray { background: var(--border-strong); }

.accent { color: var(--blue); font-weight: 500; }

.prose.xs { font-size: 17px; line-height: 1.5; } .prose.sm { font-size: 20px; line-height: 1.5; } .prose.ms { font-size: 24px; line-height: 1.1; } .prose.md { font-size: 32px; } .prose.lg { font-size: 40px; line-height: 1.3; } .prose.xl { font-size: 48px; line-height: 1.4; }

.agenda { position: absolute; z-index: 2; display: flex; flex-direction: column; gap: 29px; }

.scard .kicker.blue { color: var(--blue); } .scard .kicker.green { color: var(--green); } .scard .kicker.purple { color: var(--purple); } .scard .kicker.amber { color: var(--amber); } .scard .kicker.gray { color: var(--muted); }
.scard .cpill { display: inline-block; width: max-content; padding: 6px 16px; border-radius: 16px; font-size: 14.4px; font-weight: 500; letter-spacing: 0.02em; margin-bottom: 24px; }

.callout .ctitle { font-size: 29.6px; font-weight: 500; margin-bottom: 8px; }

/* modal, attachment, visualizer, skeleton */

.box.scard-dmi {
  padding: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface); align-items: stretch; justify-content: flex-start;
  text-align: left; gap: 0;
}
.box.scard-dmi .shead {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 18px 24px; border-bottom: 1px solid var(--surface-3, var(--border));
}
.box.scard-dmi .shead .stitle {
  font-family: var(--serif); font-size: 20px; font-weight: 400; color: var(--ink); line-height: 1.25;
}
.box.scard-dmi .sbadge {
  font-family: var(--mono); font-size: 11.5px; font-weight: 500; letter-spacing: 0.05em;
  text-transform: uppercase; padding: 4px 10px; border-radius: 4px;
  background: var(--surface-2); color: var(--ink); white-space: nowrap; flex: none;
}
.box.scard-dmi .sbadge.pink, .box.scard-dmi .sbadge.red { background: var(--red-wash, var(--red-bg)); color: var(--red); }
.box.scard-dmi .sbadge.green { background: var(--green-wash, var(--green-bg)); color: var(--green); }
.box.scard-dmi .sbadge.blue { background: var(--blue-wash, var(--blue-bg)); color: var(--blue); }
.box.scard-dmi .sbadge.amber { background: var(--amber-wash, var(--amber-bg)); color: var(--amber); }
.box.scard-dmi .sbadge.purple { background: var(--purple-wash, var(--purple-bg)); color: var(--purple); }
.box.scard-dmi .ssec {
  padding: 18px 24px; border-top: 1px solid var(--surface-3, var(--border));
  display: flex; flex-direction: column; gap: 8px;
}
.box.scard-dmi .ssec.first { border-top: 0; }
.box.scard-dmi .ssec.grow { flex: 1 1 auto; }
.box.scard-dmi .ssec.pink, .box.scard-dmi .ssec.red { background: var(--red-wash, var(--red-bg)); border-top-color: #EFE2E8; }
.box.scard-dmi .ssec.green { background: var(--green-wash, var(--green-bg)); border-top-color: #DCECD9; }
.box.scard-dmi .ssec.blue { background: var(--blue-wash, var(--blue-bg)); border-top-color: #DCE8F5; }
.box.scard-dmi .ssec.amber { background: var(--amber-wash, var(--amber-bg)); border-top-color: #EFE5CE; }
.box.scard-dmi .ssec.gray { background: var(--surface-2); }
.box.scard-dmi .skicker {
  font-family: var(--mono); font-size: 11.5px; font-weight: 500; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--muted); line-height: 1.3;
}
.box.scard-dmi .sbody {
  font-family: var(--serif); font-size: 16px; font-weight: 400; line-height: 1.48; color: var(--ink);
}
.box.scard-dmi .sbody.lg { font-size: 18.5px; line-height: 1.42; }
.box.scard-dmi .sbody.sans { font-family: var(--font); font-size: 14.5px; color: var(--muted); }
.box.scard-dmi .sbody.mono { font-family: var(--mono); font-size: 14px; color: var(--muted); line-height: 1.55; }
.box.scard-dmi .snote {
  font-family: var(--font); font-size: 14px; font-weight: 400; color: var(--muted); line-height: 1.4;
}
.box.scard-dmi .snote.serif { font-family: var(--serif); font-size: 14.5px; }
.box.scard-dmi .snote b { color: var(--ink); font-weight: 500; }
.box.scard-dmi .sitem { padding: 14px 0; border-top: 1px solid var(--surface-3, var(--border)); }
.box.scard-dmi .sitem:first-child { padding-top: 2px; border-top: 0; }
.box.scard-dmi .sitem:last-child { padding-bottom: 2px; }
.box.scard-dmi .sitem-title { font-family: var(--font); font-size: 14.5px; font-weight: 600; color: var(--ink); line-height: 1.35; margin-bottom: 4px; }
.box.scard-dmi .sitem-title .muted { font-weight: 400; color: var(--muted); }
.box.scard-dmi .sitem-txt { font-family: var(--font); font-size: 14px; font-weight: 400; color: var(--muted); line-height: 1.42; }

/* DeepMind Institute academic tables + 4-tier heatmaps (kit-tables.js) */
[data-theme="dmi"] .table, .table.dmi {
  background: transparent; border: 0; border-radius: 0; padding: 0;
}
.table .tcap {
  font-family: var(--serif); font-size: 20px; font-weight: 400; color: var(--ink);
  line-height: 1.36; margin-bottom: 16px; max-width: 720px;
}
[data-theme="dmi"] .table .tframe, .table.dmi .tframe {
  border-bottom: 2px solid #18181B; background: var(--surface);
}
[data-theme="dmi"] .table .trow, .table.dmi .trow {
  gap: 0; padding: 0; border-bottom: 1px solid var(--border); align-items: stretch;
}
[data-theme="dmi"] .table .trow:last-child, .table.dmi .trow:last-child {
  border-bottom: none;
}
[data-theme="dmi"] .table .trow.thead, .table.dmi .trow.thead {
  background: #18181B; border-bottom: 0; padding: 0; align-items: flex-end;
}
[data-theme="dmi"] .table .trow.thead .tcell, .table.dmi .trow.thead .tcell {
  color: #FAFAFA; font-family: var(--serif); font-size: 14px; font-weight: 400;
  line-height: 1.28; padding: 12px 12px; align-content: flex-end;
}
[data-theme="dmi"] .table .tcell, .table.dmi .tcell {
  font-family: var(--serif); font-size: 14.5px; font-weight: 400; line-height: 1.38;
  color: var(--ink); padding: 12px 12px; display: block; align-content: center;
}
[data-theme="dmi"] .table .tcell.top, .table.dmi .tcell.top { align-content: flex-start; }
[data-theme="dmi"] .table .tcell.center, .table.dmi .trow.thead .tcell.center, .table.dmi .tcell.center {
  text-align: center;
}
[data-theme="dmi"] .table .trow.tsec, .table.dmi .trow.tsec {
  background: var(--surface); border-bottom: 1px solid var(--border);
}
[data-theme="dmi"] .table .trow.tsec .tcell, .table.dmi .trow.tsec .tcell {
  font-family: var(--serif); font-size: 13px; font-weight: 400; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--ink); padding: 13px 12px 11px;
}
.table .tcell.tier-high, .table .tcell.tier-t1,
.table .tcell.tier-moderate, .table .tcell.tier-t2,
.table .tcell.tier-mixed, .table .tcell.tier-t3,
.table .tcell.tier-low, .table .tcell.tier-t4 {
  text-align: center; font-variant-numeric: tabular-nums;
  border-left: 1.5px solid var(--surface); color: #0D2340;
}
.table .tcell.tier-high, .table .tcell.tier-t1 { background: #C2E0F9; }
.table .tcell.tier-moderate, .table .tcell.tier-t2 { background: #E3F0FB; }
.table .tcell.tier-mixed, .table .tcell.tier-t3 { background: #F4F4F5; color: #2F3034; }
.table .tcell.tier-low, .table .tcell.tier-t4 { background: #FBDCE6; color: #2F3034; }
[data-theme="dark"] .table .tcell.tier-high, [data-theme="dark"] .table .tcell.tier-t1 { background: #1E3A5F; color: #E8F1FC; }
[data-theme="dark"] .table .tcell.tier-moderate, [data-theme="dark"] .table .tcell.tier-t2 { background: #172A45; color: #C5DCF5; }
[data-theme="dark"] .table .tcell.tier-mixed, [data-theme="dark"] .table .tcell.tier-t3 { background: #26272C; color: #D5D8DF; }
[data-theme="dark"] .table .tcell.tier-low, [data-theme="dark"] .table .tcell.tier-t4 { background: #4A1D2C; color: #F9D2DF; }
.table .ttiers {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 2px 6px; font-family: var(--serif); font-size: 13px; color: var(--ink);
}
.table .ttiers .tlabel { font-weight: 600; color: var(--ink); }
.table .ttiers .tsw { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
.table .ttiers .tsw i { display: inline-block; width: 12px; height: 12px; border: 1px solid var(--border); }
.table .ttiers .tsw i.high { background: #C2E0F9; }
.table .ttiers .tsw i.moderate { background: #E3F0FB; }
.table .ttiers .tsw i.mixed { background: #F4F4F5; }
.table .ttiers .tsw i.low { background: #FBDCE6; }
.table .tfoot {
  font-family: var(--serif); font-size: 13px; color: var(--muted); line-height: 1.45;
  padding-top: 6px; display: flex; flex-direction: column; gap: 6px;
}

/* ------------------------------------------------------------------ */
/* Neural architecture primitives (tokenRow, vecStrip, sumNode, etc.) */

[data-theme="dmi"] .box.xs:not(.mono):not(.caps) .title { font-size: 12px; font-weight: 500; line-height: 1.15; white-space: nowrap; }
[data-theme="dmi"] .box.xs .sub { font-size: 10.5px; line-height: 1.12; white-space: nowrap; }
.panel.white { background: var(--surface); border: 1.8px solid var(--ink); border-radius: 12px; }
.panel.navy  { background: #1B365D; border: 2px solid #0F2342; border-radius: 12px; }
[data-theme="dark"] .panel.navy { background: #1E3A5F; border-color: #60A5FA; }
.panel.head-right, .panel.head-center { padding: 7px 14px; }
.panel.head-right .ptitle { margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 12.5px; font-weight: 700; line-height: 1.1; color: var(--ink); }
.panel.head-center .ptitle { margin-left: auto; margin-right: auto; text-transform: none; letter-spacing: 0; font-size: 14.5px; font-weight: 700; line-height: 1.15; color: var(--ink); }

.tokens {
  position: absolute; z-index: 3; display: inline-flex; flex-direction: column;
  align-items: center; gap: 4px; width: max-content;
}
.tokens .ttags, .tokens .tcaps {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
}
.tokens .ttag {
  font-family: var(--font); font-size: 12px; font-weight: 700; line-height: 1.1;
  padding: 3px 7px; border-radius: 6px 6px 2px 2px; border: 1.5px solid var(--ink);
  color: #18181B; white-space: nowrap;
}
.tokens .ttag.green { background: #B9F6CA; border-color: #1B5E20; color: #0D3B10; }
.tokens .ttag.pink  { background: #F8BBD0; border-color: #880E4F; color: #560027; }
.tokens .ttag.blue  { background: #BBDEFB; border-color: #0D47A1; color: #0D2340; }
.tokens .tcap {
  font-family: var(--font); font-size: 13px; font-weight: 700; line-height: 1.15;
  padding: 5px 9px; background: #18181B; color: #FFFFFF;
  border: 1.5px solid #18181B; border-radius: 9px 9px 2px 2px; white-space: nowrap;
}
.tokens.bottom .tcap { border-radius: 2px 2px 9px 9px; }
.tokens.pill .tcap   { border-radius: 7px; }
[data-theme="dark"] .tokens .tcap { background: #E4E4E7; color: #18181B; border-color: #E4E4E7; }
.tokens .tcap.green { background: #B9F6CA; color: #0D3B10; border-color: #1B5E20; }
.tokens .tcap.pink  { background: #F8BBD0; color: #560027; border-color: #880E4F; }
.tokens .tdots { font-weight: 700; font-size: 14px; color: var(--ink); padding: 0 3px; }

.vecstrip {
  position: absolute; z-index: 3; display: inline-flex; align-items: center;
  justify-content: center; gap: 6px; padding: 2px 4px; background: var(--bg);
  border-radius: 4px; width: max-content;
}
.vecstrip.on-blue { background: color-mix(in srgb, var(--blue-bg) 55%, var(--bg)); }
.vecstrip.on-white { background: var(--surface); }
.vecstrip .vvec {
  display: inline-flex; border: 1.4px solid #18181B; border-radius: 2px; overflow: hidden;
}
[data-theme="dark"] .vecstrip .vvec { border-color: #E4E4E7; }
.vecstrip .vcell {
  display: inline-block; border-right: 1.2px solid #18181B;
}
[data-theme="dark"] .vecstrip .vcell { border-right-color: #18181B; }
.vecstrip .vcell:last-child { border-right: 0; }
.vecstrip .vdots { font-weight: 700; font-size: 14px; line-height: 1; color: var(--ink); padding: 0 2px; }

[data-theme="dark"] .table.dmi .tframe { border-bottom-color: var(--border-strong); }
[data-theme="dark"] .table.dmi .trow.thead { background: #27272A; }
.box.sumnode {
  padding: 0; min-height: 0; border-radius: 50%; background: var(--surface);
  border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center;
}
.box.sumnode .title {
  font-family: var(--font) !important; font-size: 13px !important; font-weight: 700 !important;
  line-height: 1 !important; color: var(--ink); margin: 0;
}

.wires g.repeat-brace path.brace {
  fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
}
.wires g.repeat-brace text.repeat-lbl {
  font-family: var(--font); font-size: 14px; font-weight: 700; fill: var(--ink); stroke: none;
}
[data-theme="dmi"] .wires g.repeat-brace text.repeat-lbl {
  font-family: var(--mono); font-size: 13.5px; font-weight: 600; fill: var(--ink);
}
.wires circle.pin {
  fill: var(--surface); stroke: var(--ink); stroke-width: 1.8;
}

.box.patch-img {
  padding: 0; min-height: 0; overflow: hidden; border-radius: 6px;
  border: 2px solid #18181B; background: #87CEEB;
}
[data-theme="dark"] .box.patch-img { border-color: #E4E4E7; }
.box.patch-img .psvg { display: block; width: 100%; height: 100%; }
.box.patch-img .pgrid { stroke: #18181B; stroke-width: 2; }

.box.audio-wave {
  padding: 0; min-height: 0; overflow: hidden; border-radius: 8px;
  border: 1.5px solid var(--border-strong); background: var(--surface); color: var(--ink);
}
.box.audio-wave .wsvg { display: block; width: 100%; height: 100%; }
.box.audio-wave .wsvg line { stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }

.box.or-pill {
  padding: 0; min-height: 0; background: transparent !important; border: 0 !important;
}
.box.or-pill .title {
  font-size: 12.5px !important; font-weight: 700 !important; color: var(--ink) !important; line-height: 1 !important;
}

/* ---------- abstract drafting scenes (kit-abstract.js) ---------- */
.abstract {
  position: absolute; z-index: 2; overflow: hidden;
}
.abstract.frame-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
}
[data-theme="dmi"] .abstract.frame-card {
  border-radius: 2px;
}
.abstract.frame-soft {
  background: var(--surface-2); border-radius: var(--radius);
}
.abstract .abs-svg {
  display: block; width: 100%; height: 100%;
}

/* Abstract fills */
.abstract .abs-fill-none { fill: none; }
.abstract .abs-fill-surface { fill: var(--surface); }
.abstract .abs-fill-surface2 { fill: var(--surface-2); }
.abstract .abs-fill-bg { fill: var(--bg); }
.abstract .abs-fill-ink { fill: var(--ink); }
.abstract .abs-fill-tone.tone-blue   { fill: var(--blue-bg); }
.abstract .abs-fill-tone.tone-pink   { fill: var(--pink-bg); }
.abstract .abs-fill-tone.tone-red    { fill: var(--red-bg); }
.abstract .abs-fill-tone.tone-green  { fill: var(--green-bg); }
.abstract .abs-fill-tone.tone-purple { fill: var(--purple-bg); }
.abstract .abs-fill-tone.tone-amber  { fill: var(--amber-bg); }
.abstract .abs-fill-tone.tone-teal   { fill: var(--teal-bg); }
.abstract .abs-fill-tone.tone-gray   { fill: var(--gray-bg); }

.abstract .abs-fill-wash.tone-blue   { fill: var(--blue-wash); }
.abstract .abs-fill-wash.tone-pink   { fill: var(--pink-wash); }
.abstract .abs-fill-wash.tone-red    { fill: var(--red-wash); }
.abstract .abs-fill-wash.tone-green  { fill: var(--green-wash); }
.abstract .abs-fill-wash.tone-purple { fill: var(--purple-wash); }
.abstract .abs-fill-wash.tone-amber  { fill: var(--amber-wash); }
.abstract .abs-fill-wash.tone-teal   { fill: var(--teal-wash); }
.abstract .abs-fill-wash.tone-gray   { fill: var(--gray-wash); }

/* Abstract strokes & patterns */
.abstract .abs-stroke-none { stroke: none; }
.abstract .abs-stroke {
  stroke: var(--ink); stroke-width: 1.45; stroke-linecap: round; stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}
.abstract .abs-thin   { stroke-width: 1.05; }
.abstract .abs-thick  { stroke-width: 5.5; stroke-linecap: butt; stroke-linejoin: miter; }
.abstract .abs-faint  { stroke: var(--border-strong); stroke-width: 1; }
.abstract .abs-dash   { stroke-dasharray: 5.5 4.5; }
.abstract .abs-dot    { stroke-dasharray: 1.6 4.2; }
.abstract .abs-center { stroke-dasharray: 11 4.5 2 4.5; }
.abstract .abs-rim    { stroke: var(--surface); stroke-width: 1.5; opacity: 0.88; }
.abstract .abs-pat-line { stroke: var(--ink); stroke-width: 1.05; opacity: 0.72; }
.abstract .abs-pat-dot  { fill: var(--ink); opacity: 0.65; }

/* ---------- swarm dot field (kit-abstract.js) ---------- */
.swarm {
  position: absolute; z-index: 3; overflow: visible;
}
.swarm .swarm-svg {
  display: block; width: 100%; height: 100%; overflow: visible;
}
.swarm .swarm-dot {
  fill: var(--muted); opacity: 0.65;
}
.swarm .swarm-dot.hi {
  fill: var(--ink); opacity: 0.82;
}
.swarm .swarm-dm-line {
  stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 4 3;
}
.swarm .swarm-dm-ring {
  fill: var(--surface); stroke: var(--ink); stroke-width: 1.5;
}
.swarm .swarm-dm-dot {
  fill: var(--ink);
}
.swarm .swarm-dm-text {
  font-family: var(--mono); font-size: 11px; font-weight: 600; fill: var(--ink);
}

/* ---------- cumulative step & area timeline (kit-abstract.js) ---------- */
.stepchart {
  position: absolute; z-index: 2; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
}
[data-theme="dmi"] .stepchart {
  border-radius: 2px;
}
.stepchart .stepchart-svg {
  display: block; width: 100%; height: 100%;
}
.stepchart .sc-legend {
  position: absolute; top: 20px; left: 82px; right: 42px;
  display: flex; align-items: center; justify-content: center; gap: 32px; flex-wrap: wrap;
}
.stepchart .sc-leg-item {
  display: inline-flex; align-items: center; gap: 8px;
}
.stepchart .sc-leg-dot {
  width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink);
}
.stepchart .sc-leg-dot.tone-green { background: var(--green); border-color: var(--green); }
.stepchart .sc-leg-dot.tone-gray  { background: var(--muted); border-color: var(--muted); }
.stepchart .sc-leg-dot.tone-pink  { background: var(--pink-bg); border-color: var(--pink); }
.stepchart .sc-leg-dot.tone-blue  { background: var(--blue-bg); border-color: var(--blue); }
.stepchart .sc-leg-text {
  font-family: var(--font); font-size: 14px; color: var(--ink); white-space: nowrap;
}
[data-theme="dmi"] .stepchart .sc-leg-text {
  font-family: var(--serif); font-size: 15px;
}
.stepchart .sc-frame {
  fill: var(--bg); stroke: var(--ink); stroke-width: 1.25;
}
.stepchart .sc-grid, .stepchart .sc-grid-v {
  stroke: var(--border); stroke-width: 1;
}
.stepchart .sc-tick {
  stroke: var(--ink); stroke-width: 1.2;
}
.stepchart .sc-ytick {
  position: absolute; text-align: right; font-family: var(--mono); font-size: 12px; color: var(--muted);
}
.stepchart .sc-xtick {
  position: absolute; text-align: center; font-family: var(--mono); font-size: 12px; color: var(--muted);
}
.stepchart .sc-xtitle {
  position: absolute; text-align: center; font-family: var(--font); font-size: 14px; font-weight: 600; color: var(--ink);
}
[data-theme="dmi"] .stepchart .sc-xtitle {
  font-family: var(--serif); font-size: 15.5px; font-weight: 500;
}
.stepchart .sc-ytitle-svg {
  font-family: var(--font); font-size: 14px; font-weight: 600; fill: var(--ink);
}
[data-theme="dmi"] .stepchart .sc-ytitle-svg {
  font-family: var(--serif); font-size: 15.5px; font-weight: 500;
}
.stepchart .sc-area.tone-pink { fill: var(--pink-bg); opacity: 0.85; }
.stepchart .sc-area.tone-blue { fill: var(--blue-bg); opacity: 0.85; }
.stepchart .sc-area-edge.tone-pink { fill: none; stroke: var(--pink); stroke-width: 1.6; opacity: 0.7; }
.stepchart .sc-area-edge.tone-blue { fill: none; stroke: var(--blue); stroke-width: 1.6; opacity: 0.7; }
.stepchart .sc-line { fill: none; stroke-width: 2.4; stroke-linejoin: round; }
.stepchart .sc-line.tone-green { stroke: var(--green); }
.stepchart .sc-line.tone-gray  { stroke: var(--muted); }
.stepchart .sc-line.tone-ink   { stroke: var(--ink); }
.stepchart .sc-vline {
  stroke: var(--ink); stroke-width: 1.4; stroke-dasharray: 6 4;
}
.stepchart .sc-vline-top {
  position: absolute; text-align: right; font-family: var(--font); font-size: 12.5px; line-height: 1.3; color: var(--ink);
}
.stepchart .sc-vline-pill {
  position: absolute; font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em;
  padding: 4px 8px; background: var(--surface); border: 1px solid var(--border-strong); color: var(--muted);
  white-space: nowrap;
}
.stepchart .sc-leader {
  stroke: var(--ink); stroke-width: 1.15;
}
.stepchart .sc-dot.tone-ink   { fill: var(--ink); }
.stepchart .sc-dot.tone-green { fill: var(--green); }
.stepchart .sc-dot.tone-pink  { fill: var(--pink); }
.stepchart .sc-dot.tone-blue  { fill: var(--blue); }
.stepchart .sc-callout {
  position: absolute; font-family: var(--font); font-size: 12.5px; line-height: 1.28; color: var(--ink);
}
[data-theme="dmi"] .stepchart .sc-callout,
[data-theme="dmi"] .stepchart .sc-vline-top {
  font-family: var(--serif); font-size: 13px;
}
.stepchart .sc-callout .mono, .stepchart .sc-vline-top .mono {
  font-family: var(--mono); font-size: 11.5px; color: var(--muted);
}

/* ------------------------------------------------------------------ */
/* Deslopped Minimal Theme ([data-theme="apple"])                     */
[data-theme="apple"],
[data-theme="apple"] * {
  letter-spacing: 0 !important;
  font-style: normal !important;
  box-shadow: none !important;
}
[data-theme="apple"] {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-variant-numeric: tabular-nums;
}
[data-theme="apple"] .stage,
[data-theme="apple"] .stage.white {
  background: #FFFFFF !important;
  border: none !important;
}
[data-theme="apple"] .box {
  background: #F5F5F7 !important;
  border: none !important;
  border-radius: 12px !important;
  color: #111111 !important;
}
[data-theme="apple"] .box .title {
  font-weight: 500;
  color: #111111 !important;
}
[data-theme="apple"] .box.strong,
[data-theme="apple"] .box.ink {
  background: #111111 !important;
  border: none !important;
  color: #FFFFFF !important;
}
[data-theme="apple"] .box.strong .title,
[data-theme="apple"] .box.ink .title {
  color: #FFFFFF !important;
}
[data-theme="apple"] .card,
[data-theme="apple"] .card.light {
  background: #F5F5F7 !important;
  border: none !important;
  border-radius: 12px !important;
}
[data-theme="apple"] .card pre,
[data-theme="apple"] .card pre span {
  color: #111111 !important;
  background: transparent !important;
  border: none !important;
}
[data-theme="apple"] .anno {
  color: #111111 !important;
  font-weight: 600;
  font-size: 18px;
}
[data-theme="apple"] .table {
  background: #FFFFFF !important;
  border: none !important;
  border-radius: 0 !important;
}
[data-theme="apple"] .table .trow,
[data-theme="apple"] .table .trow.thead {
  background: #FFFFFF !important;
  border: none !important;
}
[data-theme="apple"] .table .tcell,
[data-theme="apple"] .table .trow.thead .tcell {
  font-family: var(--font);
  font-size: 16px;
  font-weight: 400;
  text-transform: none;
  color: #111111 !important;
  border: none !important;
}
[data-theme="apple"] .table .trow.thead .tcell {
  font-weight: 600;
}
[data-theme="apple"] .wires g,
[data-theme="apple"] .wires g * {
  stroke: #111111 !important;
}
[data-theme="apple"] .wires text {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 500;
  fill: #111111 !important;
  stroke: none !important;
}
[data-theme="apple"] .wires text.halo {
  stroke: #FFFFFF !important;
  stroke-width: 8px !important;
  paint-order: stroke;
}




/* ---------- product app mocks (kit-apps.js): Slack + Google Sheets ----------
   Branded on purpose; colours come only from the --slack-* / --sheet-* tokens.
   Laid out at 1:1 product density inside a zoomed .sk-app / .sh-app box. */
.slackui, .sheetui { position: absolute; z-index: 2; overflow: hidden; font-family: var(--font); border-radius: 12px; box-shadow: 0 0 0 1px var(--border), 0 18px 50px rgba(0, 0, 0, 0.14); }
.slackui.bleed, .sheetui.bleed { border-radius: 0; box-shadow: none; }
.slackui svg, .sheetui svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.slackui svg.fill, .sheetui svg.fill { fill: currentColor; stroke: none; }
.ap-ic { display: inline-flex; width: 18px; height: 18px; flex: none; }
.sk-t-blue, .sh-t-blue { background: var(--blue-bg); color: var(--blue); } .sk-t-purple, .sh-t-purple { background: var(--purple-bg); color: var(--purple); }
.sk-t-green, .sh-t-green { background: var(--green-bg); color: var(--green); } .sk-t-amber, .sh-t-amber { background: var(--amber-bg); color: var(--amber); }
.sk-t-teal, .sh-t-teal { background: var(--teal-bg); color: var(--teal); } .sk-t-pink, .sh-t-pink { background: var(--pink-bg); color: var(--pink); }
.sk-t-red, .sh-t-red { background: var(--red-bg); color: var(--red); } .sk-t-gray, .sh-t-gray { background: var(--gray-bg); color: var(--gray); }
.sk-t-ink { background: var(--slack-ink); color: var(--slack-bg); }

/* Slack: window, top bar, rail */
.sk-app { display: grid; grid-template-columns: 70px minmax(0, 1fr); grid-template-rows: 40px minmax(0, 1fr); background: var(--slack-window); color: var(--slack-ink); font-size: 15px; line-height: 1.4667; overflow: hidden; }
.sk-app.nochrome { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
.sk-top { grid-column: 1 / -1; display: flex; align-items: center; padding: 0 12px 0 70px; color: var(--slack-chrome-ink); min-width: 0; }
.sk-nav { width: 260px; flex: none; display: flex; justify-content: flex-end; gap: 14px; padding-right: 18px; }
.sk-nav .ap-ic { width: 18px; height: 18px; }
.sk-nav .ap-ic:nth-child(2) { opacity: 0.5; }
.sk-search { flex: 1; max-width: 720px; margin: 0 auto; height: 26px; border-radius: 6px; background: var(--slack-search); display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 13px; white-space: nowrap; overflow: hidden; }
.sk-search .ap-ic { width: 15px; height: 15px; }
.sk-help { width: 26px; display: flex; justify-content: flex-end; margin-left: 12px; } .sk-help .ap-ic { width: 18px; height: 18px; }
.sk-rail { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 4px 0 14px; color: var(--slack-chrome-ink); min-height: 0; overflow: hidden; }
.sk-ws { width: 36px; height: 36px; border-radius: 9px; background: var(--slack-ws); color: var(--slack-ws-ink); font-weight: 700; font-size: 14px; display: grid; place-items: center; margin-bottom: 6px; flex: none; }
.sk-rb { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; line-height: 1.2; flex: none; }
.sk-rbi { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; }
.sk-rbi .ap-ic { width: 20px; height: 20px; }
.sk-rb.on .sk-rbi { background: var(--slack-rail-on); }
.sk-rgrow { flex: 1; }
.sk-rplus { width: 36px; height: 36px; border-radius: 50%; background: var(--slack-rail-on); display: grid; place-items: center; flex: none; } .sk-rplus .ap-ic { width: 18px; height: 18px; }
.sk-me { position: relative; flex: none; } .sk-me .sk-av { width: 36px; height: 36px; border-radius: 9px; }
.sk-me .sk-pres { position: absolute; right: -3px; bottom: -3px; box-shadow: 0 0 0 3px var(--slack-window); }
.sk-win { display: flex; min-width: 0; min-height: 0; margin: 0 6px 6px 0; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px var(--slack-win-border); background: var(--slack-bg); }
.sk-app.nochrome .sk-win { margin: 0; border-radius: 0; }
.sk-grow { flex: 1; }
.sk-sbtn { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; flex: none; } .sk-sbtn .ap-ic { width: 18px; height: 18px; }

/* Slack: channel sidebar */
.sk-side { width: 260px; flex: none; background: var(--slack-sidebar); color: var(--slack-side-ink); display: flex; flex-direction: column; min-height: 0; }
.sk-shead { height: 50px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 10px 0 16px; color: var(--slack-side-strong); }
.sk-wsname { font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sk-wschev { width: 16px; height: 16px; margin-left: 2px; }
.sk-slist { flex: 1; min-height: 0; overflow: hidden; padding: 6px 0 12px; }
.sk-row { height: 28px; margin: 0 8px; padding: 0 10px 0 16px; display: flex; align-items: center; gap: 8px; border-radius: 6px; font-size: 15px; white-space: nowrap; }
.sk-row .sk-rname { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sk-row .sk-rowic { width: 16px; height: 16px; }
.sk-row.unread { color: var(--slack-side-strong); font-weight: 700; }
.sk-row.muted { opacity: 0.5; }
.sk-row.on { background: var(--slack-active); color: var(--slack-active-ink); }
.sk-row .sk-badge { margin-left: auto; }
.sk-badge { min-width: 20px; height: 18px; padding: 0 6px; border-radius: 9px; background: var(--slack-badge); color: var(--slack-badge-ink); font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; line-height: 1; }
.sk-sec { height: 28px; margin: 12px 8px 2px; padding: 0 10px 0 6px; display: flex; align-items: center; gap: 6px; font-size: 15px; }
.sk-sec .ap-ic { width: 16px; height: 16px; }
.sk-addic { width: 20px; height: 20px; border-radius: 5px; background: var(--slack-side-chip); display: grid; place-items: center; flex: none; margin-left: -2px; } .sk-addic .ap-ic { width: 14px; height: 14px; }
.sk-dav { position: relative; width: 20px; height: 20px; flex: none; margin-left: -2px; }
.sk-dav .sk-av { width: 20px; height: 20px; border-radius: 5px; font-size: 11px; }
.sk-pres { position: absolute; right: -3px; bottom: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--slack-presence); box-shadow: 0 0 0 2px var(--slack-sidebar); }
.sk-pres.away { background: var(--slack-sidebar); box-shadow: inset 0 0 0 1.5px var(--slack-side-ink), 0 0 0 2px var(--slack-sidebar); }
.sk-row.on .sk-pres { box-shadow: 0 0 0 2px var(--slack-active); }
.sk-row.on .sk-pres.away { background: var(--slack-active); box-shadow: inset 0 0 0 1.5px var(--slack-active-ink), 0 0 0 2px var(--slack-active); }
.sk-appb { flex: none; font-size: 10px; font-weight: 700; line-height: 1; padding: 3px 3px 2px; border-radius: 3px; background: var(--slack-chip); color: var(--slack-muted); letter-spacing: 0.02em; }
.sk-side .sk-appb { background: var(--slack-side-chip); color: var(--slack-side-ink); }
.sk-row.on .sk-appb { color: var(--slack-active-ink); }

/* Slack: channel pane */
.sk-main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--slack-bg); }
.sk-chead { flex: none; height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 20px; color: var(--slack-ink); }
.sk-cname { display: flex; align-items: center; gap: 2px; font-size: 18px; font-weight: 700; white-space: nowrap; flex: none; }
.sk-cname > .ap-ic:first-child { width: 18px; height: 18px; margin-right: 2px; }
.sk-cname > .ap-ic:first-child svg { stroke-width: 2.3; }
.sk-cchev { width: 16px; height: 16px; color: var(--slack-muted); }
.sk-topic { flex: 1; min-width: 0; font-size: 13px; color: var(--slack-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 6px; }
.sk-members { flex: none; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 4px; border: 1px solid var(--slack-border-strong); border-radius: 6px; font-size: 13px; font-weight: 700; color: var(--slack-muted); }
.sk-stack { display: flex; }
.sk-stack .sk-av { width: 20px; height: 20px; border-radius: 5px; font-size: 9px; box-shadow: 0 0 0 2px var(--slack-bg); }
.sk-stack .sk-av + .sk-av { margin-left: -4px; }
.sk-huddle { flex: none; display: flex; align-items: center; gap: 2px; height: 28px; padding: 0 4px 0 8px; border: 1px solid var(--slack-border-strong); border-radius: 6px; color: var(--slack-muted); }
.sk-huddle .ap-ic:last-child { width: 14px; height: 14px; }
.sk-chead .sk-sbtn { color: var(--slack-muted); }
.sk-tabs { flex: none; display: flex; align-items: flex-end; gap: 6px; padding: 0 16px; height: 34px; border-bottom: 1px solid var(--slack-border); font-size: 13px; color: var(--slack-muted); }
.sk-tab { display: flex; align-items: center; gap: 6px; padding: 0 6px; height: 34px; border-bottom: 2px solid transparent; font-weight: 700; white-space: nowrap; }
.sk-tab .ap-ic { width: 16px; height: 16px; }
.sk-tab.on { color: var(--slack-ink); border-bottom-color: var(--slack-tab-on); }
.sk-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.sk-scroll::-webkit-scrollbar { display: none; }
.sk-feedin { min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 0 12px; }
.sk-thread .sk-feedin { justify-content: flex-start; }
.sk-date { position: relative; display: flex; justify-content: center; align-items: center; height: 28px; margin: 10px 0 6px; flex: none; }
.sk-date::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--slack-border); }
.sk-date > span { position: relative; display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px 0 16px; border: 1px solid var(--slack-border); border-radius: 14px; background: var(--slack-bg); font-size: 13px; font-weight: 700; box-sizing: border-box; }

/* Slack: messages */
.sk-msg { display: grid; grid-template-columns: 36px minmax(0, 1fr); column-gap: 8px; padding: 8px 20px; flex: none; }
.sk-msg.cont { padding-top: 2px; }
.sk-msg.sel { background: var(--slack-hover); }
